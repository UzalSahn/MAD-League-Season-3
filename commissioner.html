<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — The MAD League</title>
<meta name="description" content="Manage the MAD League, player PIN accounts, and commissioner settings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}

  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px,1fr));gap:16px;}
  .settings-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.06em;color:var(--cream-dim);margin-bottom:6px;
  }
  .settings-field input[type="number"], .settings-field input[type="text"]{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .settings-field input:focus{border-color:var(--gold);}
  .settings-checkbox-label{
    display:flex !important;align-items:center;gap:8px;font-family:var(--body) !important;
    text-transform:none !important;letter-spacing:0 !important;font-size:14px !important;color:var(--cream) !important;
    cursor:pointer;
  }
  .settings-note{font-size:12.5px;color:var(--cream-dim);margin:10px 0 0;}
  .btn-sm{padding:7px 14px;font-size:11px;}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:#EE1515;color:#FF8A8A;}
  .member-manage-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .member-manage-item{display:flex;align-items:center;gap:12px;background:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:9px 14px;}
  .member-manage-avatar, .member-manage-avatar-placeholder{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--slate,#333);flex-shrink:0;}
  .member-manage-name{flex:1;font-weight:600;font-size:13.5px;}
  .settings-hint{display:block;font-size:11px;color:var(--cream-dim);margin-top:5px;font-weight:400;text-transform:none;letter-spacing:0;}
  .settings-status{font-size:13px;margin-top:12px;}
  .trade-card{background:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;}
  .trade-summary{font-size:13.5px;line-height:1.6;}
  .trade-actions{display:flex;gap:8px;margin-top:12px;}
  .veto-count{font-family:var(--mono);font-size:11.5px;color:var(--gold);margin-top:8px;}
  .recent-tx-details summary{
    cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  }
  .recent-tx-details summary::-webkit-details-marker{display:none;}
  .recent-tx-details summary::before{content:"▸";color:var(--gold);font-size:16px;transition:transform .15s ease;flex-shrink:0;}
  .recent-tx-details[open] summary::before{transform:rotate(90deg);}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>

<script type="module">
  import { appendValue, createPlayer, fetchPlayers, onUserChange, signOut, subscribeLeague, updateLeague, updatePlayer } from './league-api.js';

function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const DEFAULT_SETTINGS = {
    draftBudget: 100,
    rosterSize: 10,
    maxTeams: 12,
    playoffTeams: 4,
    faPickupsPerSeason: 2,
    waiverPeriodDays: 2,
    faMaxPerSwap: 2,
    tradesPerSeason: 5,
    maxPokemonPerSide: 3,
    vetoEnabled: true,
    vetoThreshold: 4,
    tradeDeadlineWeek: 0,
    faDeadlineWeek: 0
  };

  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const leagueId = 'main';

  ['subnavMatch','subnavTeam','subnavFA','subnavTrades','subnavStanding','subnavAnnouncements','subnavDraft','subnavCommish'].forEach(id => {
    const el = document.getElementById(id);
    if(el && leagueId) el.href = el.getAttribute('href') + '?id=' + leagueId;
  });

  let currentUser = null;
  function updateNavGlow(league){
    const glowTab = (id, active) => {
      const el = document.getElementById(id);
      if(el) el.classList.toggle('subnav-tab-glow', !!active);
    };
    if(!currentUser || !league || !league.draft || !league.draft.trainers){
      ['subnavMatch','subnavTrades','subnavStanding','subnavAnnouncements'].forEach(id => glowTab(id, false));
      return;
    }
    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);
    glowTab('subnavTrades', tradesUnseen);

    const announcementsSeenAt = (me && me.announcementsSeenAt) || 0;
    const announcementsUnseen = (league.announcements || []).some(a => (a.timestamp || 0) > announcementsSeenAt);
    glowTab('subnavAnnouncements', announcementsUnseen);

    let matchToken = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ matchToken = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      matchToken = 'w' + idx;
    }
    const matchUnseen = matchToken !== null && matchToken !== (me && me.matchSeenToken);
    glowTab('subnavMatch', matchUnseen);

    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    const standingToken = resultCount > 0 ? String(resultCount) : null;
    const standingUnseen = standingToken !== null && standingToken !== (me && me.standingSeenToken);
    glowTab('subnavStanding', standingUnseen);
  }


  function pendingMoveId(){ return 'm' + Date.now() + Math.random().toString(36).slice(2,6); }
  function getNextMondayMidnight(){
    const now = new Date();
    const day = now.getDay();
    const daysAhead = day === 0 ? 1 : (8 - day);
    const next = new Date(now);
    next.setDate(now.getDate() + daysAhead);
    next.setHours(0,0,0,0);
    return next.getTime();
  }
  function committedMonIds(league, uid){
    const ids = [];
    (league.trades || []).filter(t => t.status === 'finalized_pending' && (t.proposerUid === uid || t.recipientUid === uid)).forEach(t => {
      if(t.proposerUid === uid){ t.offered.forEach(m => ids.push(m.id)); }
      if(t.recipientUid === uid){ t.requested.forEach(m => ids.push(m.id)); }
    });
    (league.pendingMoves || []).filter(m => (m.type === 'fa_swap' || m.type === 'fa_pickup') && m.trainerUid === uid).forEach(m => {
      if(m.type === 'fa_swap') (m.drops || []).forEach(d => ids.push(d.id));
      if(m.type === 'fa_pickup' && m.conditionalDrop) ids.push(m.conditionalDrop.id);
    });
    return ids;
  }
  function tierSum(mons){ return (mons||[]).reduce((s,m) => s + m.tier, 0); }
  function buildWaiverEntry(mon, droppedByUid, droppedByName, settings){
    return {
      monId: mon.id, mon,
      droppedByUid, droppedByName,
      expiresAt: Date.now() + settings.waiverPeriodDays * 86400000,
      claims: []
    };
  }
  const DISCORD_WEBHOOK_FA_TRADES = 'https://discordapp.com/api/webhooks/1545831209819439227/_bllM9VAiCKJcaDnNiltjyJBzKcYjwZnd-EKqVjMuSDPbQHXs_SNC6Kks4pjW7lh5Ixz';
  async function sendDiscordFATrade(content, embeds){
    try{
      await fetch(DISCORD_WEBHOOK_FA_TRADES, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(embeds ? { content, embeds } : { content })
      });

  function discordSpriteUrl(mon){
    const pokeapiId = ID_TO_POKEAPI_ID[mon.id];
    return pokeapiId ? ('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokeapiId + '.png') : null;

  const DISCORD_LOGO_URLS = {};
  function discordLogoFor(trainer){
    if(!trainer || !trainer.coachName) return null;
    return DISCORD_LOGO_URLS[trainer.coachName.trim().toLowerCase()] || null;
  }
  function discordMonEmbeds(mons){
    return mons.slice(0, 8).map(mon => {
      const url = discordSpriteUrl(mon);
      if(!url) return null;
      return { title: mon.name + (mon.variation ? ' (' + mon.variation + ')' : ''), thumbnail: { url }, color: 16759813 };
    }).filter(Boolean);
  }
  function discordTrainerMonEmbeds(trainer, mons){
    const embeds = discordMonEmbeds(mons);
    const logo = discordLogoFor(trainer);
    if(logo){
      const authorField = { name: trainer.coachName || trainer.name, icon_url: logo };
      if(embeds.length) embeds[0].author = authorField;
      else embeds.push({ author: authorField, color: 16759813 });
    }
    return embeds;
  }

  function pushAnnouncementHere(league, type, message, mons, droppedIds){
    const entry = { type, message, mons: mons || [], droppedIds: droppedIds || [], timestamp: Date.now() };
    return updateLeague({ announcements: appendValue(entry) }).catch(() => {});
  }

  async function commishProcessFAPickupNow(league, move){
    const idx = league.draft.trainers.findIndex(t => t.uid === move.trainerUid);
    if(idx === -1) return;
    if(league.draft.draftedIds[move.mon.id]){ alert('That Pokémon is already on a roster.'); return; }
    const updatedDraft = JSON.parse(JSON.stringify(league.draft));
    const t = updatedDraft.trainers[idx];
    t.roster.push(move.mon);
    t.budget -= move.mon.tier;
    t.faPickupsUsed = (t.faPickupsUsed || 0) + 1;
    updatedDraft.draftedIds[move.mon.id] = { trainerIdx: idx, tier: move.mon.tier };
    let newWaiver = null;
    if(move.conditionalDrop && t.roster.some(x => x.id === move.conditionalDrop.id)){
      t.roster = t.roster.filter(x => x.id !== move.conditionalDrop.id);
      t.budget += move.conditionalDrop.tier;
      delete updatedDraft.draftedIds[move.conditionalDrop.id];
      const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
      if(settings.waiverPeriodDays > 0){
        newWaiver = buildWaiverEntry(move.conditionalDrop, move.trainerUid, move.trainerName, settings);
      }
    }
    const updatedPending = (league.pendingMoves || []).filter(m => m.id !== move.id);
    const log = { id: pendingMoveId(), type: 'fa_swap', timestamp: Date.now(), reversed: false,
      trainerUid: move.trainerUid, trainerName: move.trainerName, claims: [move.mon], drops: move.conditionalDrop ? [move.conditionalDrop] : [] };
    try{
      await updateLeague({ draft: updatedDraft, pendingMoves: updatedPending, waivers: newWaiver ? (league.waivers || []).concat([newWaiver]) : (league.waivers || []), transactionLog: (league.transactionLog || []).concat([log]) });
      pushAnnouncementHere(league, 'pickup', 'Commissioner' + ' manually processed ' + move.trainerName + '\'s pickup of ' + move.mon.name + ' immediately' + (move.conditionalDrop ? ' (and dropped ' + move.conditionalDrop.name + ')' : ''), move.conditionalDrop ? [move.mon, move.conditionalDrop] : [move.mon], move.conditionalDrop ? [move.conditionalDrop.id] : []);
      sendDiscordFATrade('📥 **' + move.trainerName + '** officially added **' + move.mon.name + '** to their roster' + (move.conditionalDrop ? ' and dropped **' + move.conditionalDrop.name + '**' : '') + '.', discordTrainerMonEmbeds(t, move.conditionalDrop ? [move.mon, move.conditionalDrop] : [move.mon]));
    }catch(err){ alert('Could not process: ' + err.message); }
  }

  async function commishProcessSwapNow(league, move){
    const idx = league.draft.trainers.findIndex(t => t.uid === move.trainerUid);
    if(idx === -1) return;
    const updatedDraft = JSON.parse(JSON.stringify(league.draft));
    const t = updatedDraft.trainers[idx];
    const claims = (move.claims || []).filter(c => !updatedDraft.draftedIds[c.id]);
    const drops = (move.drops || []).filter(d => t.roster.some(x => x.id === d.id));
    claims.forEach(mon => {
      t.roster.push(mon);
      t.budget -= mon.tier;
      updatedDraft.draftedIds[mon.id] = { trainerIdx: idx, tier: mon.tier };
    });
    if(claims.length > 0){
      t.faPickupsUsed = (t.faPickupsUsed || 0) + 1; // one whole transaction, regardless of how many Pokémon it claimed
    }
    const dropIds = drops.map(d => d.id);
    t.roster = t.roster.filter(x => !dropIds.includes(x.id));
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const newWaivers = [];
    drops.forEach(mon => {
      t.budget += mon.tier;
      delete updatedDraft.draftedIds[mon.id];
      if(settings.waiverPeriodDays > 0) newWaivers.push(buildWaiverEntry(mon, move.trainerUid, move.trainerName, settings));
    });
    const updatedPending = (league.pendingMoves || []).filter(m => m.id !== move.id);
    const log = { id: pendingMoveId(), type: 'fa_swap', timestamp: Date.now(), reversed: false,
      trainerUid: move.trainerUid, trainerName: move.trainerName, claims, drops };
    try{
      await updateLeague({ draft: updatedDraft, pendingMoves: updatedPending, waivers: (league.waivers || []).concat(newWaivers), transactionLog: (league.transactionLog || []).concat([log]) });
      const claimNames = claims.map(c => c.name).join(', ') || 'nothing';
      const dropNote = drops.length ? (' and dropped ' + drops.map(d => d.name).join(', ')) : '';
      pushAnnouncementHere(league, 'pickup', 'Commissioner' + ' manually processed ' + move.trainerName + '\'s claim of ' + claimNames + dropNote + ' immediately', claims.concat(drops), drops.map(d=>d.id));
      sendDiscordFATrade('📥 **' + move.trainerName + '** officially added **' + claimNames + '** to their roster' + (drops.length ? ' and dropped **' + drops.map(d=>d.name).join(', ') + '**' : '') + '.', discordTrainerMonEmbeds(t, claims.concat(drops)));
    }catch(err){ alert('Could not process: ' + err.message); }
  }

  async function commishProcessTradeNow(league, move, tradeId){
    const pIdx = league.draft.trainers.findIndex(t => t.uid === move.proposerUid);
    const rIdx = league.draft.trainers.findIndex(t => t.uid === move.recipientUid);
    if(pIdx === -1 || rIdx === -1) return;
    const updatedDraft = JSON.parse(JSON.stringify(league.draft));
    const proposer = updatedDraft.trainers[pIdx];
    const recipient = updatedDraft.trainers[rIdx];
    const offeredIds = move.offered.map(x => x.id);
    const requestedIds = move.requested.map(x => x.id);
    const proposerHasAll = offeredIds.every(id => proposer.roster.some(x => x.id === id));
    const recipientHasAll = requestedIds.every(id => recipient.roster.some(x => x.id === id));
    if(!proposerHasAll || !recipientHasAll){
      alert('This trade can no longer be completed — a Pokémon involved has already moved.');
      return;
    }
    proposer.roster = proposer.roster.filter(x => !offeredIds.includes(x.id)).concat(move.requested);
    recipient.roster = recipient.roster.filter(x => !requestedIds.includes(x.id)).concat(move.offered);
    proposer.budget += tierSum(move.offered) - tierSum(move.requested);
    recipient.budget += tierSum(move.requested) - tierSum(move.offered);
    proposer.tradesUsed = (proposer.tradesUsed || 0) + 1;
    recipient.tradesUsed = (recipient.tradesUsed || 0) + 1;
    offeredIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: rIdx, tier: move.offered.find(x=>x.id===id).tier }; });
    requestedIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: pIdx, tier: move.requested.find(x=>x.id===id).tier }; });

    const updatedPending = (league.pendingMoves || []).filter(m => m.id !== move.id);
    const updatedTrades = (league.trades || []).map(t => t.id === tradeId ? Object.assign({}, t, { status: 'finalized' }) : t);
    const log = { id: pendingMoveId(), type: 'trade', timestamp: Date.now(), reversed: false,
      proposerUid: move.proposerUid, proposerName: move.proposerName, recipientUid: move.recipientUid, recipientName: move.recipientName,
      offered: move.offered, requested: move.requested };

    try{
      await updateLeague({ draft: updatedDraft, pendingMoves: updatedPending, trades: updatedTrades, transactionLog: (league.transactionLog || []).concat([log]) });
      pushAnnouncementHere(league, 'trade', 'Commissioner' + ' manually processed the trade between ' + move.proposerName + ' and ' + move.recipientName + ' immediately', move.offered.concat(move.requested));
      sendDiscordFATrade('🔄 Trade complete: **' + move.proposerName + '** sent ' + move.offered.map(x=>x.name).join(', ') + ' to **' + move.recipientName + '** for ' + move.requested.map(x=>x.name).join(', ') + '.', discordTrainerMonEmbeds(proposer, move.offered).concat(discordTrainerMonEmbeds(recipient, move.requested)));
    }catch(err){
      alert('Could not process trade: ' + err.message);
    }
  }

  async function removeMember(league, uid){
    if(league.draft){ alert('The draft has already started — members can no longer be removed.'); return; }
    const m = (league.members || {})[uid];
    const name = m ? (m.teamName || m.displayName || 'this trainer') : 'this trainer';
    if(!confirm('Are you sure you want to disable ' + name + '\'s player account?')) return;
    const entry = { type: 'league', message: 'Commissioner' + ' removed ' + name + ' from the league', timestamp: Date.now() };
    try{
      await updatePlayer(uid, { enabled: false });
      await updateLeague({ announcements: appendValue(entry) });
    }catch(err){ alert('Could not remove member: ' + err.message); }
  }

  function txSummaryHtml(log){
    if(log.type === 'fa_swap'){
      const claimNames = (log.claims||[]).map(m => m.name).join(', ') || 'nothing';
      const dropNames = (log.drops||[]).map(m => m.name).join(', ');
      return '<b>' + escapeHtml(log.trainerName) + '</b> claimed ' + escapeHtml(claimNames) + (dropNames ? ' and dropped ' + escapeHtml(dropNames) : '');
    }
    if(log.type === 'trade'){
      const offeredNames = (log.offered||[]).map(m => m.name).join(', ');
      const requestedNames = (log.requested||[]).map(m => m.name).join(', ');
      return 'Trade: <b>' + escapeHtml(log.proposerName) + '</b> sent ' + escapeHtml(offeredNames) + ' to <b>' + escapeHtml(log.recipientName) + '</b> for ' + escapeHtml(requestedNames);
    }
    return 'Transaction';
  }

  async function finalizeTradeFromVeto(league, trade){
    const proposer = league.draft.trainers.find(t => t.uid === trade.proposerUid);
    const recipient = league.draft.trainers.find(t => t.uid === trade.recipientUid);
    if(!proposer || !recipient) return;
    const offeredIds = trade.offered.map(m => m.id);
    const requestedIds = trade.requested.map(m => m.id);
    const proposerHasAll = offeredIds.every(id => proposer.roster.some(m => m.id === id));
    const recipientHasAll = requestedIds.every(id => recipient.roster.some(m => m.id === id));
    if(!proposerHasAll || !recipientHasAll){
      alert('This trade can no longer be completed — one of the Pokémon involved has already been moved.');
      return cancelVetoTrade(league, trade, 'declined');
    }
    const proposerCommitted = committedMonIds(league, trade.proposerUid);
    const recipientCommitted = committedMonIds(league, trade.recipientUid);
    if(offeredIds.some(id => proposerCommitted.includes(id)) || requestedIds.some(id => recipientCommitted.includes(id))){
      alert('This trade can no longer be completed — one of the Pokémon involved is now committed to a pending free agency move.');
      return cancelVetoTrade(league, trade, 'declined');
    }
    const move = {
      id: pendingMoveId(), type: 'trade',
      proposerUid: trade.proposerUid, proposerName: trade.proposerName,
      recipientUid: trade.recipientUid, recipientName: trade.recipientName,
      offered: trade.offered, requested: trade.requested,
      effectiveAt: getNextMondayMidnight()
    };
    const updatedPending = (league.pendingMoves || []).concat([move]);
    const updatedTrades = (league.trades || []).map(t => t.id === trade.id ? Object.assign({}, t, { status: 'finalized_pending', effectiveAt: move.effectiveAt }) : t);
    try{
      await updateLeague({ pendingMoves: updatedPending, trades: updatedTrades });
      pushAnnouncementHere(league, 'trade', escapeHtml(trade.proposerName) + ' and ' + escapeHtml(trade.recipientName) + ' accepted a trade — takes effect Monday', trade.offered.concat(trade.requested));
    }catch(err){ alert('Could not finalize trade: ' + err.message); }
  }

  async function cancelVetoTrade(league, trade, newStatus){
    const updatedTrades = (league.trades || []).map(t => t.id === trade.id ? Object.assign({}, t, { status: newStatus }) : t);
    try{
      await updateLeague({ trades: updatedTrades });
    }catch(err){ alert('Could not update trade: ' + err.message); }
  }

  function renderVetoTrades(league){
    const wrap = document.getElementById('vetoAdminWrap');
    const section = document.getElementById('vetoAdminSection');
    if(!wrap || !section) return;
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const vetoTrades = (league.trades || []).filter(t => t.status === 'accepted_pending_veto');
    if(vetoTrades.length === 0){ section.style.display = 'none'; return; }
    section.style.display = 'block';
    wrap.innerHTML = '';
    vetoTrades.forEach(trade => {
      const card = document.createElement('div');
      card.className = 'trade-card';
      const voterNames = (trade.vetoVotes || []).map(uid => {
        const t = league.draft.trainers.find(x => x.uid === uid);
        return t ? t.coachName : 'Unknown';
      });
      const voteMet = voterNames.length >= settings.vetoThreshold;
      card.innerHTML =
        '<div class="trade-summary"><b>' + escapeHtml(trade.proposerName) + '</b> ↔ <b>' + escapeHtml(trade.recipientName) + '</b></div>' +
        '<div class="veto-count">' + voterNames.length + ' / ' + settings.vetoThreshold + ' votes to veto' + (voterNames.length ? ' — voted: ' + voterNames.map(escapeHtml).join(', ') : '') + '</div>';
      const actions = document.createElement('div');
      actions.className = 'trade-actions';
      actions.style.marginTop = '10px';
      const finalizeBtn = document.createElement('button');
      finalizeBtn.className = 'btn btn-primary btn-sm';
      finalizeBtn.textContent = 'Finalize Trade';
      finalizeBtn.addEventListener('click', () => finalizeTradeFromVeto(league, trade));
      const vetoExecBtn = document.createElement('button');
      vetoExecBtn.className = 'btn btn-sm btn-danger';
      vetoExecBtn.textContent = 'Veto This Trade';
      vetoExecBtn.disabled = !voteMet;
      vetoExecBtn.addEventListener('click', () => cancelVetoTrade(league, trade, 'vetoed'));
      actions.appendChild(finalizeBtn);
      actions.appendChild(vetoExecBtn);
      card.appendChild(actions);
      wrap.appendChild(card);
    });
  }

  async function fixMegaZTypes(league){
    const CORRECTIONS = { '1308': ['dark', 'ghost'], '1311': ['dragon'] };
    let changed = 0;
    const updatedTrainers = league.draft.trainers.map(t => {
      const updatedRoster = (t.roster || []).map(mon => {
        if(CORRECTIONS[mon.id]){
          changed++;
          return Object.assign({}, mon, { types: CORRECTIONS[mon.id] });
        }
        return mon;
      });
      return Object.assign({}, t, { roster: updatedRoster });
    });
    if(changed === 0){
      alert('No Mega Absol Z or Mega Garchomp Z found in any roster — nothing to fix.');
      return;
    }
    try{
      await updateLeague({ 'draft.trainers': updatedTrainers });
      alert('Fixed ' + changed + ' Pokémon ' + (changed === 1 ? 'entry' : 'entries') + ' across your league\'s rosters.');
    }catch(err){
      alert('Could not apply fix: ' + err.message);
    }
  }

  async function undoTransaction(league, log){
    if(!confirm('Undo this transaction? This reverses the roster and budget changes if the Pokémon involved haven\'t moved again since.')) return;
    const updatedDraft = JSON.parse(JSON.stringify(league.draft));
    const notes = [];

    if(log.type === 'fa_swap'){
      const idx = updatedDraft.trainers.findIndex(t => t.uid === log.trainerUid);
      if(idx === -1){ alert('That trainer is no longer in the league.'); return; }
      const t = updatedDraft.trainers[idx];
      let anyClaimUndone = false;
      (log.claims || []).forEach(mon => {
        if(t.roster.some(x => x.id === mon.id)){
          t.roster = t.roster.filter(x => x.id !== mon.id);
          t.budget += mon.tier;
          delete updatedDraft.draftedIds[mon.id];
          anyClaimUndone = true;
        } else {
          notes.push(mon.name + ' has already moved again — couldn\'t undo that part.');
        }
      });
      if(anyClaimUndone){
        t.faPickupsUsed = Math.max(0, (t.faPickupsUsed || 0) - 1); // one whole transaction refunded, not one per Pokémon
      }
      (log.drops || []).forEach(mon => {
        if(!updatedDraft.draftedIds[mon.id]){
          t.roster.push(mon);
          t.budget -= mon.tier;
          updatedDraft.draftedIds[mon.id] = { trainerIdx: idx, tier: mon.tier };
        } else {
          notes.push(mon.name + ' is already owned by someone else — couldn\'t undo that part.');
        }
      });
    } else if(log.type === 'trade'){
      const pIdx = updatedDraft.trainers.findIndex(t => t.uid === log.proposerUid);
      const rIdx = updatedDraft.trainers.findIndex(t => t.uid === log.recipientUid);
      if(pIdx === -1 || rIdx === -1){ alert('One of the trainers is no longer in the league.'); return; }
      const proposer = updatedDraft.trainers[pIdx];
      const recipient = updatedDraft.trainers[rIdx];
      const requestedIds = (log.requested||[]).map(m=>m.id);
      const offeredIds = (log.offered||[]).map(m=>m.id);
      const proposerHasRequested = requestedIds.every(id => proposer.roster.some(x=>x.id===id));
      const recipientHasOffered = offeredIds.every(id => recipient.roster.some(x=>x.id===id));
      if(!proposerHasRequested || !recipientHasOffered){
        alert('Could not undo — one of the Pokémon involved has already moved again.');
        return;
      }
      proposer.roster = proposer.roster.filter(x => !requestedIds.includes(x.id)).concat(log.offered);
      recipient.roster = recipient.roster.filter(x => !offeredIds.includes(x.id)).concat(log.requested);
      proposer.budget += (log.requested||[]).reduce((s,x)=>s+x.tier,0) - (log.offered||[]).reduce((s,x)=>s+x.tier,0);
      recipient.budget += (log.offered||[]).reduce((s,x)=>s+x.tier,0) - (log.requested||[]).reduce((s,x)=>s+x.tier,0);
      proposer.tradesUsed = Math.max(0, (proposer.tradesUsed||0) - 1);
      recipient.tradesUsed = Math.max(0, (recipient.tradesUsed||0) - 1);
      offeredIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: pIdx, tier: log.offered.find(x=>x.id===id).tier }; });
      requestedIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: rIdx, tier: log.requested.find(x=>x.id===id).tier }; });
    }

    const updatedLog = (league.transactionLog || []).map(l => l.id === log.id ? Object.assign({}, l, { reversed: true }) : l);
    const entry = { type: 'league', message: 'Commissioner' + ' undid a transaction' + (notes.length ? ' (partially — see commissioner page for details)' : ''), timestamp: Date.now() };

    try{
      await updateLeague({ draft: updatedDraft, transactionLog: updatedLog, announcements: appendValue(entry) });
      if(notes.length) alert('Undo completed with some exceptions:\n\n' + notes.join('\n'));
    }catch(err){ alert('Could not undo: ' + err.message); }
  }

  // ---------- crop / zoom tool for league logo ----------
  const cropModalEl = document.getElementById('cropModal');
  const cropViewportEl = document.getElementById('cropViewport');
  const cropImageEl = document.getElementById('cropImage');
  const cropZoomSlider = document.getElementById('cropZoomSlider');
  const cropConfirmBtn = document.getElementById('cropConfirmBtn');
  const cropCancelBtn = document.getElementById('cropCancelBtn');

  const CROP_VIEWPORT_SIZE = 220;
  const CROP_OUTPUT_SIZE = 200;
  let cropState = { naturalW: 0, naturalH: 0, scale: 1, minScale: 1, left: 0, top: 0 };
  let cropDragging = false;
  let cropDragStart = { x: 0, y: 0, left: 0, top: 0 };
  let pendingLeagueLogoDataUrl = null;

  function openCropModal(dataUrl){
    const img = new Image();
    img.onload = function(){
      cropState.naturalW = img.naturalWidth;
      cropState.naturalH = img.naturalHeight;
      cropState.minScale = Math.max(CROP_VIEWPORT_SIZE / img.naturalWidth, CROP_VIEWPORT_SIZE / img.naturalHeight);
      cropState.scale = cropState.minScale;
      cropState.left = (CROP_VIEWPORT_SIZE - cropState.naturalW * cropState.scale) / 2;
      cropState.top = (CROP_VIEWPORT_SIZE - cropState.naturalH * cropState.scale) / 2;

      cropImageEl.src = dataUrl;
      cropZoomSlider.min = cropState.minScale;
      cropZoomSlider.max = cropState.minScale * 4;
      cropZoomSlider.step = (cropState.minScale * 3) / 200;
      cropZoomSlider.value = cropState.minScale;

      applyCropTransform();
      cropModalEl.style.display = 'flex';
    };
    img.src = dataUrl;
  }

  function clampCropOffsets(){
    const dispW = cropState.naturalW * cropState.scale;
    const dispH = cropState.naturalH * cropState.scale;
    cropState.left = Math.min(0, Math.max(CROP_VIEWPORT_SIZE - dispW, cropState.left));
    cropState.top = Math.min(0, Math.max(CROP_VIEWPORT_SIZE - dispH, cropState.top));
  }

  function applyCropTransform(){
    clampCropOffsets();
    const dispW = cropState.naturalW * cropState.scale;
    const dispH = cropState.naturalH * cropState.scale;
    cropImageEl.style.width = dispW + 'px';
    cropImageEl.style.height = dispH + 'px';
    cropImageEl.style.left = cropState.left + 'px';
    cropImageEl.style.top = cropState.top + 'px';
  }

  cropZoomSlider.addEventListener('input', function(){
    const newScale = parseFloat(this.value);
    const centerX = CROP_VIEWPORT_SIZE / 2, centerY = CROP_VIEWPORT_SIZE / 2;
    const imgX = (centerX - cropState.left) / cropState.scale;
    const imgY = (centerY - cropState.top) / cropState.scale;
    cropState.scale = newScale;
    cropState.left = centerX - imgX * newScale;
    cropState.top = centerY - imgY * newScale;
    applyCropTransform();
  });

  cropViewportEl.addEventListener('wheel', function(e){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.05 : 0.95;
    const newScale = Math.min(parseFloat(cropZoomSlider.max), Math.max(parseFloat(cropZoomSlider.min), cropState.scale * delta));
    cropZoomSlider.value = newScale;
    cropZoomSlider.dispatchEvent(new Event('input'));
  }, { passive: false });

  cropViewportEl.addEventListener('pointerdown', function(e){
    cropDragging = true;
    cropViewportEl.style.cursor = 'grabbing';
    cropDragStart = { x: e.clientX, y: e.clientY, left: cropState.left, top: cropState.top };
    cropViewportEl.setPointerCapture(e.pointerId);
  });
  cropViewportEl.addEventListener('pointermove', function(e){
    if(!cropDragging) return;
    cropState.left = cropDragStart.left + (e.clientX - cropDragStart.x);
    cropState.top = cropDragStart.top + (e.clientY - cropDragStart.y);
    applyCropTransform();
  });
  ['pointerup', 'pointercancel'].forEach(evt => {
    cropViewportEl.addEventListener(evt, function(){
      cropDragging = false;
      cropViewportEl.style.cursor = 'grab';
    });
  });

  cropCancelBtn.addEventListener('click', function(){
    cropModalEl.style.display = 'none';
    const logoInput = document.getElementById('leagueLogoInput');
    if(logoInput) logoInput.value = '';
  });

  cropConfirmBtn.addEventListener('click', function(){
    const sx = -cropState.left / cropState.scale;
    const sy = -cropState.top / cropState.scale;
    const sSize = CROP_VIEWPORT_SIZE / cropState.scale;
    const canvas = document.createElement('canvas');
    canvas.width = CROP_OUTPUT_SIZE;
    canvas.height = CROP_OUTPUT_SIZE;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(cropImageEl, sx, sy, sSize, sSize, 0, 0, CROP_OUTPUT_SIZE, CROP_OUTPUT_SIZE);
    pendingLeagueLogoDataUrl = canvas.toDataURL('image/jpeg', 0.85);
    const preview = document.getElementById('leagueLogoPreview');
    const placeholder = document.getElementById('leagueLogoPlaceholder');
    if(preview){ preview.src = pendingLeagueLogoDataUrl; preview.style.display = ''; }
    if(placeholder) placeholder.style.display = 'none';
    cropModalEl.style.display = 'none';
    const logoInput = document.getElementById('leagueLogoInput');
    if(logoInput) logoInput.value = '';
  });

        statusEl.style.color = 'var(--gold)';
      }catch(err){
        statusEl.textContent = 'Could not save: ' + err.message;
        statusEl.style.color = '#FF8A8A';
      }
      btn.disabled = false; btn.textContent = 'Save Logo';
    });

    const vetoCheckbox = document.getElementById('setVetoEnabled');
    const vetoField = document.getElementById('vetoThresholdField');
    vetoCheckbox.addEventListener('change', () => {
      vetoField.style.display = vetoCheckbox.checked ? '' : 'none';
    });

    document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
      const btn = document.getElementById('saveSettingsBtn');
      const status = document.getElementById('settingsStatus');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      const newSettings = {
        draftBudget: parseInt(document.getElementById('setDraftBudget').value, 10) || DEFAULT_SETTINGS.draftBudget,
        rosterSize: parseInt(document.getElementById('setRosterSize').value, 10) || DEFAULT_SETTINGS.rosterSize,
        maxTeams: parseInt(document.getElementById('setMaxTeams').value, 10) || DEFAULT_SETTINGS.maxTeams,
        playoffTeams: parseInt(document.getElementById('setPlayoffTeams').value, 10) || DEFAULT_SETTINGS.playoffTeams,
        faPickupsPerSeason: parseInt(document.getElementById('setFAPickups').value, 10) || 0,
        waiverPeriodDays: parseInt(document.getElementById('setWaiverDays').value, 10) || 0,
        faMaxPerSwap: parseInt(document.getElementById('setFAMaxPerSwap').value, 10) || 1,
        tradesPerSeason: parseInt(document.getElementById('setTradesPerSeason').value, 10) || 0,
        maxPokemonPerSide: parseInt(document.getElementById('setMaxPerTrade').value, 10) || 1,
        vetoEnabled: vetoCheckbox.checked,
        vetoThreshold: parseInt(document.getElementById('setVetoThreshold').value, 10) || DEFAULT_SETTINGS.vetoThreshold,
        tradeDeadlineWeek: parseInt(document.getElementById('setTradeDeadlineWeek').value, 10) || 0,
        faDeadlineWeek: parseInt(document.getElementById('setFADeadlineWeek').value, 10) || 0
      };
      try{
        await updateLeague({ settings: newSettings });
        status.textContent = 'Saved!';
        status.style.color = 'var(--gold)';
      }catch(err){
        status.textContent = 'Could not save: ' + err.message;
        status.style.color = '#FF8A8A';
      }
      btn.disabled = false;
      btn.textContent = 'Save Settings';
    });
  }

  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    subscribeLeague((snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      render(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  const navSignedOut = document.getElementById('navSignedOut');
  const navSignedIn = document.getElementById('navSignedIn');
  const navUserEmail = document.getElementById('navUserEmail');
  const navSignOutBtn = document.getElementById('navSignOutBtn');
  navSignOutBtn.addEventListener('click', () => signOut());


  onUserChange( (user) => {
    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.displayName || 'Trainer';
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });
</script>

</body>
</html>

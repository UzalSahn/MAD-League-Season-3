<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The MAD League</title>
<meta name="description" content="Home base for the The MAD League — sign in to get started.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  header.site-nav{
    position:sticky;top:0;z-index:60;
    background:rgba(13,13,13,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1100px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}
  .season-badge{
    font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:3px 9px;border-radius:3px;margin-left:6px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  main{max-width:560px;margin:0 auto;padding:80px 22px 80px;text-align:center;}

  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);}
  h1{
    font-family:var(--display);font-weight:900;text-transform:uppercase;
    font-size:clamp(38px, 7vw, 58px);line-height:0.95;margin:14px 0 0;
  }
  .sub{color:var(--cream-dim);font-size:15px;margin-top:16px;max-width:440px;margin-left:auto;margin-right:auto;}

  .auth-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:32px 28px;margin-top:36px;text-align:left;
  }

  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;background:#fff;color:#1f1f1f;border:none;border-radius:4px;
    padding:13px 20px;font-family:var(--body);font-weight:600;font-size:14.5px;
    cursor:pointer;transition:transform .12s ease, box-shadow .15s ease;
  }
  .google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,0.3);}
  .google-btn img{width:18px;height:18px;}

  .signed-in-card{text-align:center;}
  .signed-in-card .avatar{
    width:64px;height:64px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold);margin:0 auto 14px;display:block;
  }
  .signed-in-card .name{font-family:var(--display);font-size:22px;text-transform:uppercase;}
  .signed-in-card .email{color:var(--cream-dim);font-size:13px;margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:11px 20px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}

  .league-actions{
    margin-top:22px;padding-top:22px;border-top:1px solid var(--line);text-align:left;
  }
  .league-tab-buttons{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{
    flex:1;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream-dim);
    padding:9px 10px;border-radius:4px;font-family:var(--body);font-weight:600;font-size:12.5px;
    cursor:pointer;text-transform:uppercase;letter-spacing:0.02em;
  }
  .tab-btn.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .league-actions label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .league-actions input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:11px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .league-actions input:focus{border-color:var(--gold);}
  .league-error{color:#FF8A8A;font-size:13px;margin-top:12px;display:none;}

  .option-group{margin-top:18px;}
  .option-group-label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;
  }
  .option-cards{display:flex;flex-direction:column;gap:8px;}
  .option-card{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    background:var(--ink-soft);border:1px solid var(--line);border-radius:5px;
    padding:10px 14px;cursor:pointer;font-family:var(--body);width:100%;
    transition:border-color .15s ease, background .15s ease;
  }
  .option-card:hover{border-color:var(--gold-soft);}
  .option-card.active{border-color:var(--gold);background:rgba(255,203,5,0.08);}
  .oc-title{font-weight:700;font-size:14px;color:var(--cream);}
  .option-card.active .oc-title{color:var(--gold);}
  .oc-desc{font-size:12px;color:var(--cream-dim);}
  .option-note{
    font-size:12.5px;color:var(--gold-soft);margin-top:12px;background:rgba(255,203,5,0.08);
    border:1px solid rgba(255,203,5,0.2);border-radius:4px;padding:9px 12px;
  }

  .next-steps{
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    font-size:13px;color:var(--cream-dim);text-align:center;
  }

  .auth-error{
    color:#FF8A8A;font-size:13px;margin-top:14px;text-align:center;display:none;
  }

  footer{max-width:560px;margin:0 auto;padding:0 22px 60px;color:var(--cream-dim);font-size:12px;text-align:center;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="nav-left-group">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      The MAD League
    </a>
    <a href="champions.html" class="nav-former-champions">Past Champions</a>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="pool.html">Pool</a>
      <a href="format.html">Format</a>
      <span id="navSignedOut"><a href="signin.html" class="nav-cta">Sign In</a></span>
      <span id="navSignedIn" class="nav-account" style="display:none;">
        <a href="league.html" class="btn btn-sm">League</a>
        <span id="navUserEmail"></span>
        <button id="navSignOutBtn" class="btn btn-sm">Sign Out</button>
      </span>
    </nav>
  </div>
</header>

<main>
  <span class="eyebrow">Fit like, MAD Lad?</span>
  <h1>MAD League Season 3</h1>
  <p class="sub">Aye we've got a fkn website now</p>

  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px;">
    <a href="signin.html" class="btn btn-primary">Sign In</a>
    <a href="pool.html" class="btn">Browse the Pool</a>
  </div>
</main>

<footer>
  Sign in with your name and PIN (check discord).
</footer>



<script type="module">
  import { appendValue, onUserChange, signOut, subscribeLeague, updateLeague, fetchLeague } from './league-api.js';

function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const navSignedOut = document.getElementById("navSignedOut");
  const navSignedIn = document.getElementById("navSignedIn");
  const navUserEmail = document.getElementById("navUserEmail");
  const navSignOutBtn = document.getElementById("navSignOutBtn");


  onUserChange( (user) => {
    if(user){
      navSignedOut.style.display = "none";
      navSignedIn.style.display = "flex";
      navUserEmail.textContent = user.displayName || "Trainer";
    } else {
      navSignedOut.style.display = "";
      navSignedIn.style.display = "none";
    }
  });

  navSignOutBtn.addEventListener("click", () => signOut());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — Pokemon VGC Draft League</title>
<meta name="description" content="League dashboard — members, join code, and commissioner controls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}

  .announcements-list{display:flex;flex-direction:column;gap:10px;}
  .announcement-row{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;position:relative;}
  .announcement-row.has-delete{padding-right:52px;}
  .announcement-delete-btn{
    position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);
    color:var(--cream-dim);cursor:pointer;font-size:16px;line-height:1;padding:0;transition:background .15s,border-color .15s,color .15s;
  }
  .announcement-delete-btn:hover{background:rgba(238,21,21,0.18);border-color:rgba(238,21,21,0.5);color:#FF8A8A;}
  .announcement-icon{font-size:22px;flex-shrink:0;line-height:1;margin-top:2px;}
  .announcement-icon-sign{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;margin-top:0;
  }
  .sign-positive{background:rgba(61,220,122,0.18);color:#3DDC7A;}
  .sign-negative{background:rgba(238,21,21,0.18);color:#EE1515;}
  .sign-pickup{position:relative;}
  .pickup-arrows{
    position:absolute;bottom:-5px;right:-6px;background:#3DDC7A;color:var(--ink);
    font-family:var(--mono);font-size:8px;font-weight:800;line-height:1;padding:2px 3px;border-radius:6px;
    border:1.5px solid var(--panel);letter-spacing:-1px;
  }
  .announcement-body{flex:1;min-width:0;}
  .announcement-label{
    font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold);
  }
  .announcement-message{font-size:14.5px;margin-top:3px;}
  .announcement-time{font-family:var(--mono);font-size:11px;color:var(--cream-dim);margin-top:6px;}
  .announcement-mons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .announcement-mon-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--ink-soft);border:1px solid var(--line);
    border-radius:20px;padding:4px 10px 4px 4px;font-size:12px;color:var(--cream-dim);
  }
  .announcement-mon-chip.mon-chip-picked-up{background:rgba(61,220,122,0.12);border-color:rgba(61,220,122,0.35);color:#B9F0CC;}
  .announcement-mon-chip.mon-chip-dropped{background:rgba(238,21,21,0.12);border-color:rgba(238,21,21,0.35);color:#FFC2C2;}
  .announcement-mon-chip.mon-chip-mvp{background:rgba(255,203,5,0.14);border-color:rgba(255,203,5,0.4);color:var(--gold);font-weight:700;}
  .announcement-mon-sprite{width:36px;height:36px;object-fit:contain;flex-shrink:0;}
  .announcement-mons.compact{gap:6px;}
  .announcement-mons.compact .announcement-mon-chip{padding:3px 8px 3px 3px;font-size:11px;}
  .announcement-mons.compact .announcement-mon-sprite{width:24px;height:24px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .league-logo-header{width:44px;height:44px;border-radius:50%;object-fit:cover;float:right;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .btn-sm{padding:7px 14px;font-size:12px;}
  .btn-danger{border-color:#EE1515;color:#FF8A8A;}
  .btn-danger:hover{border-color:#FF6B6B;color:#FF6B6B;}
  .settings-note{font-size:12px;color:var(--cream-dim);}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>

  function spriteCandidates(mon){
    const pokeapiId = ID_TO_POKEAPI_ID[mon.id];
    if(!pokeapiId) return [];
    return ['https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokeapiId + '.png'];
  }
  function makeSpriteImg(mon, cssClass){
    const candidates = spriteCandidates(mon);
    const img = document.createElement('img');
    img.className = cssClass; img.alt=''; img.loading='lazy'; img.src = candidates[0] || PLACEHOLDER_SPRITE;
    let idx=0;
    img.addEventListener('error', () => {
      idx++;
      if(idx < candidates.length){ img.src = candidates[idx]; }
      else { img.onerror=null; img.src = PLACEHOLDER_SPRITE; img.style.opacity='0.4'; }
    });
    return img;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatTimestamp(ts){
    if(!ts) return '';
    const date = ts.toDate ? ts.toDate() : new Date(ts);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
      date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  ['subnavMatch','subnavTeam','subnavFA','subnavTrades','subnavStanding','subnavAnnouncements','subnavDraft','subnavCommish'].forEach(id => {

  let currentUser = null;
  function updateNavGlow(league){
    const glowTab = (id, active) => {
      const el = document.getElementById(id);
      if(el) el.classList.toggle('subnav-tab-glow', !!active);
    };
    if(!currentUser || !league || !league.draft || !league.draft.trainers){
      ['subnavMatch','subnavTrades','subnavStanding','subnavAnnouncements'].forEach(id => glowTab(id, false));
      return;
    }
    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);
    glowTab('subnavTrades', tradesUnseen);

    const announcementsSeenAt = (me && me.announcementsSeenAt) || 0;
    const announcementsUnseen = (league.announcements || []).some(a => (a.timestamp || 0) > announcementsSeenAt);
    glowTab('subnavAnnouncements', announcementsUnseen);

    let matchToken = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ matchToken = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      matchToken = 'w' + idx;
    }
    const matchUnseen = matchToken !== null && matchToken !== (me && me.matchSeenToken);
    glowTab('subnavMatch', matchUnseen);

    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    const standingToken = resultCount > 0 ? String(resultCount) : null;
    const standingUnseen = standingToken !== null && standingToken !== (me && me.standingSeenToken);
    glowTab('subnavStanding', standingUnseen);
  }

  const DEFAULT_SETTINGS = { vetoEnabled: true, vetoThreshold: 4 };

  async function voteVeto(league, trade){
    const votes = (trade.vetoVotes || []).slice();
    if(votes.includes(currentUser.uid)) return;
    votes.push(currentUser.uid);
    const updatedTrades = (league.trades || []).map(t => t.id === trade.id ? Object.assign({}, t, { vetoVotes: votes }) : t);
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { trades: updatedTrades });
    }catch(err){ alert('Could not record veto vote: ' + err.message); }
  }

  async function deleteAnnouncement(league, item){
    if(!confirm('Delete this announcement? This cannot be undone.')) return;
    const current = (league.announcements || []);
    const idx = current.indexOf(item);
    if(idx === -1) return;
    const updated = current.slice();
    updated.splice(idx, 1);
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { announcements: updated });
    }catch(err){ alert('Could not delete announcement: ' + err.message); }
  }

  let announcementsSeenMarked = false;
  function markAnnouncementsSeen(league){
    if(announcementsSeenMarked || !currentUser || !league.draft) return;
    const maxTs = (league.announcements || []).reduce((max, a) => Math.max(max, a.timestamp || 0), 0);
    if(maxTs <= 0) return;
    const idx = league.draft.trainers.findIndex(t => t.uid === currentUser.uid);
    if(idx < 0) return;
    if((league.draft.trainers[idx].announcementsSeenAt || 0) >= maxTs) return;
    announcementsSeenMarked = true;
    const updatedTrainers = league.draft.trainers.map((t, i) => i === idx ? Object.assign({}, t, { announcementsSeenAt: Date.now() }) : t);
    updateDoc(doc(db, 'leagues', leagueId), { ['draft.trainers']: updatedTrainers }).catch(() => { announcementsSeenMarked = false; });
  }

  function render(league){
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = (currentUser && league.commissionerUid === currentUser.uid) ? '' : 'none';
    const subnavDraft = document.getElementById('subnavDraft');
    if(subnavDraft) subnavDraft.style.display = '';
    updateNavGlow(league);
    markAnnouncementsSeen(league);

    const isCommish = !!(currentUser && league.commissionerUid === currentUser.uid);

    const items = (league.announcements || []).slice().sort((a, b) => {
      const at = a.timestamp && a.timestamp.toMillis ? a.timestamp.toMillis() : (a.timestamp || 0);
      const bt = b.timestamp && b.timestamp.toMillis ? b.timestamp.toMillis() : (b.timestamp || 0);
      return bt - at;
    });

    content.innerHTML =
      '<div class="page-head">' +
        (league.logo ? '<img class="league-logo-header" src="' + escapeHtml(league.logo) + '" alt="">' : '') +
        '<span class="eyebrow">Announcements</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
        '<p style="color:var(--cream-dim);font-size:13.5px;margin-top:10px;">A live feed of match results, free agency moves, and completed trades across your league.</p>' +
      '</div>';

    if(items.length === 0){
      content.innerHTML +=
        '<div class="panel state-msg" style="padding:50px 20px;">' +
          '<div style="font-family:var(--display);font-size:20px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;">No Announcements Yet</div>' +
          'Match results, free agency pickups and drops, and completed trades will automatically show up here as your league plays out.' +
        '</div>';
      return;
    }

    const list = document.createElement('div');
    list.className = 'announcements-list';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'panel announcement-row' + (isCommish ? ' has-delete' : '');
      const isPickup = item.type === 'pickup';
      const isDrop = item.type === 'drop';
      const pokeballSwapIcon =
        '<svg viewBox="0 0 24 24" width="17" height="17" style="display:block;">' +
          '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
          '<path d="M3 12h6M15 12h6" stroke="currentColor" stroke-width="1.6"/>' +
          '<circle cx="12" cy="12" r="2.4" fill="currentColor"/>' +
          '<circle cx="12" cy="12" r="1.1" fill="var(--panel)"/>' +
        '</svg>';
      const iconHtml = isPickup ? '<span class="announcement-icon announcement-icon-sign sign-positive sign-pickup">' + pokeballSwapIcon + '<span class="pickup-arrows">↑↓</span></span>'
        : isDrop ? '<span class="announcement-icon announcement-icon-sign sign-negative">−</span>'
        : '<span class="announcement-icon">' + (ANNOUNCEMENT_ICONS[item.type] || '📢') + '</span>';
      row.innerHTML =
        iconHtml +
        '<div class="announcement-body">' +
          '<div class="announcement-label">' + escapeHtml(ANNOUNCEMENT_LABELS[item.type] || 'Announcement') + '</div>' +
          '<div class="announcement-message">' + escapeHtml(item.message || '') + '</div>' +
          (item.timestamp ? '<div class="announcement-time">' + formatTimestamp(item.timestamp) + '</div>' : '') +
        '</div>';
      if(item.mons && item.mons.length){
        const monsRow = document.createElement('div');
        monsRow.className = 'announcement-mons' + (item.type === 'trade' ? ' compact' : '');
        const droppedIds = item.droppedIds || [];
        item.mons.forEach(mon => {
          const chip = document.createElement('span');
          const isDropped = item.type === 'pickup' && droppedIds.includes(mon.id);
          const isPickedUp = item.type === 'pickup' && !isDropped;
          const isMvp = item.type === 'match' && item.mvpId && mon.id === item.mvpId;
          chip.className = 'announcement-mon-chip' + (isPickedUp ? ' mon-chip-picked-up' : '') + (isDropped ? ' mon-chip-dropped' : '') + (isMvp ? ' mon-chip-mvp' : '');
          chip.appendChild(makeSpriteImg(mon, 'announcement-mon-sprite'));
          const label = document.createElement('span');
          label.textContent = (isMvp ? '★ ' : '') + mon.name;
          chip.appendChild(label);
          monsRow.appendChild(chip);
        });
        row.querySelector('.announcement-body').appendChild(monsRow);
      }
      if(item.tradeId){
        const liveTrade = (league.trades || []).find(t => t.id === item.tradeId);
        const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
        if(liveTrade && liveTrade.status === 'accepted_pending_veto' && settings.vetoEnabled && currentUser){
          const isParty = liveTrade.proposerUid === currentUser.uid || liveTrade.recipientUid === currentUser.uid;
          const alreadyVoted = (liveTrade.vetoVotes || []).includes(currentUser.uid);
          const voteWrap = document.createElement('div');
          voteWrap.style.marginTop = '10px';
          if(isParty){
            voteWrap.innerHTML = '<span class="settings-note">This is your trade — your commissioner will finalize it or act on a veto once voting settles.</span>';
          } else {
            const vetoBtn = document.createElement('button');
            vetoBtn.className = 'btn btn-sm btn-danger';
            vetoBtn.textContent = alreadyVoted ? 'Voted to veto' : 'Vote to Veto';
            vetoBtn.disabled = alreadyVoted;
            vetoBtn.addEventListener('click', () => voteVeto(league, liveTrade));
            voteWrap.appendChild(vetoBtn);
            const countEl = document.createElement('span');
            countEl.className = 'settings-note';
            countEl.style.marginLeft = '10px';
            const voterNames = (liveTrade.vetoVotes || []).map(uid => {
              const t = league.draft.trainers.find(x => x.uid === uid);
              return t ? (t.coachName || 'Unknown') : 'Unknown';
            });
            countEl.textContent = voterNames.length + ' / ' + settings.vetoThreshold + ' votes to veto' + (voterNames.length ? ' — voted: ' + voterNames.join(', ') : '');
            voteWrap.appendChild(countEl);
          }
          row.querySelector('.announcement-body').appendChild(voteWrap);
        }
      }
      if(isCommish){
        const delBtn = document.createElement('button');
        delBtn.className = 'announcement-delete-btn';
        delBtn.title = 'Delete announcement';
        delBtn.setAttribute('aria-label', 'Delete announcement');
        delBtn.textContent = '×';
        delBtn.addEventListener('click', () => deleteAnnouncement(league, item));
        row.appendChild(delBtn);
      }
      list.appendChild(row);
    });
    content.appendChild(list);
  }

  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    onSnapshot(doc(db, 'leagues', leagueId), (snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      render(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  navJoinSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const code = navJoinCodeInput.value.trim().toUpperCase();
    if(!code){ navJoinStatus.textContent = 'Enter a code.'; return; }
    navJoinSubmitBtn.disabled = true;
    try{
      const q = query(collection(db, 'leagues'), where('joinCode', '==', code));
      const snap = await getDocs(q);
      if(snap.empty){
        navJoinStatus.textContent = 'No league found with that code.';
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();
      const maxTeams = (leagueData.settings && leagueData.settings.maxTeams) || Infinity;
      const currentMemberCount = Object.keys(leagueData.members || {}).length;
      if(!leagueData.members || !leagueData.members[navCurrentUser.uid]){
        if(currentMemberCount >= maxTeams){
          navJoinStatus.textContent = 'This league is full (' + maxTeams + ' team limit).';
          navJoinSubmitBtn.disabled = false;
          return;
        }
      }
      await updateDoc(doc(db, 'leagues', leagueDoc.id), {

          displayName: navCurrentUser.displayName || 'Trainer',
          photoURL: navCurrentUser.photoURL || '',

      navJoinStatus.textContent = 'Error: ' + err.message;

  async function loadNavLeagues(user){
    try{
      const q = query(collection(db, 'leagues'), where('members.' + user.uid, '!=', null));
      const snap = await getDocs(q);
      navLeaguesList.innerHTML = '';
      if(snap.empty){ navLeaguesEmpty.style.display = 'block'; return; }
      navLeaguesEmpty.style.display = 'none';
      snap.forEach(docSnap => {
        const l = docSnap.data();
        const isCommish = l.commissionerUid === user.uid;
        const li = document.createElement('li');
        li.innerHTML = '<a href="league.html?id=' + docSnap.id + '"><span>' + escapeHtml(l.name || 'Untitled League') + '</span>' + (isCommish ? '<span class="nlm-commish">Commish</span>' : '') + '</a>';
        navLeaguesList.appendChild(li);
      });
    }catch(err){
      navLeaguesEmpty.style.display = 'block';
      navLeaguesEmpty.textContent = 'Could not load leagues.';

    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.displayName || 'Trainer';
      navCurrentUser = user;
      loadNavLeagues(user);
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP Race — The MAD League</title>
<meta name="description" content="Track drafted Pokémon match stats and the league MVP race.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;--ink-soft:#161616;--panel:#1C1C1C;--cream:#FAFAF7;--cream-dim:#B8B7B2;
    --gold:#FFCB05;--slate:#3A3A3A;--line:rgba(250,250,247,0.14);
    --display:'Big Shoulders Display',sans-serif;--body:'Inter',sans-serif;--mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1000px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:18px;font-size:13px;font-weight:600;}
  .nav-cta{background:var(--gold);color:var(--ink);padding:8px 14px;border-radius:3px;text-transform:uppercase;}
  .nav-account{display:flex;align-items:center;gap:10px;}
  .btn{background:transparent;color:var(--cream);border:1px solid var(--line);border-radius:3px;padding:7px 12px;font:600 12px var(--body);cursor:pointer;}
  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:1000px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{padding:14px 15px;font:12px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--cream-dim);white-space:nowrap;flex-shrink:0;}
  .subnav-tab:hover,.subnav-tab.active{color:var(--gold);}
  main{max-width:1000px;margin:0 auto;padding:38px 22px 80px;}
  .eyebrow{font:11px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--gold);}
  h1,h2{font-family:var(--display);text-transform:uppercase;line-height:1;margin:7px 0 12px;}
  h1{font-size:clamp(32px,5vw,48px);}
  .lead,.note{font-size:13px;color:var(--cream-dim);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-top:18px;}
  .champion{display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(110deg,rgba(255,203,5,.14),var(--panel));}
  .champion-main{display:flex;align-items:center;gap:14px;min-width:0;}
  .champion-sprite{width:88px;height:88px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
  .champion-label{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
  .champion-name{font:700 26px var(--display);text-transform:uppercase;}
  .champion-stat{font:11px var(--mono);color:var(--cream-dim);}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--cream-dim);text-align:right;padding:10px;border-bottom:1px solid var(--line);}
  th:first-child,th:nth-child(2){text-align:left;}
  td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:right;}
  td:first-child{font:12px var(--mono);color:var(--cream-dim);width:48px;}
  td:nth-child(2){text-align:left;font-weight:700;white-space:nowrap;}
  tr.leader td:nth-child(2),tr.leader td:first-child{color:var(--gold);}
  .pokemon-variation{color:var(--cream-dim);font-weight:400;}
  .state-msg{text-align:center;padding:38px 20px;color:var(--cream-dim);font-size:14px;}
  .error{color:#FF8A8A;}
  @media(max-width:640px){.nav-links{gap:10px}.nav-links>a{display:none}.nav-inner{padding:12px 14px}.subnav-tab{padding:13px 11px}main{padding:28px 14px 60px}.champion-name{font-size:22px}.champion-sprite{width:68px;height:68px}.champion{gap:10px;padding:14px}.champion-main{gap:8px}}
</style>
</head>
<body>
<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      The MAD League
    </a>
    <nav class="nav-links">
      <a href="pool.html">Pool</a>
      <span id="navSignedOut"><a href="signin.html" class="nav-cta">Sign In</a></span>
      <span id="navSignedIn" class="nav-account" style="display:none;">
        <a href="league.html" class="btn">League</a>
        <span id="navUserName"></span>
        <button id="navSignOut" class="btn">Sign Out</button>
      </span>
    </nav>
  </div>
</header>
<div class="league-subnav"><div class="league-subnav-inner">
  <a href="match.html" class="subnav-tab">Match</a>
  <a href="team.html" class="subnav-tab">Team</a>
  <a href="freeagency.html" class="subnav-tab">Free Agency</a>
  <a href="trades.html" class="subnav-tab">Trades</a>
  <a href="standing.html" class="subnav-tab">Standing</a>
  <a href="mvp-race.html" class="subnav-tab active">MVP Race</a>
  <a href="announcements.html" class="subnav-tab">Announcements</a>
  <a href="draft.html" class="subnav-tab">Draft Room</a>
  <a href="commissioner.html" class="subnav-tab" id="subnavCommish" style="display:none;">Commissioner</a>
</div></div>
<main>
  <div id="content"><div class="state-msg">Loading league…</div></div>
</main>
<script type="module">
  import { getCurrentSeasonId, onUserChange, signOut, subscribeLeague } from './league-api.js';
  import { calculatePokemonMvpRace } from './pokemon-match-stats.js';
  import { getPokemonSpriteUrl } from './pokemon-sprites.js';

  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  }

  const leagueId = getCurrentSeasonId();
  const content = document.getElementById('content');
  document.querySelectorAll('.league-subnav a').forEach(link => {
    link.href = link.getAttribute('href') + '?id=' + encodeURIComponent(leagueId);
  });
  document.getElementById('navSignOut').addEventListener('click', () => signOut());

  let stopLeagueSubscription = null;
  let subscribedUserId = null;
  onUserChange(user => {
    if(!user){
      if(stopLeagueSubscription) stopLeagueSubscription();
      stopLeagueSubscription = null;
      subscribedUserId = null;
      document.getElementById('navSignedOut').style.display = '';
      document.getElementById('navSignedIn').style.display = 'none';
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    document.getElementById('navSignedOut').style.display = 'none';
    document.getElementById('navSignedIn').style.display = 'flex';
    document.getElementById('navUserName').textContent = user.displayName || 'Trainer';
    document.getElementById('subnavCommish').style.display = user.role === 'commissioner' ? '' : 'none';
    if(subscribedUserId !== user.uid){
      if(stopLeagueSubscription) stopLeagueSubscription();
      subscribedUserId = user.uid;
      stopLeagueSubscription = subscribeLeague(snapshot => {
        if(!snapshot.exists()){
          content.innerHTML = '<div class="state-msg error">This league doesn’t exist or was deleted.</div>';
          return;
        }
        render(snapshot.data());
      }, error => {
        content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(error.message) + '</div>';
      });
    }
  });

  function render(league){
    if(!league.draft || !league.draft.history || !league.draft.history.length){
      content.innerHTML = '<div class="eyebrow">League stats</div><h1>MVP Race</h1><div class="panel state-msg">The draft has not started yet.</div>';
      return;
    }
    const rows = calculatePokemonMvpRace(league);
    const leader = rows.find(row => row.gamesPlayed > 0);
    const leaderSpriteUrl = leader && getPokemonSpriteUrl(leader);
    content.innerHTML =
      '<div class="eyebrow">League stats</div><h1>MVP Race</h1>' +
      '<p class="lead">Drafted Pokémon rank by kills, then games played, then kill/death differential. Regular-season and playoff games both count.</p>' +
      (leader
        ? '<div class="panel champion"><div class="champion-main">' +
            (leaderSpriteUrl ? '<img class="champion-sprite" src="' + escapeHtml(leaderSpriteUrl) + '" alt="' + escapeHtml(leader.name + (leader.variation ? ' (' + leader.variation + ')' : '')) + '">' : '') +
            '<div><div class="champion-label">Current MVP leader</div><div class="champion-name">' + escapeHtml(leader.name) + (leader.variation ? ' <span class="pokemon-variation">(' + escapeHtml(leader.variation) + ')</span>' : '') + '</div><div class="champion-stat">' + escapeHtml(leader.trainerName) + '</div></div></div><div class="champion-stat">' + leader.kills + ' K · ' + leader.deaths + ' D · ' + (leader.differential > 0 ? '+' : '') + leader.differential + ' diff</div></div>'
        : '<div class="panel state-msg">No Pokémon game stats have been submitted yet.</div>') +
      '<div class="panel table-wrap"><table><thead><tr><th>#</th><th>Pokémon</th><th>Team</th><th>Games</th><th>Kills</th><th>Deaths</th><th>Differential</th></tr></thead><tbody>' +
      rows.map((row, index) =>
        '<tr' + (leader && row.id === leader.id ? ' class="leader"' : '') + '><td>' + (index + 1) + '</td><td>' + escapeHtml(row.name) + (row.variation ? ' <span class="pokemon-variation">(' + escapeHtml(row.variation) + ')</span>' : '') + '</td><td>' + escapeHtml(row.trainerName) + '</td><td>' + row.gamesPlayed + '</td><td>' + row.kills + '</td><td>' + row.deaths + '</td><td>' + (row.differential > 0 ? '+' : '') + row.differential + '</td></tr>'
      ).join('') +
      '</tbody></table><p class="note">Stats submitted so far. Pokémon with no submitted games remain listed with zero stats.</p></div>';
    const leaderSprite = content.querySelector('.champion-sprite');
    if(leaderSprite) leaderSprite.addEventListener('error', () => { leaderSprite.hidden = true; }, { once: true });
  }
</script>
</body>
</html>

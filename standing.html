<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — Pokemon VGC Draft League</title>
<meta name="description" content="League dashboard — members, join code, and commissioner controls.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}

  h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(30px,5vw,46px);margin:8px 0 0;}
  .page-head{margin-bottom:20px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;}

  .standings-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(255,203,5,0.05);}
  .rank{font-family:var(--mono);color:var(--gold);}
  .trainer-name{font-weight:700;display:flex;align-items:center;gap:10px;}
  .standings-team-logo, .standings-team-logo-placeholder{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--slate,#333);flex-shrink:0;}
  .w{color:#3DDC7A;font-weight:700;}
  .l{color:#EE1515;}
  .pct{font-family:var(--mono);color:var(--cream-dim);}
  .streak-w{color:#3DDC7A;font-weight:700;font-family:var(--mono);}
  .streak-l{color:#EE1515;font-weight:700;font-family:var(--mono);}
  .streak-none{color:var(--cream-dim);font-family:var(--mono);}

  .playoff-cutoff-row td{padding:0;border-bottom:none;}
  .playoff-cutoff-line{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0;}
  .playoff-cutoff-line::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--gold);}
  .playoff-cutoff-line span{position:relative;background:var(--panel);padding:0 14px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);}

  .champion-banner{
    text-align:center;padding:40px 20px;background:linear-gradient(180deg, rgba(255,203,5,0.1), var(--panel) 70%);
    border-color:rgba(255,203,5,0.4);
  }
  .champion-banner-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;}
  .champion-banner-logo, .champion-banner-logo-placeholder{
    width:88px;height:88px;border-radius:50%;object-fit:cover;background:var(--slate,#333);
    border:3px solid var(--gold);margin:0 auto 16px;display:block;
  }
  .champion-banner-name{font-family:var(--display);font-size:clamp(30px,5vw,44px);text-transform:uppercase;color:var(--gold);line-height:1;}
  .champion-banner-record{font-family:var(--mono);font-size:13px;color:var(--cream-dim);margin-top:10px;}

  .matchup-modal{
    position:fixed;inset:0;z-index:500;background:rgba(13,13,13,0.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .matchup-modal.show{display:flex;}
  .matchup-modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;position:relative;
  }
  .matchup-modal-close{
    position:absolute;top:16px;right:20px;background:none;border:none;color:var(--cream-dim);
    font-size:24px;cursor:pointer;line-height:1;
  }
  .matchup-modal-close:hover{color:var(--gold);}
  .avatar-thumb, .avatar-thumb-placeholder{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--slate,#333);flex-shrink:0;}

  .clickable-team-name{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color .15s;}
  .clickable-team-name:hover{text-decoration-color:var(--gold);}

  .team-details-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .team-details-head h3{font-family:var(--display);text-transform:uppercase;font-size:22px;margin:0;}
  .team-details-coach{font-size:13px;color:var(--cream-dim);margin-top:2px;}
  .team-details-budget{font-family:var(--mono);font-size:12px;color:var(--gold);margin-top:3px;}
  .team-details-section-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold);margin:18px 0 10px;}
  .team-details-roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px;}
  .team-details-roster-cell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
  .team-details-sprite{width:64px;height:64px;object-fit:contain;}
  .team-details-roster-cell span{font-size:12px;font-weight:600;line-height:1.2;}
  .team-details-tx-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .team-details-tx-list li{font-size:12.5px;color:var(--cream-dim);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .team-details-tx-list li:last-child{border-bottom:none;}
  .settings-note{font-size:12.5px;color:var(--cream-dim);}

  .btn-sm{padding:7px 14px;font-size:11px;}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:#EE1515;color:#FF8A8A;}

  .match-panel{padding:20px;margin-bottom:16px;}
  .match-vs-head{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--display);font-size:22px;text-transform:uppercase;margin-bottom:14px;}
  .match-team-name.winner{color:var(--gold);}
  .match-vs-label{font-family:var(--mono);font-size:12px;color:var(--cream-dim);}
  .winner-pick-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}

  .games-editor{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .games-caption{font-family:var(--mono);font-size:11px;color:var(--cream-dim);margin-bottom:8px;text-align:center;}
  .game-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;color:var(--cream-dim);justify-content:center;}
  .game-label{font-family:var(--mono);min-width:52px;font-size:11px;}
  .game-vs{font-family:var(--mono);font-size:10px;}
  .game-alive-input{
    width:44px;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:5px 6px;border-radius:3px;font-family:var(--mono);font-size:13px;text-align:center;
  }
  .game-alive-input:focus{border-color:var(--gold);}
  .game-diff{font-family:var(--mono);font-weight:700;min-width:32px;text-align:right;color:var(--gold);}
  .game-remove-btn{background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:13px;padding:0 2px;}
  .game-remove-btn:hover{color:#EE1515;}
  .add-game-btn{
    display:block;margin:8px auto 0;background:none;border:1px dashed var(--line);color:var(--cream-dim);font-family:var(--mono);
    font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;
  }
  .add-game-btn:hover{border-color:var(--gold);color:var(--gold);}
  .total-diff-row{margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);text-align:center;}

  .standing-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .standing-tab{
    background:var(--ink-soft);border:1px solid var(--line);color:var(--cream-dim);
    padding:9px 18px;border-radius:4px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;
  }
  .standing-tab.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}

  .bracket{display:flex;gap:24px;overflow-x:auto;padding-bottom:8px;}
  .bracket-round{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-width:180px;}
  .bracket-round-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold);margin-bottom:6px;}
  .bracket-match{background:var(--ink-soft);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .bracket-slot{padding:9px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);}
  .bracket-slot:last-child{border-bottom:none;}
  .bracket-slot.tbd{color:var(--cream-dim);font-style:italic;font-weight:400;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .league-logo-header{width:44px;height:44px;border-radius:50%;object-fit:cover;float:right;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="nav-left-group">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      Pokemon VGC Draft League
    </a>
    <a href="champions.html" class="nav-former-champions">Past Champions</a>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="pool.html">Pool</a>
      <a href="format.html">Format</a>
      <span id="navSignedOut"><a href="signin.html" class="nav-cta">Sign In</a></span>
      <span id="navSignedIn" class="nav-account" style="display:none;">
        <div class="nav-leagues-wrap">
          <button id="navLeaguesBtn" class="btn btn-sm" type="button">Leagues &#9662;</button>
          <div id="navLeaguesMenu" class="nav-leagues-menu">
            <div id="navLeaguesDefaultView">
              <div class="nlm-label">My Leagues</div>
              <ul id="navLeaguesList" class="nlm-list"></ul>
              <div class="nlm-empty" id="navLeaguesEmpty" style="display:none;">You're not in any leagues yet.</div>
              <div class="nlm-divider"></div>
              <button type="button" class="nlm-action" id="navShowJoinBtn">+ Join a League</button>
            </div>
            <div id="navJoinView" style="display:none;">
              <div class="nlm-label">Join a League</div>
              <input type="text" id="navJoinCodeInput" class="nlm-input" placeholder="e.g. 7QJKXT" maxlength="6" style="text-transform:uppercase;">
              <div class="nlm-form-actions">
                <button type="button" class="btn btn-primary btn-sm" id="navJoinSubmitBtn">Join</button>
                <button type="button" class="btn btn-sm" id="navJoinCancelBtn">Cancel</button>
              </div>
              <p class="nlm-status" id="navJoinStatus"></p>
            </div>
          </div>
        </div>
        <span id="navUserEmail"></span>
        <button id="navSignOutBtn" class="btn btn-sm">Sign Out</button>
      </span>
    </nav>
  </div>
</header>

<div class="league-subnav">
  <div class="league-subnav-inner">
    <a href="match.html" id="subnavMatch" class="subnav-tab">Match</a>
    <a href="team.html" id="subnavTeam" class="subnav-tab">Team</a>
    <a href="freeagency.html" id="subnavFA" class="subnav-tab">Free Agency</a>
    <a href="trades.html" id="subnavTrades" class="subnav-tab">Trades</a>
    <a href="standing.html" id="subnavStanding" class="subnav-tab active">Standing</a>
    <a href="announcements.html" id="subnavAnnouncements" class="subnav-tab">Announcements</a>
    <a href="draft.html" id="subnavDraft" class="subnav-tab">Draft Room</a>
    <a href="commissioner.html" id="subnavCommish" class="subnav-tab" style="display:none;">Commissioner</a>
  </div>
</div>

<main>
  <div id="content">

"1030": "867", "1032": "869", "1033": "870", "1254": "10303", "1042": "877", "1053": "887", "1071": "899", "1072": "900", "1074": "902", "1075": "10248", "1076": "903", "1077": "904", "1082": "908", "1085": "911", "1088": "914", "1100": "925", "1113": "934", "1115": "936", "1116": "937", "1118": "939", "1131": "952", "1255": "10320", "1135": "956", "1138": "959", "1143": "964", "1148": "968", "1150": "970", "1256": "10321", "1152": "972", "1159": "979", "1161": "981", "1164": "983", "1182": "1000", "1198": "1013", "1206": "1018", "1207": "1019", "1300": "83", "1302": "122", "1303": "317", "1304": "865", "1305": "40", "1306": "53", "1307": "10108", "1308": "10307", "1309": "10089", "1310": "373", "1311": "10309", "1312": "10310", "1313": "673", "1314": "768", "1315": "10316", "1316": "812", "1317": "815", "1318": "818", "1319": "828", "1320": "849", "1321": "853", "1322": "863", "1323": "871", "1324": "10186", "1325": "876", "1326": "923", "1327": "930", "1328": "931", "1329": "943", "1330": "998", "1331": "10325"};
  function spriteCandidates(mon){
    const pokeapiId = ID_TO_POKEAPI_ID[mon.id];
    if(!pokeapiId) return [];
    return ['https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokeapiId + '.png'];
  }
  function makeSpriteImg(mon, cssClass){
    const candidates = spriteCandidates(mon);
    const img = document.createElement('img');
    img.className = cssClass; img.alt=''; img.loading='lazy'; img.src = candidates[0] || PLACEHOLDER_SPRITE;
    let idx=0;
    img.addEventListener('error', () => {
      idx++;
      if(idx < candidates.length){ img.src = candidates[idx]; }
      else { img.onerror=null; img.src = PLACEHOLDER_SPRITE; img.style.opacity='0.4'; }
    });
    return img;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const content = document.getElementById('content');
  const params = new URLSearchParams(window.location.search);
  const leagueId = params.get('id');

  ['subnavMatch','subnavTeam','subnavFA','subnavTrades','subnavStanding','subnavAnnouncements','subnavDraft','subnavCommish'].forEach(id => {
    const el = document.getElementById(id);
    if(el && leagueId) el.href = el.getAttribute('href') + '?id=' + leagueId;
  });

  let currentUser = null;
  function updateNavGlow(league){
    const glowTab = (id, active) => {
      const el = document.getElementById(id);
      if(el) el.classList.toggle('subnav-tab-glow', !!active);
    };
    if(!currentUser || !league || !league.draft || !league.draft.trainers){
      ['subnavMatch','subnavTrades','subnavStanding','subnavAnnouncements'].forEach(id => glowTab(id, false));
      return;
    }
    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);
    glowTab('subnavTrades', tradesUnseen);

    const announcementsSeenAt = (me && me.announcementsSeenAt) || 0;
    const announcementsUnseen = (league.announcements || []).some(a => (a.timestamp || 0) > announcementsSeenAt);
    glowTab('subnavAnnouncements', announcementsUnseen);

    let matchToken = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ matchToken = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      matchToken = 'w' + idx;
    }
    const matchUnseen = matchToken !== null && matchToken !== (me && me.matchSeenToken);
    glowTab('subnavMatch', matchUnseen);

    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    const standingToken = resultCount > 0 ? String(resultCount) : null;
    const standingUnseen = standingToken !== null && standingToken !== (me && me.standingSeenToken);
    glowTab('subnavStanding', standingUnseen);
  }


  function matchDifferential(r){
    if(!r || !r.games) return 0;
    return r.games.reduce((sum, g) => (g.a != null && g.b != null) ? sum + (g.a - g.b) : sum, 0);
  }

  function computeStandingsRows(league){
    const trainers = league.draft.trainers;
    const results = (league.schedule && league.schedule.results) || {};
    const stats = {};
    trainers.forEach(t => { stats[t.uid] = { wins: 0, losses: 0, koDiff: 0 }; });

    Object.values(results).forEach(r => {
      if(!r || !stats[r.winner] || !stats[r.loser]) return;
      stats[r.winner].wins += 1;
      stats[r.loser].losses += 1;
      const diff = matchDifferential(r);
      stats[r.winner].koDiff += diff;
      stats[r.loser].koDiff -= diff;
    });

    const waiverOrder = (league.waiverPriority && league.waiverPriority.length) ? league.waiverPriority : trainers.map(t => t.uid);

    function headToHeadDelta(uidA, uidB){
      let aWins = 0, bWins = 0;
      Object.values(results).forEach(r => {
        if(!r) return;
        if(r.winner === uidA && r.loser === uidB) aWins++;
        else if(r.winner === uidB && r.loser === uidA) bWins++;
      });
      return bWins - aWins; // positive -> b ranks higher
    }

    return trainers.map(t => {
      const s = stats[t.uid];
      const played = s.wins + s.losses;
      return {
        uid: t.uid, name: t.name, avatar: t.avatar,
        wins: s.wins, losses: s.losses,
        pct: played > 0 ? s.wins / played : 0,
        koDiff: s.koDiff,
        waiverPos: waiverOrder.indexOf(t.uid) + 1,
        streak: computeStreak(t.uid, results)
      };
    }).sort((a,b) => b.wins - a.wins || b.koDiff - a.koDiff || headToHeadDelta(a.uid, b.uid) || a.losses - b.losses || a.name.localeCompare(b.name));
  }

  function computeStreak(uid, results){
    const entries = [];
    Object.keys(results).forEach(key => {
      const r = results[key];
      if(!r || (r.winner !== uid && r.loser !== uid)) return;
      const parts = key.split('_');
      entries.push({ weekIdx: parseInt(parts[0],10), matchIdx: parseInt(parts[1],10), won: r.winner === uid });
    });
    if(entries.length === 0) return null;
    entries.sort((a,b) => a.weekIdx - b.weekIdx || a.matchIdx - b.matchIdx);
    const last = entries[entries.length-1];
    const type = last.won ? 'W' : 'L';
    let count = 0;
    for(let i = entries.length-1; i >= 0; i--){
      if((type === 'W' && entries[i].won) || (type === 'L' && !entries[i].won)) count++;
      else break;
    }
    return type + count;
  }

  let standingSeenMarked = false;
  function markStandingSeen(league){
    if(standingSeenMarked || !currentUser || !league.draft) return;
    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    if(resultCount <= 0) return;
    const token = String(resultCount);
    const idx = league.draft.trainers.findIndex(t => t.uid === currentUser.uid);
    if(idx < 0) return;
    if(league.draft.trainers[idx].standingSeenToken === token) return;
    standingSeenMarked = true;
    const updatedTrainers = league.draft.trainers.map((t, i) => i === idx ? Object.assign({}, t, { standingSeenToken: token }) : t);
    updateDoc(doc(db, 'leagues', leagueId), { ['draft.trainers']: updatedTrainers }).catch(() => { standingSeenMarked = false; });
  }

  function render(league){
    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = isCommish ? '' : 'none';
    const subnavDraft = document.getElementById('subnavDraft');
    if(subnavDraft) subnavDraft.style.display = '';
    updateNavGlow(league);
    markStandingSeen(league);

    if(!league.draft){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Standing</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        '<div class="panel state-msg">Standings open up once your league\'s draft is complete.</div>';
      return;
    }

    const rows = computeStandingsRows(league);
    const playoffTeams = (league.settings && league.settings.playoffTeams) || 4;

    content.innerHTML =
      '<div class="page-head">' +
        (league.logo ? '<img class="league-logo-header" src="' + escapeHtml(league.logo) + '" alt="">' : '') +
        '<span class="eyebrow">Standing</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
      '</div>' +
      '<div class="standing-tabs">' +
        '<button class="standing-tab active" id="tabStandings" type="button">Standings</button>' +
        '<button class="standing-tab" id="tabPlayoffs" type="button">Playoffs</button>' +
      '</div>' +
      '<div id="standingsView">' +
        '<div class="panel">' +
          '<p class="settings-note" style="margin:0 0 14px;">Ties are broken in order: Wins → KO Differential → Head-to-Head Record → Losses.</p>' +
          '<div class="standings-scroll"><table><thead><tr>' +
            '<th>Rank</th><th>Trainer</th><th>W</th><th>L</th><th>Win %</th><th>KO Diff</th><th>Waiver</th><th>Streak</th>' +
          '</tr></thead><tbody id="standingsBody"></tbody></table></div>' +
        '</div>' +
      '</div>' +
      '<div id="playoffsView" style="display:none;">' +
        '<div id="playoffsContent"></div>' +
      '</div>';

    document.getElementById('tabStandings').addEventListener('click', () => {
      document.getElementById('tabStandings').classList.add('active');
      document.getElementById('tabPlayoffs').classList.remove('active');
      document.getElementById('standingsView').style.display = 'block';
      document.getElementById('playoffsView').style.display = 'none';
    });
    document.getElementById('tabPlayoffs').addEventListener('click', () => {
      document.getElementById('tabPlayoffs').classList.add('active');
      document.getElementById('tabStandings').classList.remove('active');
      document.getElementById('playoffsView').style.display = 'block';
      document.getElementById('standingsView').style.display = 'none';
    });

    renderPlayoffsTab(league, rows, playoffTeams, isCommish);

    const body = document.getElementById('standingsBody');
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      const diffText = (r.koDiff > 0 ? '+' : '') + r.koDiff;
      const streakClass = !r.streak ? 'streak-none' : (r.streak.startsWith('W') ? 'streak-w' : 'streak-l');
      tr.innerHTML =
        '<td class="rank">' + String(i+1).padStart(2,'0') + '</td>' +
        '<td class="trainer-name clickable-team-name" data-uid="' + escapeHtml(r.uid) + '">' +
          (r.avatar ? '<img class="standings-team-logo" src="' + escapeHtml(r.avatar) + '" alt="">' : '<span class="standings-team-logo-placeholder"></span>') +
          escapeHtml(r.name) +
        '</td>' +
        '<td class="w">' + r.wins + '</td>' +
        '<td class="l">' + r.losses + '</td>' +
        '<td class="pct">' + (r.wins+r.losses > 0 ? Math.round(r.pct*100)+'%' : '—') + '</td>' +
        '<td class="pct">' + diffText + '</td>' +
        '<td class="pct">' + (r.waiverPos > 0 ? '#' + r.waiverPos : '—') + '</td>' +
        '<td class="' + streakClass + '">' + (r.streak || '—') + '</td>';
      tr.querySelector('.clickable-team-name').addEventListener('click', () => openTeamDetails(league, r.uid));
      body.appendChild(tr);

      if(i === playoffTeams - 1 && rows.length > playoffTeams){
        const cutoffRow = document.createElement('tr');
        cutoffRow.className = 'playoff-cutoff-row';
        const cutoffCell = document.createElement('td');
        cutoffCell.colSpan = 8;
        cutoffCell.innerHTML = '<div class="playoff-cutoff-line"><span>Playoff Cutoff — Top ' + playoffTeams + ' Advance</span></div>';
        cutoffRow.appendChild(cutoffCell);
        body.appendChild(cutoffRow);
      }
    });
  }

  const SEED_ORDER = {
    2: [1,2],
    4: [1,4,2,3],
    8: [1,8,4,5,2,7,3,6],
    16: [1,16,8,9,4,13,5,12,2,15,7,10,3,14,6,11]
  };

  function formatTxLine(league, uid, tx){
    const date = new Date(tx.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    if(tx.type === 'fa_swap'){
      const claimNames = (tx.claims||[]).map(m=>m.name).join(', ');
      const dropNames = (tx.drops||[]).map(m=>m.name).join(', ');
      let line = '';
      if(claimNames) line += 'Claimed ' + claimNames;
      if(dropNames) line += (line ? ' · ' : '') + 'Dropped ' + dropNames;
      return date + ' — ' + (line || 'Free agency move');
    }
    if(tx.type === 'trade'){
      const isProposer = tx.proposerUid === uid;
      const gave = isProposer ? tx.offered : tx.requested;
      const got = isProposer ? tx.requested : tx.offered;
      const other = isProposer ? tx.recipientName : tx.proposerName;
      return date + ' — Traded ' + (gave||[]).map(m=>m.name).join(', ') + ' to ' + escapeHtml(other) + ' for ' + (got||[]).map(m=>m.name).join(', ');
    }
    return date + ' — Transaction';
  }

  function openTeamDetails(league, uid){
    const trainer = league.draft.trainers.find(t => t.uid === uid);
    if(!trainer) return;
    document.getElementById('detailsName').textContent = trainer.name;
    const coachEl = document.getElementById('detailsCoach');
    if(coachEl) coachEl.textContent = trainer.coachName || '';
    const budgetStart = league.draft.budgetStart || 100;
    const usedPts = budgetStart - trainer.budget;
    document.getElementById('detailsBudget').textContent = usedPts + ' / ' + budgetStart + ' pts used';
    const avatarEl = document.getElementById('detailsAvatar');
    const placeholderEl = document.getElementById('detailsAvatarPlaceholder');
    if(trainer.avatar){ avatarEl.src = trainer.avatar; avatarEl.style.display = ''; placeholderEl.style.display = 'none'; }
    else { avatarEl.style.display = 'none'; placeholderEl.style.display = ''; }

    const rosterGrid = document.getElementById('detailsRosterGrid');
    rosterGrid.innerHTML = '';
    (trainer.roster || []).forEach(mon => {
      const cell = document.createElement('div');
      cell.className = 'team-details-roster-cell';
      cell.appendChild(makeSpriteImg(mon, 'team-details-sprite'));
      const name = document.createElement('span');
      name.textContent = mon.name + (mon.variation ? ' (' + mon.variation + ')' : '');
      cell.appendChild(name);
      rosterGrid.appendChild(cell);
    });
    if((trainer.roster||[]).length === 0){
      rosterGrid.innerHTML = '<p class="settings-note">No Pokémon drafted yet.</p>';
    }

    const txWrap = document.getElementById('detailsTxList');
    const relevant = (league.transactionLog || []).filter(tx =>
      (tx.type === 'fa_swap' && tx.trainerUid === uid) ||
      (tx.type === 'trade' && (tx.proposerUid === uid || tx.recipientUid === uid))

  async function generatePlayoffBracket(league, rows, playoffTeams){
    if(rows.length < playoffTeams){ alert('Not enough trainers for a ' + playoffTeams + '-team bracket yet.'); return; }
    let bracketSize = 2;
    while(bracketSize < playoffTeams) bracketSize *= 2;
    bracketSize = Math.min(bracketSize, 16);
    const order = SEED_ORDER[bracketSize] || SEED_ORDER[8];
    const seededUids = order.map(seedNum => seedNum <= playoffTeams ? rows[seedNum-1].uid : null);

    const rounds = [];
    const r1matches = [];
    for(let i = 0; i < seededUids.length; i += 2){
      r1matches.push({ a: seededUids[i], b: seededUids[i+1], winner: null, games: [], locked: false });
    }
    rounds.push({ label: 'Round 1', matches: r1matches });
    let remaining = r1matches.length / 2;
    const laterLabels = remaining >= 4 ? ['Quarterfinals','Semifinals','Final'] : remaining === 2 ? ['Semifinals','Final'] : ['Final'];
    let labelIdx = 0;
    while(remaining >= 1){
      const matches = [];
      for(let i = 0; i < remaining; i++) matches.push({ a: null, b: null, winner: null, games: [], locked: false });
      rounds.push({ label: laterLabels[labelIdx], matches });
      labelIdx++;
      if(remaining === 1) break;
      remaining = remaining / 2;
    }
    function propagate(){
      for(let r = 0; r < rounds.length - 1; r++){
        rounds[r].matches.forEach((m, i) => {
          if(m.winner){
            const nextMatch = rounds[r+1].matches[Math.floor(i/2)];
            if(nextMatch) nextMatch[i % 2 === 0 ? 'a' : 'b'] = m.winner;
          } else if(m.a && !m.b){ m.winner = m.a; m.locked = true; }
          else if(m.b && !m.a){ m.winner = m.b; m.locked = true; }
        });
      }
    }
    propagate(); propagate(); propagate();

    try{
      await updateDoc(doc(db, 'leagues', leagueId), { playoffBracket: { generatedAt: Date.now(), rounds } });
      pushAnnouncement(league, 'match', 'Commissioner' + ' generated the playoff bracket');
    }catch(err){ alert('Could not generate bracket: ' + err.message); }
  }

  let bracketPendingWinner = {};

  function renderGamesEditor(container, existing, key, canEdit){
    const games = (existing && existing.games && existing.games.length) ? JSON.parse(JSON.stringify(existing.games)) : [{a:null,b:null}];
    function draw(){
      container.innerHTML = '';
      games.forEach((g, gIdx) => {
        const row = document.createElement('div'); row.className = 'game-row';
        const label = document.createElement('span'); label.className='game-label'; label.textContent = 'Game ' + (gIdx+1);
        row.appendChild(label);
        const aInput = document.createElement('input'); aInput.type='number'; aInput.min='0'; aInput.max='6'; aInput.className='game-alive-input'; aInput.value = g.a!=null?g.a:'';
        const vs = document.createElement('span'); vs.className='game-vs'; vs.textContent='vs';
        const bInput = document.createElement('input'); bInput.type='number'; bInput.min='0'; bInput.max='6'; bInput.className='game-alive-input'; bInput.value = g.b!=null?g.b:'';
        const diff = document.createElement('span'); diff.className='game-diff';
        function updateDiff(){ diff.textContent = (g.a!=null&&g.b!=null) ? ((g.a-g.b)>0?'+':'')+(g.a-g.b) : '—'; }
        updateDiff();
        function commit(){ g.a = aInput.value===''?null:parseInt(aInput.value,10); g.b = bInput.value===''?null:parseInt(bInput.value,10); updateDiff(); }
        aInput.disabled = !canEdit; bInput.disabled = !canEdit;
        aInput.addEventListener('change', commit); bInput.addEventListener('change', commit);
        row.appendChild(aInput); row.appendChild(vs); row.appendChild(bInput); row.appendChild(diff);
        if(canEdit){
          const rm = document.createElement('button'); rm.type='button'; rm.className='game-remove-btn'; rm.textContent='✕';
          rm.addEventListener('click', () => { if(games.length>1){ games.splice(gIdx,1); draw(); } });
          row.appendChild(rm);
        }
        container.appendChild(row);
      });
      if(canEdit){
        const addBtn = document.createElement('button'); addBtn.type='button'; addBtn.className='add-game-btn'; addBtn.textContent='+ Add game';
        addBtn.addEventListener('click', () => { games.push({a:null,b:null}); draw(); });
        container.appendChild(addBtn);
      }
      const total = games.reduce((s,g)=> (g.a!=null&&g.b!=null) ? s+(g.a-g.b) : s, 0);
      const totalRow = document.createElement('div'); totalRow.className='total-diff-row';
      totalRow.textContent = 'Total Differential: ' + (total>0?'+':'') + total;
      container.appendChild(totalRow);
    }
    draw();
    return { getGames: () => games };
  }

  function renderBracketMatchCard(league, roundIdx, matchIdx, match, isCommish, myUid){
    const key = roundIdx + '_' + matchIdx;
    const card = document.createElement('div');
    card.className = 'panel match-panel';

    if(!match.a || !match.b){
      card.innerHTML = '<div class="state-msg">Waiting on previous round to finish</div>';
      return card;
    }

    const nameA = trainerNameOf(match.a), nameB = trainerNameOf(match.b);
    const isParty = myUid === match.a || myUid === match.b;
    const canEditPermission = !match.locked && (isParty || isCommish);
    const showEditor = match.locked ? (isCommish && bracketEditingKeys[key]) : canEditPermission;

    const head = document.createElement('div'); head.className = 'match-vs-head';
    head.innerHTML =
      '<span class="match-team-name' + (match.winner===match.a?' winner':'') + '">' + escapeHtml(nameA) + '</span>' +
      '<span class="match-vs-label">VS</span>' +
      '<span class="match-team-name' + (match.winner===match.b?' winner':'') + '">' + escapeHtml(nameB) + '</span>';
    card.appendChild(head);

    if(!match.locked || showEditor){
      const pickRow = document.createElement('div'); pickRow.className = 'winner-pick-row';
      if(bracketPendingWinner[key] === undefined) bracketPendingWinner[key] = match.winner || null;
      [match.a, match.b].forEach(uid => {
        const btn = document.createElement('button'); btn.type='button';
        btn.className = 'btn btn-sm' + (bracketPendingWinner[key]===uid ? ' btn-primary' : '');
        btn.textContent = 'Winner: ' + trainerNameOf(uid);
        btn.addEventListener('click', () => { bracketPendingWinner[key] = uid; renderPlayoffsTab(currentLeague, currentRows, currentPlayoffTeams, isCommish); });
        pickRow.appendChild(btn);
      });
      card.appendChild(pickRow);

      const gamesContainer = document.createElement('div'); gamesContainer.className = 'games-editor';
      card.appendChild(gamesContainer);
      const gamesCtrl = renderGamesEditor(gamesContainer, match, key, true);

      const saveBtn = document.createElement('button'); saveBtn.className='btn btn-primary btn-sm'; saveBtn.style.marginTop='12px';
      saveBtn.textContent = match.locked ? 'Save Correction' : 'Lock In Result';
      saveBtn.addEventListener('click', async () => {
        const winner = bracketPendingWinner[key];
        if(!winner){ alert('Pick a winner first.'); return; }
        const games = gamesCtrl.getGames().filter(g => g.a!=null && g.b!=null);
        await saveBracketResult(roundIdx, matchIdx, winner, games);
        delete bracketEditingKeys[key];
      });
      card.appendChild(saveBtn);

      if(isCommish){
        const forfeitBtn = document.createElement('button');
        forfeitBtn.className = 'btn btn-sm btn-danger'; forfeitBtn.style.marginTop='12px'; forfeitBtn.style.marginLeft='8px';
        forfeitBtn.textContent = 'Force Result (Forfeit / No Game Data)';
        forfeitBtn.addEventListener('click', async () => {
          const winner = bracketPendingWinner[key];
          if(!winner){ alert('Pick a winner first.'); return; }
          await saveBracketResult(roundIdx, matchIdx, winner, [], true);
          delete bracketEditingKeys[key];
        });
        card.appendChild(forfeitBtn);
      }
    } else {
      const capt = document.createElement('div'); capt.className='games-caption';
      capt.innerHTML = '<span style="color:var(--gold);font-weight:700;">' + escapeHtml(trainerNameOf(match.winner)) + '</span> advances' + (match.forfeit ? ' <span style="color:#FF8A8A;">(by forfeit)</span>' : '');
      card.appendChild(capt);
      if(!match.forfeit){
        const gamesContainer = document.createElement('div'); gamesContainer.className='games-editor';
        card.appendChild(gamesContainer);
        renderGamesEditor(gamesContainer, match, key, false);
      }
      const lockTag = document.createElement('div'); lockTag.className='settings-note'; lockTag.textContent='🔒 Result locked in';
      card.appendChild(lockTag);
      if(isCommish){
        const editBtn = document.createElement('button'); editBtn.className='btn btn-sm'; editBtn.style.marginTop='10px'; editBtn.textContent='Edit Result (Commissioner Override)';
        editBtn.addEventListener('click', () => { bracketEditingKeys[key]=true; renderPlayoffsTab(currentLeague, currentRows, currentPlayoffTeams, isCommish); });
        card.appendChild(editBtn);
      }
    }
    return card;
  }

  async function saveBracketResult(roundIdx, matchIdx, winner, games, forfeit){
    const bracket = JSON.parse(JSON.stringify(currentLeague.playoffBracket));
    const match = bracket.rounds[roundIdx].matches[matchIdx];
    match.winner = winner; match.games = games; match.locked = true; match.forfeit = !!forfeit;
    if(bracket.rounds[roundIdx+1]){
      const nextMatch = bracket.rounds[roundIdx+1].matches[Math.floor(matchIdx/2)];
      if(nextMatch){
        nextMatch[matchIdx % 2 === 0 ? 'a' : 'b'] = winner;
      }
    }
    const isChampion = roundIdx === bracket.rounds.length - 1;
    const updates = { playoffBracket: bracket };
    if(isChampion){
      updates.seasonComplete = true;
      updates.championUid = winner;
      updates.seasonCompletedAt = Date.now();
    }
    try{
      await updateDoc(doc(db, 'leagues', leagueId), updates);
      const forfeitNote = forfeit ? ' by forfeit' : '';
      const loser = winner === match.a ? match.b : match.a;
      pushAnnouncement(currentLeague, isChampion ? 'season_complete' : 'match', isChampion
        ? '🏆 ' + trainerNameOf(winner) + ' has won the championship! The season is complete.'
        : trainerNameOf(winner) + ' advances to the next round' + forfeitNote);
      if(isChampion){
        sendDiscordGeneral('🎊 **' + trainerNameOf(winner) + '** has won the championship! 🏆', discordLogoEmbed(currentLeague.draft.trainers.find(t=>t.uid===winner)));
      } else {
        sendDiscordGeneral('🏆 **' + trainerNameOf(winner) + '** defeated **' + trainerNameOf(loser) + '**' + forfeitNote + ' (Playoffs)', discordLogoEmbed(currentLeague.draft.trainers.find(t=>t.uid===winner)));
      }
    }catch(err){ alert('Could not save result: ' + err.message); }
  }

  let currentLeague = null, currentRows = null, currentPlayoffTeams = 4;

  function renderPlayoffsTab(league, rows, playoffTeams, isCommish){
    currentLeague = league; currentRows = rows; currentPlayoffTeams = playoffTeams;
    const wrap = document.getElementById('playoffsContent');
    if(!wrap) return;

    if(!league.playoffBracket){
      wrap.innerHTML =
        '<div class="panel">' +
          '<p class="settings-note" style="margin:0 0 16px;">A live projection based on today\'s standings \u2014 updates automatically as records change. Seeding: 1 vs ' + playoffTeams + ', 2 vs ' + (playoffTeams-1) + ', and so on.</p>' +
          (isCommish ? '<button class="btn btn-primary btn-sm" id="genBracketBtn" style="margin-bottom:16px;">Generate Playoff Bracket (locks in current seeding)</button>' : '') +
          '<div id="bracketWrap"></div>' +
        '</div>';
      renderPlayoffBracket(rows, playoffTeams);
      if(isCommish){
        document.getElementById('genBracketBtn').addEventListener('click', () => generatePlayoffBracket(league, rows, playoffTeams));
      }
      return;
    }

    const bracket = league.playoffBracket;
    const champion = bracket.rounds[bracket.rounds.length-1].matches[0].locked ? bracket.rounds[bracket.rounds.length-1].matches[0].winner : null;

    let html = '';
    if(champion){
      const championTrainer = league.draft.trainers.find(t => t.uid === champion);
      const championRow = (rows || []).find(r => r.uid === champion);
      const recordText = championRow ? (championRow.wins + '-' + championRow.losses + ' regular season record') : '';
      html += '<div class="panel champion-banner">' +
        '<div class="champion-banner-eyebrow">\ud83c\udfc6 Season Champion</div>' +
        (championTrainer && championTrainer.avatar ? '<img class="champion-banner-logo" src="' + escapeHtml(championTrainer.avatar) + '" alt="">' : '<span class="champion-banner-logo-placeholder"></span>') +
        '<div class="champion-banner-name">' + escapeHtml(trainerNameOf(champion)) + '</div>' +
        (recordText ? '<div class="champion-banner-record">' + escapeHtml(recordText) + '</div>' : '') +
      '</div>';
    }
    wrap.innerHTML = html + '<div id="bracketRoundsWrap"></div>';

    const roundsWrap = document.getElementById('bracketRoundsWrap');
    bracket.rounds.forEach((round, rIdx) => {
      const section = document.createElement('div');
      section.innerHTML = '<h2 style="margin:24px 0 12px;">' + escapeHtml(round.label) + '</h2>';
      roundsWrap.appendChild(section);
      round.matches.forEach((match, mIdx) => {
        roundsWrap.appendChild(renderBracketMatchCard(league, rIdx, mIdx, match, isCommish, currentUser ? currentUser.uid : null));
      });
    });
  }

  function renderPlayoffBracket(rows, playoffTeams){
    const wrap = document.getElementById('bracketWrap');
    if(!wrap) return;
    if(rows.length < playoffTeams){
      wrap.innerHTML = '<div class="state-msg">Not enough trainers for a ' + playoffTeams + '-team bracket yet.</div>';
      return;
    }
    let bracketSize = 2;
    while(bracketSize < playoffTeams) bracketSize *= 2;
    bracketSize = Math.min(bracketSize, 16);
    const order = SEED_ORDER[bracketSize] || SEED_ORDER[8];

    const seededNames = order.map(seedNum => seedNum <= playoffTeams ? rows[seedNum-1].name : null);

    const bracketEl = document.createElement('div');
    bracketEl.className = 'bracket';

    const r1 = document.createElement('div');
    r1.className = 'bracket-round';
    r1.innerHTML = '<div class="bracket-round-label">Round 1</div>';
    for(let i = 0; i < seededNames.length; i += 2){
      const a = seededNames[i], b = seededNames[i+1];
      const match = document.createElement('div');
      match.className = 'bracket-match';
      match.innerHTML =
        '<div class="bracket-slot' + (!a ? ' tbd' : '') + '">' + escapeHtml(a || 'BYE') + '</div>' +
        '<div class="bracket-slot' + (!b ? ' tbd' : '') + '">' + escapeHtml(b || 'BYE') + '</div>';
      r1.appendChild(match);
    }
    bracketEl.appendChild(r1);

    let remaining = seededNames.length / 2;
    const laterLabels = remaining === 4 ? ['Quarterfinals','Semifinals','Final'] : remaining === 2 ? ['Semifinals','Final'] : ['Final'];
    let labelIdx = laterLabels.length >= 3 ? 1 : 0;
    while(remaining > 1){
      remaining = remaining / 2;
      const round = document.createElement('div');
      round.className = 'bracket-round';
      round.innerHTML = '<div class="bracket-round-label">' + laterLabels[labelIdx] + '</div>';
      labelIdx++;
      for(let i = 0; i < remaining; i++){
        const match = document.createElement('div');
        match.className = 'bracket-match';
        match.innerHTML = '<div class="bracket-slot tbd">TBD</div><div class="bracket-slot tbd">TBD</div>';
        round.appendChild(match);
      }
      bracketEl.appendChild(round);
    }

    wrap.innerHTML = '';
    wrap.appendChild(bracketEl);
  }

    navJoinSubmitBtn.disabled = true;

      if(snap.empty){
        navJoinStatus.textContent = 'No league found with that code.';
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();

      const currentMemberCount = Object.keys(leagueData.members || {}).length;

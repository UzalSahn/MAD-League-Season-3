<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Room — Pokemon VGC Draft League</title>
<meta name="description" content="Live draft room — pulls trainers straight from your league.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D; --ink-soft:#161616; --panel:#1C1C1C; --panel-2:#242424;
    --cream:#FAFAF7; --cream-dim:#B8B7B2; --gold:#FFCB05; --gold-soft:#C79A00;
    --teal:#B00000; --teal-bright:#FF5A5A; --scarlet:#EE1515; --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);
    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1400px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:1400px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}
  .nav-links{display:flex;align-items:center;gap:16px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}

  main{max-width:1400px;margin:0 auto;padding:28px 22px 80px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .state-msg{text-align:center;padding:60px 20px;color:var(--cream-dim);font-size:14px;}

  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:11px 20px;border-radius:3px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--cream);
    font-family:var(--body);transition:transform .12s ease, border-color .15s ease;}
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:var(--scarlet);}
  .btn-sm{padding:7px 14px;font-size:11px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .field-inline label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;}
  .field-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:26px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:12.5px;color:var(--cream-dim);margin-top:6px;max-width:340px;}

  .draft-order-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .draft-order-item{
    display:flex;align-items:center;gap:12px;background:var(--ink-soft);border:1px solid var(--line);
    border-radius:5px;padding:10px 14px;
  }
  .draft-order-num{font-family:var(--mono);font-weight:700;color:var(--gold);min-width:20px;}
  .draft-order-name{flex:1;font-weight:600;}
  .draft-order-coach{font-weight:400;color:var(--cream-dim);font-size:13px;}
  .draft-order-arrows{display:flex;gap:4px;}
  .draft-order-arrows .btn{padding:4px 10px;font-size:11px;}

  .readiness-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .readiness-item{
    display:flex;align-items:center;gap:12px;background:var(--ink-soft);border:1px solid var(--line);
    border-radius:5px;padding:9px 14px;
  }
  .readiness-avatar, .readiness-avatar-placeholder{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--slate,#333);flex-shrink:0;}
  .readiness-name{flex:1;font-weight:600;font-size:13.5px;}
  .readiness-badge{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;padding:3px 10px;border-radius:10px;}
  .readiness-badge.ready{background:rgba(61,220,122,0.15);color:#3DDC7A;}
  .readiness-badge.not-ready{background:rgba(238,21,21,0.15);color:#FF8A8A;}
  select, input{background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;}
  select:focus, input:focus{border-color:var(--gold);}

  /* status bar */
  .status-bar{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding:20px 24px;}
  .clock-info{display:flex;gap:28px;flex-wrap:wrap;align-items:center;}
  .clock-info .eyebrow{font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;display:block;margin-bottom:4px;}
  .clock-info .big{font-family:var(--display);font-size:28px;text-transform:uppercase;}
  #pickTimer.urgent{color:var(--scarlet) !important;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .status-actions{display:flex;gap:10px;}

  /* board strip */
  .board-frame{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px;}
  .board-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);}
  .board-head .live{display:flex;align-items:center;gap:8px;color:var(--scarlet);}
  .board-head .live .dot{width:7px;height:7px;border-radius:50%;background:var(--scarlet);animation:pulse 1.6s infinite;}
  .board-scroll{display:flex;overflow-x:auto;padding:4px;}
  .board-slot{min-width:150px;flex-shrink:0;padding:14px 16px;border-right:1px solid var(--line);}

  .recap-board-wrap{overflow-x:auto;padding-bottom:8px;}

  .grade-cards-row{display:flex;flex-wrap:wrap;gap:14px;}
  .grade-card{
    flex:1;min-width:150px;background:var(--ink-soft);border:1px solid var(--line);border-radius:6px;
    padding:16px;text-align:center;
  }
  .grade-letter{font-family:var(--display);font-size:38px;line-height:1;margin-bottom:6px;}
  .grade-A, .grade-Aminus{color:#4ADE80;}
  .grade-Bplus, .grade-B, .grade-Bminus{color:#A3E635;}
  .grade-Cplus, .grade-C, .grade-Cminus{color:var(--gold);}
  .grade-trainer-name{font-weight:700;font-size:14px;margin-bottom:8px;}
  .recap-board{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .recap-corner{background:var(--panel);}
  .recap-col-head{
    background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;
    position:sticky;top:0;z-index:2;
  }
  .recap-col-head img, .recap-col-head .avatar-placeholder{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--ink-soft);}
  .recap-col-name{font-size:12px;font-weight:700;text-align:center;line-height:1.25;}
  .recap-round-label{
    background:var(--panel);padding:12px 10px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.06em;
    position:sticky;left:0;z-index:1;
  }
  .recap-cell{
    background:var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;
  }
  .recap-cell-empty{color:var(--cream-dim);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .recap-pick-no{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:0.04em;}
  .recap-sprite{width:48px;height:48px;object-fit:contain;margin:2px 0;}
  .recap-mon-name{font-size:12px;font-weight:700;line-height:1.2;}
  .recap-mon-tier{font-size:11px;color:var(--cream-dim);}
  .board-slot .pick-no{font-family:var(--mono);font-size:11px;color:var(--cream-dim);}
  .board-slot .pick-team{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;margin-top:4px;}
  .board-slot .pick-mon{margin-top:8px;font-size:12.5px;color:var(--cream-dim);}
  .board-slot.on-clock{background:rgba(255,203,5,0.09);position:relative;}
  .board-slot.on-clock::before{content:"ON THE CLOCK";position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:9px;color:var(--gold);animation:pulse 1.6s infinite;}
  .board-slot.upcoming{opacity:0.45;}

  /* layout */
  .draft-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;}
  @media (max-width:980px){.draft-layout{grid-template-columns:1fr;}}
  .rosters{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 220px);overflow-y:auto;position:sticky;top:80px;}
  @media (max-width:980px){.rosters{position:static;max-height:none;}}
  .trainer-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .trainer-card.active{border-color:var(--gold);background:rgba(255,203,5,0.07);}
  .trainer-card.full{opacity:0.55;}
  .trainer-head{display:flex;align-items:center;gap:10px;}
  .trainer-head img, .trainer-head .avatar-placeholder{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;}
  .trainer-head .t-name{font-family:var(--display);font-size:16px;text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .trainer-head .t-budget{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:nowrap;}
  .trainer-slots{font-family:var(--mono);font-size:10px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:0.06em;margin-top:6px;}
  .picks-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .picks-list li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--cream-dim);border-top:1px solid var(--line);padding-top:5px;}
  .picks-list li img{width:30px;height:30px;object-fit:contain;flex-shrink:0;}
  .picks-list .p-text{flex:1;display:flex;justify-content:space-between;gap:8px;}
  .picks-list .p-tier{font-family:var(--mono);color:var(--gold);}
  .picks-list .empty-slot{opacity:0.35;font-style:italic;}

  .pool-panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;}

  .queue-panel{margin:0 0 18px;padding:16px 18px;}
  .queue-panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .queue-panel-head h3{font-family:var(--display);text-transform:uppercase;font-size:16px;margin:0;letter-spacing:0.01em;}
  .queue-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
  .queue-empty{font-size:12.5px;color:var(--cream-dim);font-style:italic;padding:8px 0;}
  .queue-item{display:flex;align-items:center;gap:10px;background:var(--ink-soft);border:1px solid var(--line);border-radius:5px;padding:6px 10px;}
  .queue-item.taken{opacity:0.45;}
  .queue-item-num{font-family:var(--mono);font-weight:700;color:var(--gold);min-width:16px;font-size:12px;}
  .queue-item-sprite{width:28px;height:28px;object-fit:contain;flex-shrink:0;}
  .queue-item-name{flex:1;font-size:13px;font-weight:600;}
  .queue-item-arrows{display:flex;gap:4px;}
  .queue-item-arrows .btn{padding:3px 8px;font-size:10px;}
  .queue-star-btn{background:none;border:none;color:var(--gold);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
  .queue-star-btn:hover{transform:scale(1.15);}
  .queue-star-btn.active{color:var(--gold);}
  .pool-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .type-dropdown{position:relative;min-width:140px;}
  .type-dropdown-trigger{
    display:flex;align-items:center;width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:3px;font-family:var(--body);font-size:13px;cursor:pointer;text-align:left;min-height:34px;
  }
  .type-dropdown-trigger:hover{border-color:var(--gold);}
  .type-dropdown-menu{
    display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;max-height:280px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .type-dropdown-menu.show{display:block;}
  .type-dropdown-option{padding:6px 10px;cursor:pointer;font-size:13px;color:var(--cream);}
  .type-dropdown-option:hover{background:var(--ink-soft);}
  .pool-count{font-family:var(--mono);font-size:12px;color:var(--cream-dim);margin-left:auto;align-self:center;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(255,203,5,0.05);}
  tbody tr.drafted{opacity:0.3;}
  .tier-chip{font-family:var(--mono);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:4px;background:rgba(255,203,5,0.15);color:var(--gold);}
  .mon-name{font-weight:600;}
  .mon-var{font-family:var(--mono);font-size:11px;color:var(--teal-bright);margin-left:6px;}
  .sprite-cell{width:60px;}
  .sprite-img{display:block;width:52px;height:52px;object-fit:contain;}
  .type-badges{display:flex;gap:4px;flex-wrap:wrap;}
  .type-badge{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:3px;}
  .ability-pill{
    display:inline-block;font-size:11.5px;color:var(--cream-dim);background:var(--ink-soft);border:1px solid var(--line);
    border-radius:10px;padding:2px 8px;margin:2px 3px 2px 0;white-space:nowrap;
  }
  .ability-hidden{color:var(--gold);border-color:rgba(255,203,5,0.3);}
  .pool-scroll{max-height:640px;overflow-y:auto;}

  /* pick reveal */
  .pick-reveal{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;background:rgba(13,13,13,0.85);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .pick-reveal.show{opacity:1;pointer-events:auto;}
  .pick-reveal-inner{text-align:center;transform:scale(0.55);opacity:0;transition:transform .4s cubic-bezier(.2,1.6,.4,1), opacity .3s ease;}
  .pick-reveal.show .pick-reveal-inner{transform:scale(1);opacity:1;}
  .pr-trainer{font-family:var(--mono);font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);}
  .pr-sprite{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 0 36px rgba(255,203,5,0.5));}
  .pr-name{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(30px,6vw,52px);margin-top:6px;}
  .pr-types{display:flex;gap:8px;justify-content:center;margin-top:12px;}
  .pr-tier{font-family:var(--mono);font-size:14px;color:var(--gold);margin-top:12px;}

  .draft-complete{text-align:center;padding:48px 20px;}
  .draft-complete h2{font-size:36px;color:var(--gold);}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="nav-left-group">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      Pokemon VGC Draft League
    </a>
    <a href="champions.html" class="nav-former-champions">Past Champions</a>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="pool.html">Pool</a>
      <a href="format.html">Format</a>

      const el = document.getElementById(id);

    if(!currentUser || !league || !league.draft || !league.draft.trainers){
      ['subnavMatch','subnavTrades','subnavStanding','subnavAnnouncements'].forEach(id => glowTab(id, false));
      return;
    }
    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);
    glowTab('subnavTrades', tradesUnseen);

    const announcementsSeenAt = (me && me.announcementsSeenAt) || 0;
    const announcementsUnseen = (league.announcements || []).some(a => (a.timestamp || 0) > announcementsSeenAt);
    glowTab('subnavAnnouncements', announcementsUnseen);

    let matchToken = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ matchToken = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      matchToken = 'w' + idx;
    }
    const matchUnseen = matchToken !== null && matchToken !== (me && me.matchSeenToken);
    glowTab('subnavMatch', matchUnseen);

    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    const standingToken = resultCount > 0 ? String(resultCount) : null;

  function formatCountdown(targetTs){
    const diff = targetTs - Date.now();
    if(diff <= 0) return 'Starting any moment now';
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    if(days > 0) return days + 'd ' + hours + 'h ' + mins + 'm';
    if(hours > 0) return hours + 'h ' + mins + 'm ' + secs + 's';
    return mins + 'm ' + secs + 's';
  }

  function abilitiesHtml(monId){
    const list = ID_TO_ABILITIES[monId];
    if(!list || !list.length) return '<span style="color:var(--cream-dim);">—</span>';
    return list.map(a => '<span class="ability-pill' + (a.hidden ? ' ability-hidden' : '') + '">' + a.name + (a.hidden ? ' (H)' : '') + '</span>').join(' ');
  }

  function typeBadgesHtml(types){
    return (types||[]).map(t=>{
      const bg = TYPE_COLORS[t]||'#888'; const fg = textColorFor(bg);
      return '<span class="type-badge" style="background:'+bg+';color:'+fg+';">'+escapeHtml(t)+'</span>';
    }).join('');
  }

  function buildSnakeOrder(numTrainers, numSlots){
    const order = [];
    for(let round=0; round<numSlots; round++){
      const seq = [];
      for(let t=0;t<numTrainers;t++) seq.push(t);
      if(round % 2 === 1) seq.reverse();
      order.push(...seq);
    }
    return order;
  }
  function buildLinearOrder(numTrainers, numSlots){
    const order = [];
    for(let round=0; round<numSlots; round++){
      for(let t=0;t<numTrainers;t++) order.push(t);
    }
    return order;
  }

  function pickAutoMon(draftedIds, budget, remainingSlotsAfter){
    const reserve = Math.max(0, remainingSlotsAfter);
    let candidates = POOL.filter(p => !draftedIds[p.id] && p.tier <= Math.max(1, budget-reserve));
    if(candidates.length === 0) candidates = POOL.filter(p => !draftedIds[p.id] && p.tier <= budget);
    if(candidates.length === 0){
      candidates = POOL.filter(p => !draftedIds[p.id]).sort((a,b)=>a.tier-b.tier);
      return candidates[0] || null;
    }
    candidates.sort((a,b)=> b.tier-a.tier || a.name.localeCompare(b.name));
    return candidates[0];
  }

        });
        btnWrap.appendChild(upBtn);
        btnWrap.appendChild(downBtn);
        li.appendChild(btnWrap);
        listEl.appendChild(li);

  function initColorTypeDropdown(triggerId, menuId, hiddenId){
    const trigger = document.getElementById(triggerId);
    const menu = document.getElementById(menuId);
    const hidden = document.getElementById(hiddenId);
    menu.innerHTML = '';
    const allOpt = document.createElement('div');
    allOpt.className = 'type-dropdown-option';
    allOpt.textContent = 'All types';
    allOpt.addEventListener('click', () => selectType('all', 'All types', null));
    menu.appendChild(allOpt);
    Array.from(new Set(POOL.flatMap(p => p.types||[]))).sort().forEach(t => {
      const bg = TYPE_COLORS[t] || '#888'; const fg = textColorFor(bg);
      const opt = document.createElement('div');
      opt.className = 'type-dropdown-option';
      const label = t.charAt(0).toUpperCase() + t.slice(1);
      opt.innerHTML = '<span class="type-badge" style="background:' + bg + ';color:' + fg + ';">' + escapeHtml(label) + '</span>';
      opt.addEventListener('click', () => selectType(t, label, bg));
      menu.appendChild(opt);
    });
    function selectType(value, label, bg){
      hidden.value = value;
      trigger.innerHTML = bg ? '<span class="type-badge" style="background:' + bg + ';color:' + textColorFor(bg) + ';">' + escapeHtml(label) + '</span>' : label;
      menu.classList.remove('show');
      hidden.dispatchEvent(new Event('change'));
    }
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.type-dropdown-menu.show').forEach(m => { if(m !== menu) m.classList.remove('show'); });
      menu.classList.toggle('show');
    });
  }

  function renderBoard(d){
    const boardScroll = document.getElementById('boardScroll');
    boardScroll.innerHTML = '';
    d.pickOrder.forEach((tIdx, i) => {
      const round = Math.floor(i / d.trainers.length) + 1;
      const pickInRound = (i % d.trainers.length) + 1;
      const trainer = d.trainers[tIdx];
      const slot = document.createElement('div');
      slot.className = 'board-slot';
      const pickNo = document.createElement('div'); pickNo.className='pick-no';
      pickNo.textContent = 'PICK ' + round + '.' + String(pickInRound).padStart(2,'0');
      slot.appendChild(pickNo);
      const teamEl = document.createElement('div'); teamEl.className='pick-team'; teamEl.textContent = trainer.coachName || trainer.name;
      slot.appendChild(teamEl);
      const monEl = document.createElement('div'); monEl.className='pick-mon';
      if(i < d.history.length){
        const hist = d.history[i];
        const mon = POOL.find(p=>p.id===hist.monId);
        monEl.textContent = mon ? mon.name + (mon.variation ? ' '+mon.variation : '') : 'Selected';
      } else if(i === d.currentPick){
        slot.classList.add('on-clock'); monEl.textContent = 'Choosing…';
      } else {
        slot.classList.add('upcoming'); monEl.textContent = i === d.currentPick+1 ? 'On the clock next' : 'Upcoming';
      }
      slot.appendChild(monEl);
      boardScroll.appendChild(slot);
    });
    const activeSlot = boardScroll.children[Math.min(d.currentPick, d.pickOrder.length-1)];
    if(activeSlot) activeSlot.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function renderPool(d){
    const search = document.getElementById('searchBox').value.trim().toLowerCase();
    const abilitySearch = document.getElementById('abilitySearchBox').value.trim().toLowerCase();
    const tierVal = document.getElementById('tierFilter').value;
    const typeVal = document.getElementById('typeFilter').value;
    const sortMode = document.getElementById('sortMode').value;
    let list = POOL.filter(p=>{
      if(d.draftedIds[p.id]) return false;
      if(tierVal!=='all' && p.tier!==parseInt(tierVal,10)) return false;
      if(typeVal!=='all' && !(p.types||[]).includes(typeVal)) return false;
      if(search && !(p.name+' '+p.variation).toLowerCase().includes(search)) return false;
      if(abilitySearch){
        const abilities = ID_TO_ABILITIES[p.id] || [];
        if(!abilities.some(a => a.name.toLowerCase().includes(abilitySearch))) return false;
      }
      return true;
    });
    list.sort((a,b)=>{
      if(sortMode==='tierDesc') return b.tier-a.tier || a.name.localeCompare(b.name);
      if(sortMode==='tierAsc') return a.tier-b.tier || a.name.localeCompare(b.name);
      return a.name.localeCompare(b.name);
    });
    document.getElementById('poolCount').textContent = list.length + ' shown';
    const body = document.getElementById('poolBody'); body.innerHTML = '';

    const done = isDraftDone(d);
    const myTurn = !done && currentUser && d.trainers[currentTrainerIdx(d)].uid === currentUser.uid;
    const trainer = done ? null : d.trainers[currentTrainerIdx(d)];

    list.forEach(p=>{
      const tr = document.createElement('tr');
      const spriteCell = document.createElement('td'); spriteCell.className='sprite-cell';
      spriteCell.appendChild(makeSpriteImg(p,'sprite-img')); tr.appendChild(spriteCell);
      const nameCell = document.createElement('td');
      nameCell.innerHTML = '<span class="mon-name">'+escapeHtml(p.name)+'</span>'+(p.variation?'<span class="mon-var">'+escapeHtml(p.variation)+'</span>':'');
      tr.appendChild(nameCell);
      const typeCell = document.createElement('td'); typeCell.innerHTML='<div class="type-badges">'+typeBadgesHtml(p.types)+'</div>'; tr.appendChild(typeCell);
      const abilitiesCell = document.createElement('td'); abilitiesCell.innerHTML = abilitiesHtml(p.id); tr.appendChild(abilitiesCell);
      const tierCell = document.createElement('td'); tierCell.innerHTML='<span class="tier-chip">'+p.tier+'</span>'; tr.appendChild(tierCell);
      const actionCell = document.createElement('td');
      actionCell.style.display = 'flex'; actionCell.style.gap = '6px'; actionCell.style.alignItems = 'center';
      if(currentUser){
        const myQueue = (d.queues && d.queues[currentUser.uid]) || [];
        const inQueue = myQueue.includes(p.id);
        const qBtn = document.createElement('button');
        qBtn.type = 'button'; qBtn.className = 'queue-star-btn' + (inQueue ? ' active' : ''); qBtn.title = inQueue ? 'Remove from queue' : 'Add to queue';
        qBtn.textContent = inQueue ? '★' : '☆';
        qBtn.addEventListener('click', () => toggleQueue(p.id));
        actionCell.appendChild(qBtn);
      }
      if(!done){
        const btn = document.createElement('button'); btn.className='btn btn-primary btn-sm';
        const remainingSlotsAfter = d.numSlots - (trainer.roster.length + 1);
        const canAfford = trainer.budget >= p.tier;
        const leavesEnoughForRest = (trainer.budget - p.tier) >= remainingSlotsAfter;
        const hasSlot = trainer.roster.length < d.numSlots;
        if(myTurn && canAfford && hasSlot && !leavesEnoughForRest){
          btn.textContent = 'Would leave slots unfillable';
        } else {
          btn.textContent = myTurn ? 'Draft' : 'Not your turn';
        }
        btn.disabled = !(canAfford && hasSlot && myTurn && leavesEnoughForRest);
        btn.addEventListener('click', () => draftPick(d, p));
        actionCell.appendChild(btn);
      }
      tr.appendChild(actionCell);
      body.appendChild(tr);
    });
    renderQueue(d);
  }

  async function toggleQueue(monId){
    if(!currentUser) return;
    const queues = Object.assign({}, league.draft.queues || {});
    const mine = (queues[currentUser.uid] || []).slice();
    const idx = mine.indexOf(monId);
    if(idx > -1) mine.splice(idx, 1);
    else mine.push(monId);
    queues[currentUser.uid] = mine;
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { 'draft.queues': queues });
    }catch(err){ /* non-critical */ }
  }

  async function reorderQueue(monId, direction){
    if(!currentUser) return;
    const queues = Object.assign({}, league.draft.queues || {});
    const mine = (queues[currentUser.uid] || []).slice();
    const idx = mine.indexOf(monId);
    if(idx === -1) return;
    const swapWith = idx + direction;
    if(swapWith < 0 || swapWith >= mine.length) return;
    [mine[idx], mine[swapWith]] = [mine[swapWith], mine[idx]];
    queues[currentUser.uid] = mine;
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { 'draft.queues': queues });
    }catch(err){ /* non-critical */ }
  }

  function renderQueue(d){
    const listEl = document.getElementById('queueList');
    if(!listEl || !currentUser) return;
    const mine = (d.queues && d.queues[currentUser.uid]) || [];
    listEl.innerHTML = '';
    if(mine.length === 0){
      const li = document.createElement('li');
      li.className = 'queue-empty';
      li.textContent = 'Empty — click the ☆ next to any Pokémon in the pool to add it here.';
      listEl.appendChild(li);

    mine.forEach((monId, idx) => {
      const mon = POOL.find(p => p.id === monId);

      li.appendChild(num);
      li.appendChild(makeSpriteImg(mon, 'queue-item-sprite'));
      const info = document.createElement('span'); info.className = 'queue-item-name';
      info.textContent = mon.name + (taken ? ' (taken)' : '');
      li.appendChild(info);

      const upBtn = document.createElement('button'); upBtn.type='button'; upBtn.className='btn btn-sm'; upBtn.textContent='▲'; upBtn.disabled = idx===0;
      upBtn.addEventListener('click', () => reorderQueue(monId, -1));
      const downBtn = document.createElement('button'); downBtn.type='button'; downBtn.className='btn btn-sm'; downBtn.textContent='▼'; downBtn.disabled = idx===mine.length-1;
      downBtn.addEventListener('click', () => reorderQueue(monId, 1));
      const rmBtn = document.createElement('button'); rmBtn.type='button'; rmBtn.className='btn btn-sm btn-danger'; rmBtn.textContent='✕';
      rmBtn.addEventListener('click', () => toggleQueue(monId));
      arrows.appendChild(upBtn); arrows.appendChild(downBtn); arrows.appendChild(rmBtn);
      li.appendChild(arrows);
      listEl.appendChild(li);
    });

  async function draftPick(d, p){
    if(!currentUser) return;
    const tIdx = currentTrainerIdx(d);
    const trainer = d.trainers[tIdx];
    if(trainer.uid !== currentUser.uid) return;
    if(d.draftedIds[p.id]) return;
    if(trainer.budget < p.tier) return;
    if(trainer.roster.length >= d.numSlots) return;
    const remainingSlotsAfter = d.numSlots - (trainer.roster.length + 1);
    if((trainer.budget - p.tier) < remainingSlotsAfter){
      alert('You need to leave at least 1 point per remaining roster slot — this pick would leave you unable to fill your whole roster.');
      return;
    }

    const updated = JSON.parse(JSON.stringify(d));
    const t = updated.trainers[tIdx];
    t.roster.push(p); t.budget -= p.tier;
    updated.draftedIds[p.id] = { trainerIdx: tIdx, tier: p.tier };
    updated.history.push({ trainerIdx: tIdx, monId: p.id });
    updated.currentPick += 1;
    updated.pickStartedAt = Date.now();

    try{
      await updateDoc(doc(db, 'leagues', leagueId), { draft: updated });
    }catch(err){ alert('Could not save pick: ' + err.message); }
  }

  function pickFromQueue(d, uid, budget, remainingSlotsAfter){
    const queue = (d.queues && d.queues[uid]) || [];
    for(const monId of queue){
      if(d.draftedIds[monId]) continue;
      const mon = POOL.find(p => p.id === monId);
      if(mon && mon.tier <= budget && (budget - mon.tier) >= remainingSlotsAfter) return mon;
    }
    return null;
  }

  async function autoAdvance(d){
    const tIdx = currentTrainerIdx(d);
    const trainer = d.trainers[tIdx];
    const remainingAfter = d.numSlots - (trainer.roster.length + 1);
    const mon = pickFromQueue(d, trainer.uid, trainer.budget, remainingAfter) || pickAutoMon(d.draftedIds, trainer.budget, remainingAfter);

    const updated = JSON.parse(JSON.stringify(d));
    const t = updated.trainers[tIdx];
    if(mon){
      t.roster.push(mon); t.budget -= mon.tier;
      updated.draftedIds[mon.id] = { trainerIdx: tIdx, tier: mon.tier };
      updated.history.push({ trainerIdx: tIdx, monId: mon.id, auto: true });
      updated.currentPick += 1;
    }
    updated.pickStartedAt = Date.now();
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { draft: updated });
    }catch(err){ /* another client may already be handling this */ }
  }

  async function undoPick(d){
    if(d.history.length === 0) return;
    const updated = JSON.parse(JSON.stringify(d));
    const last = updated.history.pop();
    const trainer = updated.trainers[last.trainerIdx];
    const idx = trainer.roster.findIndex(m => m.id === last.monId);
    if(idx > -1){ const mon = trainer.roster.splice(idx,1)[0]; trainer.budget += mon.tier; }
    delete updated.draftedIds[last.monId];
    updated.currentPick -= 1;
    updated.pickStartedAt = Date.now();
    try{
      await updateDoc(doc(db, 'leagues', leagueId), { draft: updated });
    }catch(err){ alert('Could not undo: ' + err.message); }
  }

  function startTicker(d){
    if(pickTimerInterval) clearInterval(pickTimerInterval);
    pickTimerInterval = setInterval(() => tick(), 1000);
    tick();
    function tick(){
      const timerEl = document.getElementById('pickTimer');
      const nameEl = document.getElementById('onClockName');
      if(!timerEl || !nameEl) return;
      const trainer = d.trainers[currentTrainerIdx(d)];
      nameEl.textContent = trainer.name;
      const elapsed = Math.floor((Date.now() - d.pickStartedAt) / 1000);
      const remaining = Math.max(0, PICK_SECONDS - elapsed);
      timerEl.textContent = remaining + 's';
      timerEl.classList.toggle('urgent', remaining <= 10);
      if(remaining <= 0 && !pendingAutoPick){
        pendingAutoPick = true;
        autoAdvance(d).finally(() => { pendingAutoPick = false; });
      }
    }
  }

  const pickSound = new Audio('draft-pick.mp3');
  function showPickReveal(trainerName, mon, isAuto){
    if(!mon) return;
    document.getElementById('prTrainer').textContent = (isAuto ? 'Clock expired — auto-drafted for ' : '') + trainerName + (isAuto ? '' : ' selects');
    const sprite = document.getElementById('prSprite');
    const candidates = spriteCandidates(mon); let idx=0;
    sprite.src = candidates[0];
    sprite.onerror = () => { idx++; if(idx<candidates.length) sprite.src=candidates[idx]; else sprite.style.display='none'; };
    document.getElementById('prName').innerHTML = escapeHtml(mon.name) + (mon.variation ? ' <span style="color:var(--teal-bright);font-size:0.5em;">'+escapeHtml(mon.variation)+'</span>' : '');
    document.getElementById('prTypes').innerHTML = typeBadgesHtml(mon.types);
    document.getElementById('prTier').textContent = mon.tier + ' PTS';

  const TIER_AVG_SCORE = {"1": 37.54, "2": 35.03, "3": 39.46, "4": 37.67, "5": 40.86, "6": 40.07, "7": 41.07, "8": 45.97, "9": 40.54, "10": 42.37, "11": 44.63, "12": 42.17, "13": 47.79, "14": 45.37, "15": 45.87, "16": 46.58, "17": 46.97, "18": 52.06, "19": 41.01, "20": 53.7, "21": 34.4, "22": 59.1};
  function competitiveScoreFor(mon){
    return COMPETITIVE_SCORES[mon.id] != null ? COMPETITIVE_SCORES[mon.id] : (TIER_AVG_SCORE[mon.tier] || 40);
  }
  function expectedScoreForTier(tier){
    return TIER_AVG_SCORE[tier] != null ? TIER_AVG_SCORE[tier] : 40;
  }
  function computeDraftGrades(d){
    const results = d.trainers.map(trainer => {
      let totalDelta = 0;
      const picks = trainer.roster.map(mon => {
        const actual = competitiveScoreFor(mon);
        const expected = expectedScoreForTier(mon.tier);
        const delta = actual - expected;
        totalDelta += delta;
        return { mon, actual, expected, delta };
      });
      picks.sort((a, b) => b.delta - a.delta);
      return {
        trainer, avgDelta: picks.length ? totalDelta / picks.length : 0,
        biggestSteal: picks[0], biggestReach: picks[picks.length - 1]
      };
    });
    results.sort((a, b) => b.avgDelta - a.avgDelta);
    const n = results.length;
    const GRADE_LETTERS = ['A','A-','B+','B','B-','C+','C','C-'];
    results.forEach((r, i) => {
      const percentile = n > 1 ? 1 - (i / (n - 1)) : 1;
      const idx = Math.min(GRADE_LETTERS.length - 1, Math.floor((1 - percentile) * GRADE_LETTERS.length));
      r.grade = GRADE_LETTERS[idx];
    });
    return results;
  }

  function renderComplete(d){
    if(pickTimerInterval){ clearInterval(pickTimerInterval); pickTimerInterval=null; }
    const grades = computeDraftGrades(d);
    const gradeCardsHtml = grades.map(r => {
      return '<div class="grade-card">' +
        '<div class="grade-letter grade-' + r.grade.replace('+','plus').replace('-','minus') + '">' + r.grade + '</div>' +
        '<div class="grade-trainer-name">' + escapeHtml(r.trainer.coachName || r.trainer.name) + '</div>' +
      '</div>';
    }).join('');

    root.innerHTML =
      '<div class="page-head">' +
        '<span class="eyebrow">Draft Recap</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
        '<p style="color:var(--cream-dim);font-size:13.5px;margin-top:8px;">Every pick, in order — scroll to see the full board.</p>' +
      '</div>' +
      '<div class="panel">' +
        '<h2 style="margin-bottom:6px;">Draft Grades</h2>' +
        '<p class="settings-note" style="margin-bottom:16px;">Grades compare what each Pokémon actually costs in your pool against how it performs in real Regulation M-C tournament data — a strong Pokémon at a cheap tier is a steal, an underwhelming one at a high tier is a reach. Grades are curved against how everyone else in your league drafted.</p>' +
        '<div class="grade-cards-row">' + gradeCardsHtml + '</div>' +
      '</div>' +
      '<div class="recap-board-wrap"><div class="recap-board" id="recapBoard" style="grid-template-columns:88px repeat(' + d.trainers.length + ', 160px);"></div></div>';

    const board = document.getElementById('recapBoard');

    const cornerCell = document.createElement('div');
    cornerCell.className = 'recap-corner';
    board.appendChild(cornerCell);
    d.trainers.forEach(trainer => {
      const head = document.createElement('div');

      head.innerHTML = avatarHtml + '<span class="recap-col-name">' + escapeHtml(trainer.coachName || trainer.name) + '</span>';
      board.appendChild(head);
    });

    for(let round = 0; round < d.numSlots; round++){
      const roundLabel = document.createElement('div');
      roundLabel.className = 'recap-round-label';
      roundLabel.textContent = 'Round ' + (round + 1);
      board.appendChild(roundLabel);

      d.trainers.forEach((trainer, tIdx) => {
        const cell = document.createElement('div');
        cell.className = 'recap-cell';
        const mon = trainer.roster[round];
        if(mon){
          const overallPick = d.pickOrder.findIndex((idx, i) => idx === tIdx && Math.floor(i / d.trainers.length) === round);
          const pickLabel = document.createElement('div');
          pickLabel.className = 'recap-pick-no';
          pickLabel.textContent = 'Pick ' + (overallPick + 1);
          cell.appendChild(pickLabel);
          cell.appendChild(makeSpriteImg(mon, 'recap-sprite'));
          const nameEl = document.createElement('div');
          nameEl.className = 'recap-mon-name';
          nameEl.textContent = mon.name + (mon.variation ? ' ' + mon.variation : '');
          cell.appendChild(nameEl);
          const tierEl = document.createElement('div');
          tierEl.className = 'recap-mon-tier';
          tierEl.textContent = mon.tier + ' pts';
          cell.appendChild(tierEl);
        } else {
          cell.classList.add('recap-cell-empty');
          cell.textContent = '—';
        }
        board.appendChild(cell);
      });
    }
  }

  let lastHistoryLen = null;

  function handleSnapshot(data){
    league = data;
    const memberEntries = Object.entries(league.members || {});
    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const isMember = currentUser && league.members && league.members[currentUser.uid];

    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = isCommish ? '' : 'none';

    const subnavDraft = document.getElementById('subnavDraft');
    if(subnavDraft) subnavDraft.style.display = '';
    updateNavGlow(league);

    if(!isMember){
      root.innerHTML = '<div class="panel state-msg">You need to join this league before you can view its draft. <a href="signin.html" style="color:var(--gold);text-decoration:underline;">Join with a code</a></div>';
      return;
    }

    if(!league.draft){
      lastHistoryLen = null;
      renderSetup(memberEntries, isCommish);
      return;
    }

    const d = league.draft;
    if(lastHistoryLen !== null && d.history.length > lastHistoryLen){
      const last = d.history[d.history.length - 1];
      const trainer = d.trainers[last.trainerIdx];
      const mon = trainer.roster.find(m => m.id === last.monId) || trainer.roster[trainer.roster.length-1];
      showPickReveal(trainer.name, mon, !!last.auto);
    }
    lastHistoryLen = d.history.length;

    renderActive(d);
  }

  function generateJoinCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i = 0; i < 6; i++){ code += chars[Math.floor(Math.random() * chars.length)]; }
    return code;
  }

  const navLeaguesDefaultView = document.getElementById('navLeaguesDefaultView');
  const navJoinView = document.getElementById('navJoinView');
  const navShowJoinBtn = document.getElementById('navShowJoinBtn');
  const navJoinCodeInput = document.getElementById('navJoinCodeInput');
  const navJoinSubmitBtn = document.getElementById('navJoinSubmitBtn');
  const navJoinCancelBtn = document.getElementById('navJoinCancelBtn');
  const navJoinStatus = document.getElementById('navJoinStatus');
  let navCurrentUser = null;

  function showNavDefault(){
    navLeaguesDefaultView.style.display = 'block';
    navJoinView.style.display = 'none';
    navJoinStatus.textContent = '';
  }
  navShowJoinBtn.addEventListener('click', () => {
    navLeaguesDefaultView.style.display = 'none';
    navJoinView.style.display = 'block';
  });
  navJoinCancelBtn.addEventListener('click', showNavDefault);

  navJoinSubmitBtn.addEventListener('click', async () => {
    if(!navCurrentUser) return;
    const code = navJoinCodeInput.value.trim().toUpperCase();
    if(!code){ navJoinStatus.textContent = 'Enter a code.'; return; }
    navJoinSubmitBtn.disabled = true;
    try{
      const q = query(collection(db, 'leagues'), where('joinCode', '==', code));
      const snap = await getDocs(q);
      if(snap.empty){
        navJoinStatus.textContent = 'No league found with that code.';
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();
      const maxTeams = (leagueData.settings && leagueData.settings.maxTeams) || Infinity;
      const currentMemberCount = Object.keys(leagueData.members || {}).length;
      if(!leagueData.members || !leagueData.members[navCurrentUser.uid]){
        if(currentMemberCount >= maxTeams){
          navJoinStatus.textContent = 'This league is full (' + maxTeams + ' team limit).';
          navJoinSubmitBtn.disabled = false;
          return;
        }
      }
      await updateDoc(doc(db, 'leagues', leagueDoc.id), {
        ['members.' + navCurrentUser.uid]: {
          displayName: navCurrentUser.displayName || 'Trainer',
          photoURL: navCurrentUser.photoURL || '',
          joinedAt: Date.now()
        }
      });
      navJoinCodeInput.value = '';
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navJoinStatus.textContent = 'Error: ' + err.message;
    }
    navJoinSubmitBtn.disabled = false;
  });


  async function loadNavLeagues(user){
    try{
      const q = query(collection(db, 'leagues'), where('members.' + user.uid, '!=', null));
      const snap = await getDocs(q);
      navLeaguesList.innerHTML = '';
      if(snap.empty){ navLeaguesEmpty.style.display = 'block'; return; }
      navLeaguesEmpty.style.display = 'none';
      snap.forEach(docSnap => {
        const l = docSnap.data();
        const isCommish = l.commissionerUid === user.uid;
        const li = document.createElement('li');
        li.innerHTML = '<a href="league.html?id=' + docSnap.id + '"><span>' + escapeHtml(l.name || 'Untitled League') + '</span>' + (isCommish ? '<span class="nlm-commish">Commish</span>' : '') + '</a>';
        navLeaguesList.appendChild(li);
      });
    }catch(err){
      navLeaguesEmpty.style.display = 'block';
      navLeaguesEmpty.textContent = 'Could not load leagues.';
    }
  }

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if(user){
      navUserEmail.textContent = user.displayName || 'Trainer';
      navCurrentUser = user;
      loadNavLeagues(user);
    }
    if(!user){
      root.innerHTML = '<div class="panel state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    if(!leagueId){
      root.innerHTML = '<div class="panel state-msg">No league specified — open this page from your league dashboard.</div>';
      return;
    }
    onSnapshot(doc(db, 'leagues', leagueId), (snap) => {
      if(!snap.exists()){
        root.innerHTML = '<div class="panel state-msg">This league doesn\'t exist.</div>';
        return;
      }
      handleSnapshot(snap.data());
    }, (err) => {
      root.innerHTML = '<div class="panel state-msg">Could not load: ' + escapeHtml(err.message) + '</div>';
    });
  });

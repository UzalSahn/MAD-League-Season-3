<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — The MAD League</title>
<meta name="description" content="MAD League free agency, waivers, and roster moves.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}

  .fa-layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){.fa-layout{grid-template-columns:1fr;}}
  .fa-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .type-dropdown{position:relative;min-width:140px;}
  .type-dropdown-trigger{
    display:flex;align-items:center;width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:3px;font-family:var(--body);font-size:13px;cursor:pointer;text-align:left;min-height:34px;
  }
  .type-dropdown-trigger:hover{border-color:var(--gold);}
  .type-dropdown-menu{
    display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;max-height:280px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .type-dropdown-menu.show{display:block;}
  .type-dropdown-option{padding:6px 10px;cursor:pointer;font-size:13px;color:var(--cream);}
  .type-dropdown-option:hover{background:var(--ink-soft);}
  .fa-tab{
    background:var(--ink-soft);border:1px solid var(--line);color:var(--cream-dim);
    padding:9px 18px;border-radius:4px;font-family:var(--body);font-weight:600;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
  }
  .fa-tab.active{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .fa-tab-badge{
    background:#EE1515;color:#fff;font-family:var(--mono);font-size:10px;font-weight:700;
    min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .fa-tab.active .fa-tab-badge{background:var(--ink);color:var(--gold);}

  .fa-team-stats{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .fa-stat-label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);}
  .fa-stat-value{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--gold);margin-top:2px;}

  .fa-roster-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .fa-roster-list li{display:flex;align-items:center;gap:8px;font-size:13px;padding-top:8px;border-top:1px solid var(--line);}
  .fa-roster-list li:first-child{border-top:none;padding-top:0;}
  .fa-roster-list .mon-sprite{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
  .fa-roster-list .mon-info{flex:1;min-width:0;}
  .fa-roster-list .mon-name{font-weight:600;}
  .fa-roster-list .mon-var{font-family:var(--mono);font-size:10.5px;color:#FF5A5A;margin-left:4px;}
  .fa-roster-list .empty-roster{color:var(--cream-dim);font-style:italic;}

  .pool-controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .field-inline label{display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;}
  select, .pool-controls input{background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);padding:9px 11px;border-radius:3px;font-family:var(--body);font-size:13.5px;}
  select:focus, .pool-controls input:focus{border-color:var(--gold);}
  .pool-count{font-family:var(--mono);font-size:12px;color:var(--cream-dim);margin-left:auto;align-self:center;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:hover{background:rgba(255,203,5,0.05);}
  .tier-chip{font-family:var(--mono);font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:4px;background:rgba(255,203,5,0.15);color:var(--gold);}
  .mon-name{font-weight:600;}
  .mon-var{font-family:var(--mono);font-size:11px;color:#FF5A5A;margin-left:6px;}
  .sprite-cell{width:84px;}
  .sprite-img{display:block;width:72px;height:72px;object-fit:contain;}
  .type-badges{display:flex;gap:4px;flex-wrap:wrap;}
  .type-badge{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:3px;}
  .ability-pill{
    display:inline-block;font-size:11.5px;color:var(--cream-dim);background:var(--ink-soft);border:1px solid var(--line);
    border-radius:10px;padding:2px 8px;margin:2px 3px 2px 0;white-space:nowrap;
  }
  .ability-hidden{color:var(--gold);border-color:rgba(255,203,5,0.3);}
  .pool-scroll{max-height:560px;overflow-y:auto;}

  .trade-card{background:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px;}
  .trade-summary{font-size:13.5px;line-height:1.6;}
  .trade-mon-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .trade-mon-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--ink-soft);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px 3px 3px;font-size:12px;color:var(--cream-dim);
  }
  .trade-mon-chip-sprite{width:24px;height:24px;object-fit:contain;flex-shrink:0;}
  .waiver-time{font-family:var(--mono);font-size:11.5px;color:var(--gold);}
  .owned-by-tag{display:flex;align-items:center;gap:8px;}
  .owned-by-avatar, .owned-by-avatar-placeholder{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--slate,#333);flex-shrink:0;}
  .owned-by-label{font-size:12px;color:var(--cream-dim);font-weight:600;white-space:nowrap;}
  .trade-col-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);margin-bottom:10px;}
  .trade-pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
  .trade-pick-item{
    display:flex;align-items:center;gap:8px;font-size:13px;padding:8px;border:1px solid var(--line);
    border-radius:4px;cursor:pointer;background:var(--ink-soft);
  }
  .trade-pick-item:hover{border-color:var(--gold);}
  .trade-pick-item.picked{border-color:var(--gold);background:rgba(255,203,5,0.08);}
  .trade-pick-item .mon-sprite{width:26px;height:26px;object-fit:contain;flex-shrink:0;}
  .trade-pick-item .mon-info{flex:1;min-width:0;}
  .trade-columns{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .trade-col-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);margin-bottom:8px;}
  @media (max-width:600px){.trade-columns{grid-template-columns:1fr;}}
  .total-diff-row{font-family:var(--mono);font-size:13px;padding:10px 0;border-top:1px solid var(--line);}
  .accept-drop-wrap{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
  .waiver-drop-details summary{
    font-size:13px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;color:var(--cream);
  }
  .waiver-drop-details summary::-webkit-details-marker{display:none;}
  .waiver-drop-details summary::before{content:"▸";color:var(--gold);font-size:12px;transition:transform .15s ease;flex-shrink:0;}
  .waiver-drop-details[open] summary::before{transform:rotate(90deg);}
  .waiver-drop-summary-text{color:var(--gold);}
  .waiver-drop-details-body{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

  .matchup-modal{
    position:fixed;inset:0;z-index:500;background:rgba(13,13,13,0.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .matchup-modal.show{display:flex;}
  .matchup-modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;position:relative;
  }
  .matchup-modal-close{
    position:absolute;top:16px;right:20px;background:none;border:none;color:var(--cream-dim);
    font-size:24px;cursor:pointer;line-height:1;
  }
  .matchup-modal-close:hover{color:var(--gold);}
  .matchup-modal-title{text-align:center;font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:20px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:#EE1515;color:#FF8A8A;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .btn-sm{padding:7px 14px;font-size:11px;}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}
  .draft-cta p{color:var(--cream-dim);font-size:13.5px;max-width:420px;margin:0 auto 16px;}

  .profile-field{margin-bottom:16px;}
  .profile-field label{
    display:block;font-family:var(--mono);font-size:11px;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;
  }
  .profile-field input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 12px;border-radius:3px;font-family:var(--body);font-size:14px;
  }
  .profile-field input:focus{border-color:var(--gold);}
  .logo-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .logo-preview, .logo-placeholder{
    width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;border:2px solid var(--line);
  }
  .profile-status{font-size:13px;margin-top:10px;display:none;}

  .member-list .team-name{font-weight:700;font-size:15px;}
  .member-list .coach-line{font-size:12px;color:var(--cream-dim);margin-top:1px;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="nav-left-group">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#111" stroke-width="6"/>
        <path d="M6,50 A44,44 0 0,1 94,50 Z" fill="#EE1515" stroke="#111" stroke-width="6"/>
        <line x1="6" y1="50" x2="94" y2="50" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="15" fill="#fff" stroke="#111" stroke-width="7"/>
        <circle cx="50" cy="50" r="6" fill="#111"/>
      </svg>
      The MAD League
    </a>
    <a href="champions.html" class="nav-former-champions">Past Champions</a>
    </div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="pool.html">Pool</a>
      <a href="format.html">Format</a>
      <span id="navSignedOut"><a href="signin.html" class="nav-cta">Sign In</a></span>
      <span id="navSignedIn" class="nav-account" style="display:none;">
        <a href="league.html" class="btn btn-sm">League</a>
        <span id="navUserEmail"></span>
        <button id="navSignOutBtn" class="btn btn-sm">Sign Out</button>
      </span>
    </nav>
  </div>
</header>

<div class="league-subnav">
  <div class="league-subnav-inner">
    <a href="match.html" id="subnavMatch" class="subnav-tab">Match</a>
    <a href="team.html" id="subnavTeam" class="subnav-tab">Team</a>
    <a href="freeagency.html" id="subnavFA" class="subnav-tab active">Free Agency</a>
    <a href="trades.html" id="subnavTrades" class="subnav-tab">Trades</a>
    <a href="standing.html" id="subnavStanding" class="subnav-tab">Standing</a>
    <a href="announcements.html" id="subnavAnnouncements" class="subnav-tab">Announcements</a>
    <a href="draft.html" id="subnavDraft" class="subnav-tab">Draft Room</a>
    <a href="commissioner.html" id="subnavCommish" class="subnav-tab" style="display:none;">Commissioner</a>
  </div>
</div>

<main>
  <div id="content">
    <div class="state-msg" id="stateMsg">Loading league…</div>
  </div>
  <div class="matchup-modal" id="claimModal">
    <div class="matchup-modal-card" style="max-width:520px;">

  function typeBadgesHtml(types){
    return (types||[]).map(t=>{
      const bg = TYPE_COLORS[t]||'#888'; const fg = textColorFor(bg);

  const DEFAULT_SETTINGS = { faPickupsPerSeason: 2, waiverPeriodDays: 2, faMaxPerSwap: 2, faDeadlineWeek: 0 };

  function currentWeekNumber(league){
    if(!league.schedule) return null;
    const numWeeks = league.schedule.weeks.length;
    if(numWeeks <= 0) return null;
    const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
    const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), numWeeks - 1);
    return idx + 1;
  }
  function isPastFADeadline(league){
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    if(!settings.faDeadlineWeek || settings.faDeadlineWeek <= 0) return false;
    const week = currentWeekNumber(league);
    if(week === null) return false;
    return week > settings.faDeadlineWeek;
  }
  function isOneWeekFromFADeadline(league){
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    if(!settings.faDeadlineWeek || settings.faDeadlineWeek <= 0) return false;
    const week = currentWeekNumber(league);
    if(week === null) return false;
    return week === settings.faDeadlineWeek - 1;
  }
  async function maybeWarnFADeadline(league){
    if(!isOneWeekFromFADeadline(league)) return;
    const week = currentWeekNumber(league);
    if(league.faDeadlineWarnedWeek === week) return;
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const entry = { type: 'fa_deadline', message: 'Free agency deadline is next week (Week ' + settings.faDeadlineWeek + ') — this is the last week to make a claim.', mons: [], timestamp: Date.now() };
    try{
      await updateLeague({ announcements: appendValue(entry), faDeadlineWarnedWeek: week });
    }catch(err){ /* non-critical */ }
  }

  function getNextMondayMidnight(){
    const now = new Date();
    const day = now.getDay(); // 0=Sun,1=Mon,...6=Sat
    const daysAhead = day === 0 ? 1 : (8 - day);
    const next = new Date(now);
    next.setDate(now.getDate() + daysAhead);
    next.setHours(0,0,0,0);
    return next.getTime();
  }

  function pendingMoveId(){ return 'm' + Date.now() + Math.random().toString(36).slice(2,6); }

  function effectiveBudget(trainerUid, league){
    const t = league.draft.trainers.find(x => x.uid === trainerUid);
    if(!t) return 0;
    let budget = t.budget;
    (league.pendingMoves || []).forEach(m => {
      if(m.trainerUid !== trainerUid) return;
      if(m.type === 'fa_pickup'){
        budget -= m.mon.tier;
        if(m.conditionalDrop) budget += m.conditionalDrop.tier;
      } else if(m.type === 'fa_swap'){
        (m.claims || []).forEach(mon => { budget -= mon.tier; });
        (m.drops || []).forEach(mon => { budget += mon.tier; });
      }
    });
    return budget;
  }
  function effectiveRosterCount(trainerUid, league){
    const t = league.draft.trainers.find(x => x.uid === trainerUid);
    if(!t) return 0;
    let count = t.roster.length;
    (league.pendingMoves || []).forEach(m => {
      if(m.trainerUid !== trainerUid) return;
      if(m.type === 'fa_pickup'){
        count += 1;
        if(m.conditionalDrop) count -= 1;
      } else if(m.type === 'fa_swap'){
        count += (m.claims || []).length - (m.drops || []).length;
      }
    });
    return count;
  }

  let currentUser = null;
  function updateNavGlow(league){
    const glowTab = (id, active) => {
      const el = document.getElementById(id);
      if(el) el.classList.toggle('subnav-tab-glow', !!active);
    };
    if(!currentUser || !league || !league.draft || !league.draft.trainers){
      ['subnavMatch','subnavTrades','subnavStanding','subnavAnnouncements'].forEach(id => glowTab(id, false));
      return;
    }
    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);
    glowTab('subnavTrades', tradesUnseen);

    const announcementsSeenAt = (me && me.announcementsSeenAt) || 0;
    const announcementsUnseen = (league.announcements || []).some(a => (a.timestamp || 0) > announcementsSeenAt);
    glowTab('subnavAnnouncements', announcementsUnseen);

    let matchToken = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ matchToken = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      matchToken = 'w' + idx;
    }
    const matchUnseen = matchToken !== null && matchToken !== (me && me.matchSeenToken);
    glowTab('subnavMatch', matchUnseen);

    let resultCount = Object.keys((league.schedule && league.schedule.results) || {}).length;
    if(league.playoffBracket){
      league.playoffBracket.rounds.forEach(r => (r.matches || []).forEach(m => { if(m.locked) resultCount++; }));
    }
    const standingToken = resultCount > 0 ? String(resultCount) : null;
    const standingUnseen = standingToken !== null && standingToken !== (me && me.standingSeenToken);
    glowTab('subnavStanding', standingUnseen);
  }

  function initColorTypeDropdown(triggerId, menuId, hiddenId){
    const trigger = document.getElementById(triggerId);
    const menu = document.getElementById(menuId);
    const hidden = document.getElementById(hiddenId);
    if(!trigger || !menu || !hidden) return;
    menu.innerHTML = '';
    const allOpt = document.createElement('div');
    allOpt.className = 'type-dropdown-option';
    allOpt.textContent = 'All types';
    allOpt.addEventListener('click', () => selectType('all', 'All types', null));
    menu.appendChild(allOpt);
    Array.from(new Set(POOL.flatMap(p => p.types||[]))).sort().forEach(t => {
      const bg = TYPE_COLORS[t] || '#888'; const fg = textColorFor(bg);
      const opt = document.createElement('div');
      opt.className = 'type-dropdown-option';
      const label = t.charAt(0).toUpperCase() + t.slice(1);
      opt.innerHTML = '<span class="type-badge" style="background:' + bg + ';color:' + fg + ';">' + escapeHtml(label) + '</span>';
      opt.addEventListener('click', () => selectType(t, label, bg));
      menu.appendChild(opt);
    });
    function selectType(value, label, bg){
      hidden.value = value;
      trigger.innerHTML = bg ? '<span class="type-badge" style="background:' + bg + ';color:' + textColorFor(bg) + ';">' + escapeHtml(label) + '</span>' : label;
      menu.classList.remove('show');
      hidden.dispatchEvent(new Event('change'));
    }
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.type-dropdown-menu.show').forEach(m => { if(m !== menu) m.classList.remove('show'); });
      menu.classList.toggle('show');
    });
  }
  document.addEventListener('click', () => {
    document.querySelectorAll('.type-dropdown-menu.show').forEach(m => m.classList.remove('show'));
  });

  function populateFilters(){
    const tierSel = document.getElementById('faTierFilter');
    if(!tierSel || tierSel.options.length > 1) return;
    Array.from(new Set(POOL.map(p=>p.tier))).sort((a,b)=>b-a).forEach(t=>{
      const o=document.createElement('option'); o.value=t; o.textContent='Tier '+t; tierSel.appendChild(o);
    });
    initColorTypeDropdown('faTypeFilterTrigger', 'faTypeFilterMenu', 'faTypeFilter');
  }

  function renderFAPool(league, myIdx){
    const body = document.getElementById('faPoolBody');
    if(!body) return;
    const draftedIds = league.draft.draftedIds || {};
    const trainers = league.draft.trainers;
    const search = document.getElementById('faSearchBox').value.trim().toLowerCase();
    const abilitySearch = document.getElementById('faAbilitySearchBox').value.trim().toLowerCase();
    const tierVal = document.getElementById('faTierFilter').value;
    const typeVal = document.getElementById('faTypeFilter').value;
    const onWaiverIds = new Set((league.waivers || []).filter(w => Date.now() < w.expiresAt).map(w => w.monId));
    const pendingClaimedIds = new Set();
    (league.pendingMoves || []).forEach(m => {
      if(m.type === 'fa_pickup') pendingClaimedIds.add(m.mon.id);
      if(m.type === 'fa_swap') (m.claims||[]).forEach(c => pendingClaimedIds.add(c.id));
    });

    let list = POOL.filter(p => {
      if(onWaiverIds.has(p.id)) return false;
      if(pendingClaimedIds.has(p.id)) return false;
      if(tierVal!=='all' && p.tier!==parseInt(tierVal,10)) return false;
      if(typeVal!=='all' && !(p.types||[]).includes(typeVal)) return false;
      if(search && !(p.name+' '+p.variation).toLowerCase().includes(search)) return false;
      if(abilitySearch){
        const abilities = ID_TO_ABILITIES[p.id] || [];
        if(!abilities.some(a => a.name.toLowerCase().includes(abilitySearch))) return false;
      }
      return true;
    });
    list.sort((a,b) => b.tier - a.tier || a.name.localeCompare(b.name));
    const availableCount = list.filter(p => !draftedIds[p.id]).length;
    document.getElementById('faPoolCount').textContent = availableCount + ' available (' + list.length + ' shown)';

    const me = myIdx > -1 ? trainers[myIdx] : null;
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const numSlots = league.draft.numSlots;
    const pickupsUsed = me ? (me.faPickupsUsed || 0) : 0;
    const pickupsLeft = settings.faPickupsPerSeason - pickupsUsed;
    const myBudget = me ? effectiveBudget(me.uid, league) : 0;
    const myRosterCount = me ? effectiveRosterCount(me.uid, league) : 0;

    body.innerHTML = '';
    list.forEach(p => {
      const tr = document.createElement('tr');
      const spriteCell = document.createElement('td'); spriteCell.className='sprite-cell';
      spriteCell.appendChild(makeSpriteImg(p,'sprite-img')); tr.appendChild(spriteCell);
      const nameCell = document.createElement('td');
      nameCell.innerHTML = '<span class="mon-name">'+escapeHtml(p.name)+'</span>'+(p.variation?'<span class="mon-var">'+escapeHtml(p.variation)+'</span>':'');
      tr.appendChild(nameCell);
      const typeCell = document.createElement('td'); typeCell.innerHTML='<div class="type-badges">'+typeBadgesHtml(p.types)+'</div>'; tr.appendChild(typeCell);
      const abilitiesCell = document.createElement('td'); abilitiesCell.innerHTML = abilitiesHtml(p.id); tr.appendChild(abilitiesCell);
      const tierCell = document.createElement('td'); tierCell.innerHTML='<span class="tier-chip">'+p.tier+'</span>'; tr.appendChild(tierCell);
      const actionCell = document.createElement('td');
      const owner = draftedIds[p.id] ? trainers[draftedIds[p.id].trainerIdx] : null;
      if(owner){
        const ownedTag = document.createElement('div');
        ownedTag.className = 'owned-by-tag';
        if(owner.avatar){
          const img = document.createElement('img');
          img.className = 'owned-by-avatar'; img.src = owner.avatar; img.alt = '';
          ownedTag.appendChild(img);
        } else {
          const placeholder = document.createElement('span');
          placeholder.className = 'owned-by-avatar-placeholder';
          ownedTag.appendChild(placeholder);
        }
        const label = document.createElement('span');
        label.className = 'owned-by-label';
        label.textContent = owner.name;
        ownedTag.appendChild(label);
        actionCell.appendChild(ownedTag);
      } else {
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-sm';
        btn.textContent = 'Claim';
        if(league.seasonComplete){
          btn.disabled = true; btn.textContent = 'Season over';
        } else if(isPastFADeadline(league)){
          btn.disabled = true; btn.textContent = 'FA deadline passed';
        } else if(!me){
          btn.disabled = true; btn.textContent = 'Not on a team';
        } else if(pickupsLeft <= 0){
          btn.disabled = true; btn.textContent = 'No pickups left';
        } else {
          const maxDrops = settings.faMaxPerSwap || 1;
          const topDropTiers = me.roster.map(m => m.tier).sort((a,b) => b-a).slice(0, maxDrops);
          const bestPossibleDropRefund = topDropTiers.reduce((s,t) => s+t, 0);
          if(myBudget + bestPossibleDropRefund < p.tier){
            btn.disabled = true; btn.textContent = 'Still can\'t afford';
          } else {
            btn.addEventListener('click', () => pickUp(p));
          }
        }
        actionCell.appendChild(btn);
      }
      tr.appendChild(actionCell);
      body.appendChild(tr);
    });
  }

  function renderMyTeam(league, myIdx){
    const wrap = document.getElementById('myTeamWrap');
    if(!wrap) return;
    if(myIdx === -1){
      wrap.innerHTML = '<div class="state-msg">You joined after the draft, so you don\'t have a team to manage here.</div>';
      return;
    }
    const trainer = league.draft.trainers[myIdx];
    const settings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const pickupsUsed = trainer.faPickupsUsed || 0;
    const effBudget = effectiveBudget(trainer.uid, league);
    const effRoster = effectiveRosterCount(trainer.uid, league);
    const hasPending = effBudget !== trainer.budget;

    wrap.innerHTML =
      '<div class="fa-team-stats">' +

  async function pickUp(mon){
    if(currentLeague.seasonComplete || isPastFADeadline(currentLeague)) return;
    const trainers = currentLeague.draft.trainers;
    const myIdx = trainers.findIndex(t => t.uid === currentUser.uid);
    if(myIdx === -1) return;
    const me = trainers[myIdx];
    const settings = Object.assign({}, DEFAULT_SETTINGS, currentLeague.settings || {});
    const pickupsUsed = me.faPickupsUsed || 0;
    if(pickupsUsed >= settings.faPickupsPerSeason) return;
    if(currentLeague.draft.draftedIds[mon.id]) return;
    if((currentLeague.pendingMoves || []).some(m => (m.type === 'fa_pickup' && m.mon.id === mon.id) || (m.type === 'fa_swap' && (m.claims||[]).some(c => c.id === mon.id)))) return;

    const effBudget = effectiveBudget(me.uid, currentLeague);
    const effRoster = effectiveRosterCount(me.uid, currentLeague);
    const needsDrop = effRoster >= currentLeague.draft.numSlots || effBudget < mon.tier;

    if(!needsDrop){
      await submitSwap([mon], []);
    } else {
      openSwapModal(mon);
    }
  }

  async function submitSwap(claims, drops){
    const trainers = currentLeague.draft.trainers;
    const myIdx = trainers.findIndex(t => t.uid === currentUser.uid);
    if(myIdx === -1) return false;
    const me = trainers[myIdx];

    const tradeCommitted = tradeCommittedIds(currentLeague, me.uid);
    if(drops.some(d => tradeCommitted.includes(d.id))){
      alert('One of these Pokémon is already committed to a pending trade. Please refresh and try again.');
      return false;
    }

    const move = {
      id: pendingMoveId(), type: 'fa_swap',
      trainerUid: me.uid, trainerName: me.name,
      claims, drops, claimedAt: Date.now(), effectiveAt: getNextMondayMidnight()
    };
    const updatedPending = (currentLeague.pendingMoves || []).concat([move]);

    try{
      await updateLeague({ pendingMoves: updatedPending });
      return true;
    }catch(err){
      alert('Could not complete claim: ' + err.message);
      return false;
    }
  }

  function tradeCommittedIds(league, uid){
    const ids = [];
    (league.trades || []).filter(t => t.status === 'finalized_pending' && (t.proposerUid === uid || t.recipientUid === uid)).forEach(t => {
      if(t.proposerUid === uid){ t.offered.forEach(m => ids.push(m.id)); }
      if(t.recipientUid === uid){ t.requested.forEach(m => ids.push(m.id)); }
    });
    return ids;
  }

  function buildWaiverEntry(mon, droppedByUid, droppedByName, settings){
    return {
      monId: mon.id, mon,
      droppedByUid, droppedByName,
      expiresAt: Date.now() + settings.waiverPeriodDays * 86400000,
      claims: []
    };
  }

  function ensureWaiverPriority(league){
    if(league.waiverPriority && league.waiverPriority.length) return league.waiverPriority;
    return league.draft.trainers.map(t => t.uid);
  }

  async function resolveExpiredWaivers(league){
    const active = league.waivers || [];
    const expired = active.filter(w => Date.now() >= w.expiresAt);
    if(expired.length === 0) return;

    const remaining = active.filter(w => Date.now() < w.expiresAt);
    let priority = ensureWaiverPriority(league).slice();
    const newPending = (league.pendingMoves || []).slice();

    expired.forEach(w => {
      if(w.claims && w.claims.length){
        const winnerUid = priority.find(uid => w.claims.some(c => c.uid === uid)) || w.claims[0].uid;
        const winnerClaim = w.claims.find(c => c.uid === winnerUid);
        const winner = league.draft.trainers.find(t => t.uid === winnerUid);
        const dropIds = (winnerClaim && winnerClaim.dropMonIds) || [];
        const dropMons = winner ? (winner.roster || []).filter(m => dropIds.includes(m.id)) : [];
        const dropRefund = dropMons.reduce((s,m)=>s+m.tier,0);
        const effBudget = effectiveBudget(winnerUid, league) + dropRefund;
        const effRoster = effectiveRosterCount(winnerUid, league) - dropMons.length;
        if(winner && effBudget >= w.mon.tier && effRoster < league.draft.numSlots){
          newPending.push({
            id: pendingMoveId(), type: 'fa_swap',
            trainerUid: winnerUid, trainerName: winner.name,
            claims: [w.mon], drops: dropMons, claimedAt: Date.now(), effectiveAt: getNextMondayMidnight()
          });
          priority = priority.filter(uid => uid !== winnerUid).concat([winnerUid]);
        } else {
          pushAnnouncementPlain(league, 'pickup', w.mon.name + ' cleared waivers unclaimed (winning team couldn\'t afford it or was full)', [w.mon]);
        }
      } else {
        pushAnnouncementPlain(league, 'pickup', w.mon.name + ' cleared waivers and is now a free agent', [w.mon]);
      }
    });

    try{
      await updateLeague({
        waivers: remaining,
        waiverPriority: priority,
        pendingMoves: newPending
      });
    }catch(err){ /* another client may already be resolving this */ }
  }

  function pushAnnouncementPlain(league, type, message, mons, droppedIds){
    const entry = { type, message, mons: mons || [], droppedIds: droppedIds || [], timestamp: Date.now() };
    updateLeague({ announcements: appendValue(entry) }).catch(() => {});
  }

  async function claimWaiver(waiverEntry, dropMonIds){
    if(currentLeague.seasonComplete || isPastFADeadline(currentLeague)) return;
    const trainers = currentLeague.draft.trainers;
    const myIdx = trainers.findIndex(t => t.uid === currentUser.uid);
    if(myIdx === -1) return;
    const me = trainers[myIdx];
    const tradeCommitted = tradeCommittedIds(currentLeague, me.uid);
    if((dropMonIds || []).some(id => tradeCommitted.includes(id))){
      alert('One of these Pokémon is already committed to a pending trade. Please refresh and try again.');
      return;
    }
    const waivers = (currentLeague.waivers || []).map(w => {
      if(w.monId !== waiverEntry.monId) return w;
      const claims = (w.claims || []).filter(c => c.uid !== me.uid);
      claims.push({ uid: me.uid, name: me.name, dropMonIds: dropMonIds || [] });
      return Object.assign({}, w, { claims });
    });
    try{
      await updateLeague({ waivers });
    }catch(err){ alert('Could not place claim: ' + err.message); }
  }

  async function withdrawClaim(waiverEntry){

      if(w.monId !== waiverEntry.monId) return w;
      return Object.assign({}, w, { claims: (w.claims || []).filter(c => c.uid !== currentUser.uid) });

  async function resolvePendingMoves(league){
    const pending = league.pendingMoves || [];
    const due = pending.filter(m => Date.now() >= m.effectiveAt);
    if(due.length === 0) return;
    const remaining = pending.filter(m => Date.now() < m.effectiveAt);

    const updatedDraft = JSON.parse(JSON.stringify(league.draft));
    const newWaivers = [];
    const newLogs = [];
    const settingsForWaivers = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    due.forEach(m => {
      if(m.type === 'fa_pickup'){
        const idx = updatedDraft.trainers.findIndex(t => t.uid === m.trainerUid);
        if(idx === -1) return;
        if(updatedDraft.draftedIds[m.mon.id]) return; // safety: already taken somehow
        const t = updatedDraft.trainers[idx];
        t.roster.push(m.mon);
        t.budget -= m.mon.tier;
        t.faPickupsUsed = (t.faPickupsUsed || 0) + 1;
        updatedDraft.draftedIds[m.mon.id] = { trainerIdx: idx, tier: m.mon.tier };
        if(m.conditionalDrop){
          if(t.roster.some(x => x.id === m.conditionalDrop.id)){
            t.roster = t.roster.filter(x => x.id !== m.conditionalDrop.id);
            t.budget += m.conditionalDrop.tier;
            delete updatedDraft.draftedIds[m.conditionalDrop.id];
            if(settingsForWaivers.waiverPeriodDays > 0){
              newWaivers.push(buildWaiverEntry(m.conditionalDrop, m.trainerUid, m.trainerName, settingsForWaivers));
            }
          }
        }
        newLogs.push({ id: pendingMoveId(), type: 'fa_swap', timestamp: Date.now(), reversed: false,
          trainerUid: m.trainerUid, trainerName: m.trainerName, claims: [m.mon], drops: m.conditionalDrop ? [m.conditionalDrop] : [] });
        pushAnnouncementPlain(league, 'pickup', m.trainerName + ' officially added ' + m.mon.name + ' to the roster' + (m.conditionalDrop ? ' and dropped ' + m.conditionalDrop.name : ''), m.conditionalDrop ? [m.mon, m.conditionalDrop] : [m.mon], m.conditionalDrop ? [m.conditionalDrop.id] : []);
        sendDiscordFATrade('📥 **' + m.trainerName + '** officially added **' + m.mon.name + '** to their roster' + (m.conditionalDrop ? ' and dropped **' + m.conditionalDrop.name + '**' : '') + '.', discordTrainerMonEmbeds(updatedDraft.trainers.find(t => t.uid === m.trainerUid), m.conditionalDrop ? [m.mon, m.conditionalDrop] : [m.mon]));
      } else if(m.type === 'fa_swap'){
        const idx = updatedDraft.trainers.findIndex(t => t.uid === m.trainerUid);
        if(idx === -1) return;
        const t = updatedDraft.trainers[idx];
        const claims = (m.claims || []).filter(c => !updatedDraft.draftedIds[c.id]); // safety: skip any already taken
        const drops = (m.drops || []).filter(d => t.roster.some(x => x.id === d.id));
        claims.forEach(mon => {
          t.roster.push(mon);
          t.budget -= mon.tier;
          updatedDraft.draftedIds[mon.id] = { trainerIdx: idx, tier: mon.tier };
        });
        if(claims.length > 0){
          t.faPickupsUsed = (t.faPickupsUsed || 0) + 1; // one whole transaction, regardless of how many Pokémon it claimed
        }
        const dropIds = drops.map(d => d.id);
        t.roster = t.roster.filter(x => !dropIds.includes(x.id));
        drops.forEach(mon => {
          t.budget += mon.tier;
          delete updatedDraft.draftedIds[mon.id];
          if(settingsForWaivers.waiverPeriodDays > 0){
            newWaivers.push(buildWaiverEntry(mon, m.trainerUid, m.trainerName, settingsForWaivers));
          }
        });
        newLogs.push({ id: pendingMoveId(), type: 'fa_swap', timestamp: Date.now(), reversed: false,
          trainerUid: m.trainerUid, trainerName: m.trainerName, claims, drops });
        const claimNames = claims.map(c => c.name).join(', ') || 'nothing (already claimed elsewhere)';
        const dropNote = drops.length ? (' and dropped ' + drops.map(d => d.name).join(', ')) : '';
        pushAnnouncementPlain(league, 'pickup', m.trainerName + ' officially added ' + claimNames + ' to the roster' + dropNote, claims.concat(drops), dropIds);
        sendDiscordFATrade('📥 **' + m.trainerName + '** officially added **' + claimNames + '** to their roster' + (dropNote ? ' and dropped **' + drops.map(d=>d.name).join(', ') + '**' : '') + '.', discordTrainerMonEmbeds(t, claims.concat(drops)));
      } else if(m.type === 'trade'){
        const pIdx = updatedDraft.trainers.findIndex(t => t.uid === m.proposerUid);
        const rIdx = updatedDraft.trainers.findIndex(t => t.uid === m.recipientUid);
        if(pIdx === -1 || rIdx === -1) return;
        const proposer = updatedDraft.trainers[pIdx];
        const recipient = updatedDraft.trainers[rIdx];
        const offeredIds = m.offered.map(x => x.id);
        const requestedIds = m.requested.map(x => x.id);
        const proposerHasAll = offeredIds.every(id => proposer.roster.some(x => x.id === id));
        const recipientHasAll = requestedIds.every(id => recipient.roster.some(x => x.id === id));
        if(!proposerHasAll || !recipientHasAll){
          pushAnnouncementPlain(league, 'trade', 'A pending trade between ' + m.proposerName + ' and ' + m.recipientName + ' could not be completed — a Pokémon involved was already moved.');
          return;
        }
        proposer.roster = proposer.roster.filter(x => !offeredIds.includes(x.id)).concat(m.requested);
        recipient.roster = recipient.roster.filter(x => !requestedIds.includes(x.id)).concat(m.offered);
        proposer.budget += m.offered.reduce((s,x)=>s+x.tier,0) - m.requested.reduce((s,x)=>s+x.tier,0);
        recipient.budget += m.requested.reduce((s,x)=>s+x.tier,0) - m.offered.reduce((s,x)=>s+x.tier,0);
        proposer.tradesUsed = (proposer.tradesUsed || 0) + 1;
        recipient.tradesUsed = (recipient.tradesUsed || 0) + 1;
        offeredIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: rIdx, tier: m.offered.find(x=>x.id===id).tier }; });
        requestedIds.forEach(id => { updatedDraft.draftedIds[id] = { trainerIdx: pIdx, tier: m.requested.find(x=>x.id===id).tier }; });
        newLogs.push({ id: pendingMoveId(), type: 'trade', timestamp: Date.now(), reversed: false,
          proposerUid: m.proposerUid, proposerName: m.proposerName, recipientUid: m.recipientUid, recipientName: m.recipientName,
          offered: m.offered, requested: m.requested });
        pushAnnouncementPlain(league, 'trade', 'The trade between ' + m.proposerName + ' and ' + m.recipientName + ' is now official', m.offered.concat(m.requested));
        sendDiscordFATrade('🔄 Trade complete: **' + m.proposerName + '** sent ' + m.offered.map(x=>x.name).join(', ') + ' to **' + m.recipientName + '** for ' + m.requested.map(x=>x.name).join(', ') + '.', discordTrainerMonEmbeds(proposer, m.offered).concat(discordTrainerMonEmbeds(recipient, m.requested)));
      }
    });

    try{
      await updateLeague({ draft: updatedDraft, pendingMoves: remaining, waivers: (league.waivers || []).concat(newWaivers), transactionLog: (league.transactionLog || []).concat(newLogs) });
    }catch(err){ /* another client may already be resolving this */ }
  }

  function tradeMonChipHtml(mon){
    const src = (spriteCandidates(mon)[0]) || PLACEHOLDER_SPRITE;
    return '<span class="trade-mon-chip"><img class="trade-mon-chip-sprite" src="' + escapeHtml(src) + '" alt="" loading="lazy">' +
      escapeHtml(mon.name) + (mon.variation ? ' (' + escapeHtml(mon.variation) + ')' : '') + ' [' + mon.tier + ']</span>';
  }

  function renderMyPendingMoves(league, myIdx){
    const section = document.getElementById('pendingMovesSection');
    const wrap = document.getElementById('pendingMovesWrap');
    if(!section || !wrap) return;
    const me = myIdx > -1 ? league.draft.trainers[myIdx] : null;
    const mine = me ? (league.pendingMoves || []).filter(m => (m.type === 'fa_pickup' || m.type === 'fa_swap') && m.trainerUid === me.uid) : [];
    if(mine.length === 0){
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    wrap.innerHTML = '';
    mine.forEach(m => {
      const card = document.createElement('div');
      card.className = 'trade-card';
      const effectiveDate = new Date(m.effectiveAt).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      if(m.type === 'fa_pickup'){
        card.innerHTML =
          '<div class="trade-summary"><div class="trade-mon-chip-row">' + tradeMonChipHtml(m.mon) + '</div>— takes effect ' + effectiveDate + '</div>' +
          (m.conditionalDrop ? '<div class="waiver-time" style="margin-top:6px;">Also dropping</div><div class="trade-mon-chip-row">' + tradeMonChipHtml(m.conditionalDrop) + '</div>' : '');
      } else {
        const claimChips = (m.claims||[]).map(tradeMonChipHtml).join('') || 'nothing';
        const dropChips = (m.drops||[]).map(tradeMonChipHtml).join('');
        card.innerHTML =
          '<div class="trade-summary">Claiming — takes effect ' + effectiveDate + '</div><div class="trade-mon-chip-row">' + claimChips + '</div>' +
          (dropChips ? '<div class="waiver-time">Dropping (goes to waivers)</div><div class="trade-mon-chip-row">' + dropChips + '</div>' : '');
      }
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-sm btn-danger';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.style.marginTop = '10px';
      cancelBtn.addEventListener('click', () => cancelPendingMove(m));
      card.appendChild(cancelBtn);
      wrap.appendChild(card);
    });
  }

  let waiverDropSelections = {};

  function renderWaivers(league, myIdx){
    const wrap = document.getElementById('waiversWrap');
    if(!wrap) return;
    const faSettings = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});
    const active = (league.waivers || []).filter(w => Date.now() < w.expiresAt);
    const badge = document.getElementById('waiversBadge');
    if(badge){
      if(active.length > 0){ badge.textContent = active.length; badge.style.display = ''; }
      else { badge.style.display = 'none'; }
    }
    if(active.length === 0){
      wrap.innerHTML = '<p class="settings-note">Nothing on waivers right now.</p>';
      return;
    }
    const me = myIdx > -1 ? league.draft.trainers[myIdx] : null;

    wrap.innerHTML = '<div class="pool-scroll"><table><thead><tr><th></th><th>Pokémon</th><th>Type</th><th>Tier</th><th>Clears In</th><th></th></tr></thead><tbody id="waiversTableBody"></tbody></table></div>';
    const body = document.getElementById('waiversTableBody');

    active.forEach(w => {
      const hoursLeft = Math.max(0, Math.round((w.expiresAt - Date.now()) / 3600000));
      const myClaim = me && (w.claims || []).find(c => c.uid === me.uid);

      const tr = document.createElement('tr');
      const spriteCell = document.createElement('td'); spriteCell.className = 'sprite-cell';
      spriteCell.appendChild(makeSpriteImg(w.mon, 'sprite-img')); tr.appendChild(spriteCell);
      const nameCell = document.createElement('td');
      nameCell.innerHTML = '<span class="mon-name">' + escapeHtml(w.mon.name) + '</span>' + (w.mon.variation ? '<span class="mon-var">' + escapeHtml(w.mon.variation) + '</span>' : '');
      tr.appendChild(nameCell);
      const typeCell = document.createElement('td'); typeCell.innerHTML = '<div class="type-badges">' + typeBadgesHtml(w.mon.types) + '</div>'; tr.appendChild(typeCell);
      const tierCell = document.createElement('td'); tierCell.innerHTML = '<span class="tier-chip">' + w.mon.tier + '</span>'; tr.appendChild(tierCell);
      const clearsCell = document.createElement('td');
      clearsCell.innerHTML = '~' + hoursLeft + 'h' + ((w.claims||[]).length ? '<br><span class="waiver-time" style="font-size:10px;">' + w.claims.length + ' claim(s)</span>' : '');
      tr.appendChild(clearsCell);
      const actionCell = document.createElement('td');
      tr.appendChild(actionCell);
      body.appendChild(tr);

      if(!me){ return; }

      if(myClaim){
        const btn = document.createElement('button');
        btn.className = 'btn btn-sm btn-danger';
        btn.textContent = 'Withdraw';
        btn.addEventListener('click', () => withdrawClaim(w));
        actionCell.appendChild(btn);
        return;
      }

      if(isPastFADeadline(league)){
        const disabledBtn = document.createElement('button');
        disabledBtn.className = 'btn btn-sm';
        disabledBtn.disabled = true;
        disabledBtn.textContent = 'FA deadline passed';
        actionCell.appendChild(disabledBtn);
        return;
      }

      const effBudget = effectiveBudget(me.uid, league);
      const effRoster = effectiveRosterCount(me.uid, league);
      const needsDrop = effRoster >= league.draft.numSlots || effBudget < w.mon.tier;

      if(!needsDrop){
        const claimBtn = document.createElement('button');
        claimBtn.className = 'btn btn-primary btn-sm';
        claimBtn.textContent = 'Place Claim';
        claimBtn.addEventListener('click', () => claimWaiver(w, []));
        actionCell.appendChild(claimBtn);
        return;
      }

      // needs a companion drop — render an expanded sub-row below with the picker
      waiverDropSelections[w.monId] = waiverDropSelections[w.monId] || [];
      const subTr = document.createElement('tr');
      const subTd = document.createElement('td');
      subTd.colSpan = 6;
      const dropWrap = document.createElement('div');
      dropWrap.className = 'accept-drop-wrap';
      const reason = effRoster >= league.draft.numSlots ? 'Your roster is full' : 'You can\'t afford this yet';
      dropWrap.innerHTML =
        '<details class="waiver-drop-details">' +
          '<summary>' + reason + ' — <span class="waiver-drop-summary-text">pick Pokémon to drop</span></summary>' +
          '<div class="waiver-drop-details-body">' +
            '<ul class="trade-pick-list" id="waiverDropList-' + w.monId + '"></ul>' +
            '<div class="total-diff-row" id="waiverDropSummary-' + w.monId + '" style="text-align:left;"></div>' +
          '</div>' +
        '</details>';
      subTd.appendChild(dropWrap);
      subTr.appendChild(subTd);
      body.appendChild(subTr);

      function renderDropList(){
        const listEl = dropWrap.querySelector('.trade-pick-list');
        listEl.innerHTML = '';
        const tradeCommitted = tradeCommittedIds(league, me.uid);
        me.roster.filter(mon => !tradeCommitted.includes(mon.id)).forEach(mon => {
          const li = document.createElement('li');
          const checked = waiverDropSelections[w.monId].includes(mon.id);
          li.className = 'trade-pick-item' + (checked ? ' picked' : '');
          li.appendChild(makeSpriteImg(mon, 'mon-sprite'));
          const info = document.createElement('span');
          info.className = 'mon-info';
          info.textContent = mon.name;
          li.appendChild(info);
          const tier = document.createElement('span');
          tier.className = 'tier-chip';
          tier.textContent = mon.tier;
          li.appendChild(tier);
          li.addEventListener('click', () => {
            if(checked) waiverDropSelections[w.monId] = waiverDropSelections[w.monId].filter(id => id !== mon.id);
            else { if(waiverDropSelections[w.monId].length >= faSettings.faMaxPerSwap) return; waiverDropSelections[w.monId].push(mon.id); }
            renderDropList();
            updateClaimBtn();
          });
          listEl.appendChild(li);
        });
      }
      renderDropList();

      const claimBtn = document.createElement('button');
      claimBtn.className = 'btn btn-primary btn-sm';
      claimBtn.textContent = 'Place Claim';
      claimBtn.disabled = true;
      claimBtn.style.marginTop = '10px';
      function updateClaimBtn(){
        const dropIds = waiverDropSelections[w.monId];
        const dropMons = me.roster.filter(m => dropIds.includes(m.id));
        const dropRefund = dropMons.reduce((s,m)=>s+m.tier,0);
        const finalRoster = effRoster + 1 - dropMons.length;
        const finalBudget = effBudget + dropRefund;
        const rosterOk = finalRoster === league.draft.numSlots;
        const wouldAfford = finalBudget >= w.mon.tier;
        const summaryEl = dropWrap.querySelector('.total-diff-row');
        if(summaryEl) summaryEl.textContent = dropMons.length ? ('After dropping: ' + finalBudget + ' pts, ' + finalRoster + '/' + league.draft.numSlots + ' roster' + (!rosterOk ? ' — needs to equal ' + league.draft.numSlots : '')) : '';
        const summaryTextEl = dropWrap.querySelector('.waiver-drop-summary-text');
        if(summaryTextEl){
          summaryTextEl.textContent = dropMons.length
            ? dropMons.length + ' selected: ' + dropMons.map(m => m.name).join(', ')
            : 'pick Pokémon to drop';
        }
        claimBtn.disabled = !(dropMons.length > 0 && rosterOk && wouldAfford);
      }
      updateClaimBtn();
      claimBtn.addEventListener('click', () => claimWaiver(w, waiverDropSelections[w.monId]));
      dropWrap.appendChild(claimBtn);
    });
  }

  function render(league){
    currentLeague = league;
    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = isCommish ? '' : 'none';
    const subnavDraft = document.getElementById('subnavDraft');
    if(subnavDraft) subnavDraft.style.display = '';
    updateNavGlow(league);

    if(!league.draft){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Free Agency</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        '<div class="panel state-msg">Free agency will be here when draft is done.</div>';
      return;
    }

    const myIdx = currentUser ? league.draft.trainers.findIndex(t => t.uid === currentUser.uid) : -1;
    const pastFADeadline = isPastFADeadline(league);
    const nearFADeadline = isOneWeekFromFADeadline(league);
    const faSettingsForBanner = Object.assign({}, DEFAULT_SETTINGS, league.settings || {});

    content.innerHTML =
      '<div class="page-head">' +
        '<span class="eyebrow">Free Agency</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
        '<p style="color:var(--cream-dim);font-size:13.5px;margin-top:10px;">Pickups can be grabbed from whatever budget you have left after the draft. Dropping a Pokémon sends it to waivers before it\'s free for anyone to grab. Claims lock in but don\'t hit your roster until the following Monday, so opponents have a fair week to prep.' + (faSettingsForBanner.faDeadlineWeek > 0 ? ' Free agency closes after Week ' + faSettingsForBanner.faDeadlineWeek + '.' : '') + '</p>' +
      '</div>' +
      (nearFADeadline && !league.seasonComplete
        ? '<div class="panel state-msg" style="border-color:rgba(255,203,5,0.4);color:var(--gold);">⏰ Free agency deadline is next week (Week ' + faSettingsForBanner.faDeadlineWeek + ') — this is your last week to make a claim.</div>'
        : ''
      ) +
      (league.seasonComplete
        ? '<div class="panel state-msg" style="border-color:rgba(255,203,5,0.4);color:var(--gold);">🏆 The season is complete — Free Agency is closed. Rosters are locked in as final.</div>'
        : (pastFADeadline
          ? '<div class="panel state-msg" style="border-color:rgba(238,21,21,0.4);">The free agency deadline (Week ' + faSettingsForBanner.faDeadlineWeek + ') has passed — no new claims can be made this season.</div>'
          : '')
      ) +
      '<div class="panel" id="pendingMovesSection" style="display:none;"><h2>Your Pending Moves</h2><div id="pendingMovesWrap"></div></div>' +
      '<div class="fa-tabs">' +
        '<button class="fa-tab active" id="tabFreeAgents" type="button">Free Agents</button>' +
        '<button class="fa-tab" id="tabWaivers" type="button">On Waivers<span class="fa-tab-badge" id="waiversBadge" style="display:none;"></span></button>' +
      '</div>' +
      '<div id="freeAgentsView">' +
        '<div class="fa-layout">' +
          '<div class="panel" id="myTeamWrap"></div>' +
          '<div class="panel">' +
            '<div class="pool-controls">' +
              '<div class="field-inline"><label>Search</label><input type="text" id="faSearchBox" placeholder="Pokémon name…"></div>' +
              '<div class="field-inline"><label>Ability</label><input type="text" id="faAbilitySearchBox" placeholder="e.g. intimidate…"></div>' +
              '<div class="field-inline"><label>Tier</label><select id="faTierFilter"><option value="all">All tiers</option></select></div>' +
              '<div class="field-inline">' +
              '<label>Type</label>' +
              '<div class="type-dropdown" id="faTypeFilterDropdown">' +
                '<button type="button" class="type-dropdown-trigger" id="faTypeFilterTrigger">All types</button>' +
                '<div class="type-dropdown-menu" id="faTypeFilterMenu"></div>' +
              '</div>' +
              '<input type="hidden" id="faTypeFilter" value="all">' +
            '</div>' +
              '<span class="pool-count" id="faPoolCount"></span>' +
            '</div>' +
            '<div class="pool-scroll"><table><thead><tr><th></th><th>Pokémon</th><th>Type</th><th>Abilities</th><th>Tier</th><th></th></tr></thead><tbody id="faPoolBody"></tbody></table></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="waiversView" style="display:none;">' +
        '<div class="panel"><h2>On Waivers</h2><div id="waiversWrap"></div></div>' +
      '</div>';

    document.getElementById('tabFreeAgents').addEventListener('click', () => {
      document.getElementById('tabFreeAgents').classList.add('active');
      document.getElementById('tabWaivers').classList.remove('active');
      document.getElementById('freeAgentsView').style.display = 'block';
      document.getElementById('waiversView').style.display = 'none';
    });
    document.getElementById('tabWaivers').addEventListener('click', () => {
      document.getElementById('tabWaivers').classList.add('active');
      document.getElementById('tabFreeAgents').classList.remove('active');
      document.getElementById('waiversView').style.display = 'block';
      document.getElementById('freeAgentsView').style.display = 'none';
    });

    populateFilters();
    renderMyTeam(league, myIdx);
    renderMyPendingMoves(league, myIdx);
    renderWaivers(league, myIdx);
    renderFAPool(league, myIdx);
    ['faSearchBox','faAbilitySearchBox','faTierFilter','faTypeFilter'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => renderFAPool(league, myIdx));
      document.getElementById(id).addEventListener('change', () => renderFAPool(league, myIdx));
    });

    resolveExpiredWaivers(league);
    resolvePendingMoves(league);
    if(!league.seasonComplete) maybeWarnFADeadline(league);
  }

  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    subscribeLeague((snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      render(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  const navSignedOut = document.getElementById('navSignedOut');
  const navSignedIn = document.getElementById('navSignedIn');
  const navUserEmail = document.getElementById('navUserEmail');
  const navSignOutBtn = document.getElementById('navSignOutBtn');
  navSignOutBtn.addEventListener('click', () => signOut());


  onUserChange( (user) => {
    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.displayName || 'Trainer';
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champions — Pokemon VGC Draft League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D; --ink-soft:#161616; --panel:#1C1C1C; --cream:#FAFAF7; --cream-dim:#B8B7B2;
    --gold:#FFCB05; --line: rgba(250,250,247,0.14);
    --display: 'Big Shoulders Display', sans-serif; --body: 'Inter', sans-serif; --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  h1{font-family:var(--display);text-transform:uppercase;font-size:clamp(34px,5vw,52px);margin:14px 0 0;}
  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1100px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}
  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;font-weight:700;text-transform:uppercase;font-size:12px;}
  main{max-width:900px;margin:0 auto;padding:60px 22px 100px;}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);}
  p{color:var(--cream-dim);font-size:15.5px;margin-top:14px;line-height:1.65;}

  .fmt-hero{text-align:center;padding-bottom:44px;border-bottom:1px solid var(--line);margin-bottom:44px;}
  .fmt-hero h1{margin-top:10px;}
  .fmt-hero-sub{max-width:560px;margin:14px auto 0;font-size:16.5px;}

  .fmt-toc{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:64px;}
  .fmt-toc a{
    font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--cream-dim);
    border:1px solid var(--line);border-radius:20px;padding:7px 16px;
  }
  .fmt-toc a:hover{color:var(--gold);border-color:var(--gold);}

  .fmt-section{padding:48px 0;border-bottom:1px solid var(--line);scroll-margin-top:90px;}
  .fmt-section:last-of-type{border-bottom:none;}
  .fmt-section-head{display:flex;gap:24px;align-items:flex-start;}
  .fmt-num{
    font-family:var(--display);font-size:15px;font-weight:800;color:var(--ink);background:var(--gold);
    width:40px;height:40px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  }
  .fmt-section-head h2{font-family:var(--display);text-transform:uppercase;font-size:clamp(24px,3.4vw,32px);margin:0 0 4px;letter-spacing:0.01em;}
  .fmt-section-head p{text-align:left;max-width:none;}

  .fmt-example-card{
    margin:26px 0 0 64px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px 26px;
  }
  .fmt-example-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold);margin-bottom:18px;}
  .fmt-mon-row{display:flex;flex-wrap:wrap;gap:16px;}
  .fmt-mon-card{display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;}
  .fmt-mon-sprite{width:64px;height:64px;object-fit:contain;}
  .fmt-mon-name{font-size:12.5px;font-weight:700;text-align:center;line-height:1.25;}
  .fmt-mon-tier{
    font-family:var(--mono);font-weight:700;font-size:11px;color:var(--gold);
    background:rgba(255,203,5,0.12);border-radius:4px;padding:2px 8px;
  }
  .fmt-example-math{font-family:var(--mono);font-size:13px;color:var(--cream-dim);margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);}
  .fmt-example-math b{color:var(--gold);}

  .fmt-swap-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .fmt-swap-side{flex:1;min-width:220px;}
  .fmt-swap-label{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);margin-bottom:12px;}
  .fmt-swap-arrow{font-size:22px;color:var(--gold);flex-shrink:0;}

  @media (max-width:600px){
    .fmt-section-head{flex-direction:column;gap:12px;}
    .fmt-example-card{margin-left:0;}
  }
</style>
</head>

<style>
  .champion-season-card{text-align:center;padding:20px 0 8px;}
  .champion-season-label{font-family:var(--mono);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);}
  .champion-season-name{font-family:var(--display);font-size:clamp(36px,6vw,56px);text-transform:uppercase;color:var(--gold);margin-top:8px;line-height:1;}

    font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;

  }
</style>

<script>
  const S1_CHAMPION = { name: 'Gatlin', wins: 4, losses: 1 };
  const S1_ROSTER = [
    { name: 'Sinistcha', variation: '', tier: 18, pokeapiId: 1013 },
    { name: 'Delphox', variation: 'Mega', tier: 17, pokeapiId: 10293 },
    { name: 'Kingambit', variation: '', tier: 17, pokeapiId: 983 },
    { name: 'Ninetales', variation: 'Alola', tier: 14, pokeapiId: 10104 },
    { name: 'Gallade', variation: 'Mega', tier: 12, pokeapiId: 10068, mvp: true },
    { name: 'Tsareena', variation: '', tier: 8, pokeapiId: 763 },
    { name: 'Ceruledge', variation: '', tier: 8, pokeapiId: 937 },
    { name: 'Morpeko', variation: '', tier: 2, pokeapiId: 877 },
    { name: 'Ariados', variation: '', tier: 2, pokeapiId: 168 },
    { name: 'Falinks', variation: '', tier: 2, pokeapiId: 870 }
  ];

  function displayMonName(mon){
    if(mon.variation && mon.variation.toLowerCase().indexOf('mega') === 0){
      return mon.variation + ' ' + mon.name;
    }
    return mon.name + (mon.variation ? ' ' + mon.variation : '');
  }

  document.getElementById('s1ChampionName').textContent = S1_CHAMPION.name;
  document.getElementById('s1ChampionRecord').textContent = 'Regular Season: ' + S1_CHAMPION.wins + '-' + S1_CHAMPION.losses;
  const rosterRow = document.getElementById('s1RosterRow');
  S1_ROSTER.forEach(mon => {
    const card = document.createElement('div');
    card.className = 'fmt-mon-card champion-mon-card' + (mon.mvp ? ' is-mvp' : '');
    const img = document.createElement('img');
    img.className = 'fmt-mon-sprite champion-mon-sprite';
    img.alt = mon.name;
    img.loading = 'lazy';
    img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + mon.pokeapiId + '.png';
    card.appendChild(img);
    if(mon.mvp){
      const mvpTag = document.createElement('div');
      mvpTag.className = 'champion-mvp-tag';
      mvpTag.textContent = '★ MVP';
      card.appendChild(mvpTag);
    }
    const nameEl = document.createElement('div');
    nameEl.className = 'fmt-mon-name';
    nameEl.textContent = displayMonName(mon);
    card.appendChild(nameEl);
    const tierEl = document.createElement('div');
    tierEl.className = 'fmt-mon-tier';
    tierEl.textContent = mon.tier + ' pts';
    card.appendChild(tierEl);
    rosterRow.appendChild(card);
  });
</script>

  function computeChampionMvp(league, championUid, rosterIds){
    const tally = {};
    const tallyOne = (mvpId) => {
      if(mvpId == null) return;
      if(!rosterIds.includes(mvpId)) return; // only counts if it's still on their final roster
      tally[mvpId] = (tally[mvpId] || 0) + 1;
    };
    if(league.schedule && league.schedule.results){
      Object.values(league.schedule.results).forEach(r => {
        if(r && r.winner === championUid && r.mvp) tallyOne(r.mvp);
      });
    }
    if(league.playoffBracket && league.playoffBracket.rounds){
      league.playoffBracket.rounds.forEach(round => {
        round.matches.forEach(m => {
          if(m && m.winner === championUid && m.mvp) tallyOne(m.mvp);
        });
      });
    }
    let bestId = null, bestCount = 0;
    Object.entries(tally).forEach(([id, count]) => {
      if(count > bestCount){ bestCount = count; bestId = parseInt(id, 10); }
    });
    return bestId;
  }

  function buildDynamicChampionCard(league, championTrainer, mvpMonId){
    const section = document.createElement('section');
    section.className = 'fmt-section';
    section.style.borderBottom = '1px solid var(--line)';

    const cardWrap = document.createElement('div');
    cardWrap.className = 'champion-season-card';

    const label = document.createElement('div');
    label.className = 'champion-season-label';
    label.textContent = escapeHtmlChamp(league.name || 'League') + ' Champion';
    cardWrap.appendChild(label);

    const nameEl = document.createElement('div');
    nameEl.className = 'champion-season-name';
    nameEl.textContent = championTrainer.name;
    cardWrap.appendChild(nameEl);

    if(championTrainer.coachName){
      const coachEl = document.createElement('div');
      coachEl.className = 'champion-season-record';
      coachEl.textContent = championTrainer.coachName;
      cardWrap.appendChild(coachEl);
    }

    const rosterRow = document.createElement('div');
    rosterRow.className = 'fmt-mon-row';
    rosterRow.style.justifyContent = 'center';
    rosterRow.style.marginTop = '26px';
    (championTrainer.roster || []).forEach(mon => {
      const isMvp = mon.id === mvpMonId;
      const card = document.createElement('div');
      card.className = 'fmt-mon-card champion-mon-card' + (isMvp ? ' is-mvp' : '');
      const img = document.createElement('img');
      img.className = 'fmt-mon-sprite champion-mon-sprite';
      img.alt = mon.name; img.loading = 'lazy';
      const pokeapiId = ID_TO_POKEAPI_ID_CHAMP[mon.id];
      img.src = pokeapiId ? ('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokeapiId + '.png') : '';
      card.appendChild(img);
      if(isMvp){
        const mvpTag = document.createElement('div');
        mvpTag.className = 'champion-mvp-tag';
        mvpTag.textContent = '★ MVP';
        card.appendChild(mvpTag);
      }
      const nameLine = document.createElement('div');
      nameLine.className = 'fmt-mon-name';
      nameLine.textContent = (mon.variation && mon.variation.toLowerCase().indexOf('mega') === 0) ? (mon.variation + ' ' + mon.name) : (mon.name + (mon.variation ? ' ' + mon.variation : ''));
      card.appendChild(nameLine);
      const tierLine = document.createElement('div');
      tierLine.className = 'fmt-mon-tier';
      tierLine.textContent = mon.tier + ' pts';
      card.appendChild(tierLine);
      rosterRow.appendChild(card);
    });
    cardWrap.appendChild(rosterRow);
    section.appendChild(cardWrap);
    return section;
  }

  function escapeHtmlChamp(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadDynamicChampions(){
    const wrap = document.getElementById('dynamicChampionsWrap');
    if(!wrap) return;
    try{
      const q = query(collection(db, 'leagues'), where('seasonComplete', '==', true));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        const league = docSnap.data();
        if(!league.draft || !league.championUid) return;
        const championTrainer = league.draft.trainers.find(t => t.uid === league.championUid);
        if(!championTrainer) return;
        const rosterIds = (championTrainer.roster || []).map(m => m.id);
        const mvpMonId = computeChampionMvp(league, league.championUid, rosterIds);
        wrap.appendChild(buildDynamicChampionCard(league, championTrainer, mvpMonId));
      });
    }catch(err){
      // If Firestore rules don't allow this broad a query, fail quietly rather than break the page
      console.warn('Could not load dynamic champions:', err.message);
    }
  }
  loadDynamicChampions();

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const navSignedOut = document.getElementById("navSignedOut");
  const navSignedIn = document.getElementById("navSignedIn");
  const navUserEmail = document.getElementById("navUserEmail");
  const navSignOutBtn = document.getElementById("navSignOutBtn");

  const navLeaguesBtn = document.getElementById("navLeaguesBtn");
  const navLeaguesMenu = document.getElementById("navLeaguesMenu");
  const navLeaguesList = document.getElementById("navLeaguesList");
  const navLeaguesEmpty = document.getElementById("navLeaguesEmpty");

  navLeaguesBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    navLeaguesMenu.classList.toggle("open");
  });
  document.addEventListener("click", () => navLeaguesMenu.classList.remove("open"));
  navLeaguesMenu.addEventListener("click", (e) => e.stopPropagation());

  function generateJoinCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "";
    for(let i = 0; i < 6; i++){ code += chars[Math.floor(Math.random() * chars.length)]; }
    return code;
  }

  const navLeaguesDefaultView = document.getElementById("navLeaguesDefaultView");
  const navJoinView = document.getElementById("navJoinView");
  const navShowJoinBtn = document.getElementById("navShowJoinBtn");
  const navJoinCodeInput = document.getElementById("navJoinCodeInput");
  const navJoinSubmitBtn = document.getElementById("navJoinSubmitBtn");
  const navJoinCancelBtn = document.getElementById("navJoinCancelBtn");
  const navJoinStatus = document.getElementById("navJoinStatus");
  let navCurrentUser = null;

  function showNavDefault(){
    navLeaguesDefaultView.style.display = "block";
    navJoinView.style.display = "none";
    navJoinStatus.textContent = "";
  }
  navShowJoinBtn.addEventListener("click", () => {
    navLeaguesDefaultView.style.display = "none";
    navJoinView.style.display = "block";
  });
  navJoinCancelBtn.addEventListener("click", showNavDefault);

  navJoinSubmitBtn.addEventListener("click", async () => {
    if(!navCurrentUser) return;
    const code = navJoinCodeInput.value.trim().toUpperCase();
    if(!code){ navJoinStatus.textContent = "Enter a code."; return; }
    navJoinSubmitBtn.disabled = true;
    try{
      const q = query(collection(db, "leagues"), where("joinCode", "==", code));
      const snap = await getDocs(q);
      if(snap.empty){
        navJoinStatus.textContent = "No league found with that code.";
        navJoinSubmitBtn.disabled = false;
        return;
      }
      const leagueDoc = snap.docs[0];
      const leagueData = leagueDoc.data();
      const maxTeams = (leagueData.settings && leagueData.settings.maxTeams) || Infinity;
      const currentMemberCount = Object.keys(leagueData.members || {}).length;
      if(!leagueData.members || !leagueData.members[navCurrentUser.uid]){
        if(currentMemberCount >= maxTeams){
          navJoinStatus.textContent = "This league is full (" + maxTeams + " team limit).";
          navJoinSubmitBtn.disabled = false;
          return;
        }
      }
      await updateDoc(doc(db, "leagues", leagueDoc.id), {
        ["members." + navCurrentUser.uid]: {
          displayName: navCurrentUser.displayName || "Trainer",
          photoURL: navCurrentUser.photoURL || "",
          joinedAt: Date.now()
        }
      });
      navJoinCodeInput.value = "";
      await loadNavLeagues(navCurrentUser);
      showNavDefault();
    }catch(err){
      navJoinStatus.textContent = "Error: " + err.message;
    }
    navJoinSubmitBtn.disabled = false;
  });


  async function loadNavLeagues(user){
    try{
      const q = query(collection(db, "leagues"), where("members." + user.uid, "!=", null));
      const snap = await getDocs(q);
      navLeaguesList.innerHTML = "";
      if(snap.empty){
        navLeaguesEmpty.style.display = "block";
        return;
      }
      navLeaguesEmpty.style.display = "none";
      snap.forEach(docSnap => {
        const league = docSnap.data();
        const isCommish = league.commissionerUid === user.uid;
        const li = document.createElement("li");
        li.innerHTML = '<a href="league.html?id=' + docSnap.id + '"><span>' + escapeHtml(league.name || "Untitled League") + "</span>" + (isCommish ? '<span class="nlm-commish">Commish</span>' : "") + "</a>";
        navLeaguesList.appendChild(li);
      });
    }catch(err){
      navLeaguesEmpty.style.display = "block";
      navLeaguesEmpty.textContent = "Could not load leagues.";
    }
  }

  // ---------- illustrative examples ----------
  const PLACEHOLDER_SPRITE = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#3A3A3A" stroke-width="2"/><line x1="3" y1="20" x2="37" y2="20" stroke="#3A3A3A" stroke-width="2"/><circle cx="20" cy="20" r="5" fill="#3A3A3A"/></svg>'
  );
  function spriteUrl(pokeapiId){
    return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokeapiId + '.png';
  }
  function monCard(name, tier, pokeapiId){
    const card = document.createElement('div');
    card.className = 'fmt-mon-card';
    const img = document.createElement('img');
    img.className = 'fmt-mon-sprite'; img.alt = name; img.loading = 'lazy';
    img.src = spriteUrl(pokeapiId);
    img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER_SPRITE; img.style.opacity = '0.4'; };
    card.appendChild(img);
    const nameEl = document.createElement('div'); nameEl.className = 'fmt-mon-name'; nameEl.textContent = name;
    card.appendChild(nameEl);
    const tierEl = document.createElement('div'); tierEl.className = 'fmt-mon-tier'; tierEl.textContent = tier + ' pts';
    card.appendChild(tierEl);
    return card;
  }
  function fillRow(id, mons){
    const row = document.getElementById(id);
    if(!row) return;
    mons.forEach(m => row.appendChild(monCard(m.name, m.tier, m.pokeapiId)));
  }

  fillRow('draftExampleRow', [
    { name: 'Garchomp', tier: 18, pokeapiId: 445 },
    { name: 'Incineroar', tier: 18, pokeapiId: 727 },
    { name: 'Gholdengo', tier: 19, pokeapiId: 1000 },
    { name: 'Mimikyu', tier: 11, pokeapiId: 778 },
    { name: 'Pikachu', tier: 1, pokeapiId: 25 }
  ]);
  document.getElementById('draftExampleMath').innerHTML = '18 + 18 + 19 + 11 + 1 = <b>67 points spent</b> — 33 left for the rest of the roster.';

  fillRow('faDropRow', [{ name: 'Pikachu', tier: 1, pokeapiId: 25 }]);
  fillRow('faClaimRow', [{ name: 'Dragapult', tier: 15, pokeapiId: 887 }]);
  document.getElementById('faExampleMath').innerHTML = 'Dropping Pikachu frees a slot and refunds <b>1 pt</b>. Claiming Dragapult costs <b>15 pts</b> — both land on your roster together, next Monday. Pikachu goes to waivers, not straight back to the pool.';

  fillRow('tradeGiveRow', [{ name: 'Charizard', tier: 20, pokeapiId: 10035 }]);
  fillRow('tradeGetRow', [{ name: 'Garchomp', tier: 18, pokeapiId: 445 }]);
  document.getElementById('tradeExampleMath').innerHTML = 'Same number of Pokémon on each side — 1 for 1. Team A sends 20 points of value and receives 18 back; the 2-point gap is simply deducted from their remaining budget, no separate approval needed beyond accepting the trade itself.';

  onAuthStateChanged(auth, (user) => {
    if(user){
      navSignedOut.style.display = "none";
      navSignedIn.style.display = "flex";
      navUserEmail.textContent = user.displayName || "Trainer";
      navCurrentUser = user;
      loadNavLeagues(user);
    } else {
      navSignedOut.style.display = "";
      navSignedIn.style.display = "none";
    }
  });

  navSignOutBtn.addEventListener("click", () => signOut(auth));
</script>

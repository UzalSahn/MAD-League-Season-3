<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League — The MAD League</title>
<meta name="description" content="MAD League weekly matches and results.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --ink-soft:#161616;
    --panel:#1C1C1C;
    --cream:#FAFAF7;
    --cream-dim:#B8B7B2;
    --gold:#FFCB05;
    --gold-soft:#C79A00;
    --teal:#B00000;
    --teal-bright:#FF5A5A;
    --scarlet:#EE1515;
    --slate:#3A3A3A;
    --line: rgba(250,250,247,0.14);

    --display: 'Big Shoulders Display', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  h1,h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0;}

  header.site-nav{position:sticky;top:0;z-index:60;background:rgba(13,13,13,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:900px;margin:0 auto;}
  .nav-left-group{display:flex;align-items:center;}

  .league-subnav{background:var(--ink-soft);border-bottom:1px solid var(--line);}
  .league-subnav-inner{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:0 22px;overflow-x:auto;}
  .subnav-tab{
    padding:14px 18px;font-family:var(--mono);font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--cream-dim);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;
  }
  .subnav-tab:hover{color:var(--cream);}
  .subnav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .subnav-tab.subnav-tab-glow{color:var(--gold);animation:tradeTabGlow 1.5s ease-in-out infinite;}
  @keyframes tradeTabGlow{0%,100%{text-shadow:0 0 2px rgba(255,203,5,0.15);}50%{text-shadow:0 0 12px rgba(255,203,5,0.95);}}

  h2{font-family:var(--display);text-transform:uppercase;letter-spacing:0.01em;line-height:0.96;margin:0 0 14px;font-size:19px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px;}
  .page-head{margin-bottom:20px;}
  .week-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;}
  .week-nav-btn{
    background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:10px 16px;border-radius:4px;cursor:pointer;font-family:var(--body);font-weight:600;font-size:13px;
  }
  .week-nav-btn:hover{border-color:var(--gold);}
  .week-nav-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .week-nav-label{text-align:center;font-size:13.5px;color:var(--cream-dim);line-height:1.5;}
  .week-nav-current{color:var(--gold);font-weight:700;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .btn-danger{border-color:rgba(238,21,21,0.4);color:#FF8A8A;}
  .btn-danger:hover{border-color:#EE1515;color:#FF8A8A;}
  .btn-sm{padding:7px 14px;font-size:11px;}
  .settings-note{font-size:12.5px;color:var(--cream-dim);margin:10px 0 0;}

  .match-panel{padding:20px;position:relative;padding-top:56px;}
  .match-vs-head{display:flex;flex-direction:column;align-items:center;gap:10px;font-family:var(--display);font-size:26px;text-transform:uppercase;margin-bottom:18px;}
  .match-team-name.winner{color:var(--gold);}
  .match-vs-label{font-family:var(--mono);font-size:13px;color:var(--cream-dim);text-transform:none;}
  .match-team{display:flex;align-items:center;justify-content:center;gap:12px;}
  .match-avatar, .match-avatar-placeholder{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;}
  .preview-teams-btn{position:absolute;top:20px;left:20px;margin:0;}
  .intro-btn-corner{position:absolute;top:20px;right:20px;margin:0;}
  .match-is-over-btn{display:block;margin:20px auto 0;}
  .tier-chip{font-family:var(--mono);font-weight:700;font-size:11px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:4px;background:rgba(255,203,5,0.15);color:var(--gold);}
  .type-badges{display:flex;gap:4px;margin-top:4px;flex-wrap:nowrap;}
  .type-badge{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:3px;}

  .matchup-modal{
    position:fixed;inset:0;z-index:500;background:rgba(13,13,13,0.85);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .matchup-modal.show{display:flex;}
  .matchup-modal-card{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    max-width:1080px;width:100%;max-height:90vh;overflow-y:auto;padding:26px;position:relative;
    scroll-behavior:smooth;
    scrollbar-width:thin;scrollbar-color:var(--gold-soft) transparent;
  }
  .matchup-modal-card::-webkit-scrollbar{width:8px;}
  .matchup-modal-card::-webkit-scrollbar-track{background:transparent;}
  .matchup-modal-card::-webkit-scrollbar-thumb{background:var(--gold-soft);border-radius:8px;}
  .matchup-modal-card::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  .matchup-modal-close{
    position:absolute;top:16px;right:20px;background:none;border:none;color:var(--cream-dim);
    font-size:24px;cursor:pointer;line-height:1;
  }
  .matchup-modal-close:hover{color:var(--gold);}
  .matchup-modal-title{text-align:center;font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:20px;}
  .matchup-columns{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start;}
  .matchup-columns.intro-align{align-items:center;}
  .matchup-columns.intro-align .matchup-vs-divider{padding-top:0;}
  .matchup-vs-divider{font-family:var(--display);font-size:38px;text-transform:uppercase;letter-spacing:0.04em;color:var(--gold);padding-top:40px;}
  .matchup-vs-divider.fade-vs{opacity:0;transition:opacity 1s ease-in;}
  .matchup-vs-divider.fade-vs.visible{opacity:1;}
  .matchup-team-col{min-width:0;}
  .intro-crawl-viewport{position:relative;height:400px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);mask-image:linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);}
  .intro-crawl-viewport.settled{height:auto;overflow:visible;-webkit-mask-image:none;mask-image:none;}
  .intro-crawl-viewport.settled .matchup-roster-list{position:static;transform:none !important;transition:none !important;}
  .intro-crawl-viewport .matchup-roster-list{position:absolute;top:0;left:0;width:100%;transform:translateY(0);will-change:transform;}
  .intro-reveal-card{list-style:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:36px;gap:8px;min-height:210px;box-sizing:border-box;width:100%;}
  .intro-reveal-avatar, .intro-reveal-avatar-placeholder{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--ink-soft);border:3px solid var(--gold);}
  .intro-reveal-name{font-family:var(--display);font-size:30px;text-transform:uppercase;color:var(--cream);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .intro-reveal-coach{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:0.04em;color:var(--gold);opacity:0;transition:opacity 1.1s ease-in;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .intro-reveal-coach.visible{opacity:1;}
  .matchup-team-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  #previewATeamHead{flex-direction:row-reverse;text-align:right;}
  #previewATeamHead, #previewBTeamHead{display:none;}
  .matchup-team-coach{font-size:12px;color:var(--cream-dim);margin-top:2px;}
  .matchup-team-head .avatar-thumb, .matchup-team-head .avatar-thumb-placeholder{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--slate);flex-shrink:0;}
  .matchup-team-head h3{font-family:var(--display);text-transform:uppercase;font-size:19px;margin:0;}
  .matchup-roster-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .matchup-roster-list li{display:flex;align-items:center;gap:8px;font-size:13.5px;padding-top:9px;border-top:1px solid var(--line);min-height:84px;box-sizing:border-box;}
  #previewARoster li{flex-direction:row-reverse;text-align:right;}
  #previewARoster li.intro-reveal-card{flex-direction:column;text-align:center;}
  #previewARoster li .type-badges{justify-content:flex-end;}
  .matchup-roster-list li:first-child{border-top:none;padding-top:0;}
  .matchup-roster-list .mon-sprite{width:84px;height:84px;object-fit:contain;flex-shrink:0;}
  .matchup-roster-list .mon-info{flex:1;min-width:0;overflow:hidden;}
  .matchup-roster-list .mon-title-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .matchup-roster-list .mon-name{font-weight:600;}
  .matchup-roster-list .mon-var{font-family:var(--mono);font-size:10.5px;color:#FF5A5A;margin-left:4px;}

  .clickable-team-name{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color .15s;}
  .clickable-team-name:hover{text-decoration-color:var(--gold);}

  .team-details-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .team-details-head h3{font-family:var(--display);text-transform:uppercase;font-size:22px;margin:0;}
  .team-details-coach{font-size:13px;color:var(--cream-dim);margin-top:2px;}
  .team-details-budget{font-family:var(--mono);font-size:12px;color:var(--gold);margin-top:3px;}
  .team-details-section-label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gold);margin:18px 0 10px;}
  .team-details-roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px;}
  .team-details-roster-cell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
  .team-details-sprite{width:64px;height:64px;object-fit:contain;}
  .team-details-roster-cell span{font-size:12px;font-weight:600;line-height:1.2;}
  .team-details-tx-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .team-details-tx-list li{font-size:12.5px;color:var(--cream-dim);padding-bottom:8px;border-bottom:1px solid var(--line);}
  .team-details-tx-list li:last-child{border-bottom:none;}

  @media (max-width:640px){
    .matchup-columns{grid-template-columns:1fr;}
    .matchup-vs-divider{text-align:center;padding-top:0;}
  }
  .winner-pick-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .mvp-picker{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0;position:relative;}
  .mvp-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--cream-dim);}
  .mvp-dropdown{position:relative;min-width:220px;}
  .mvp-dropdown-trigger{
    display:flex;align-items:center;gap:8px;width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:6px 10px;border-radius:4px;font-family:var(--body);font-size:13px;cursor:pointer;text-align:left;
  }
  .mvp-dropdown-trigger:hover{border-color:var(--gold);}
  .mvp-dropdown-trigger span:first-of-type{flex:1;}
  .mvp-dropdown-caret{color:var(--cream-dim);font-size:11px;flex-shrink:0;}
  .mvp-dropdown-sprite{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
  .mvp-dropdown-menu{
    display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;max-height:240px;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .mvp-dropdown-menu.show{display:block;}
  .mvp-dropdown-option{
    display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;color:var(--cream);
  }
  .mvp-dropdown-option:hover{background:var(--ink-soft);}
  .mvp-dropdown-option.active{background:rgba(255,203,5,0.1);color:var(--gold);}
  .mvp-display{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0;}
  .mvp-display-sprite{width:32px;height:32px;object-fit:contain;}
  .mvp-display-tag{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink);background:var(--gold);padding:2px 6px;border-radius:3px;margin-right:4px;}

  .games-editor{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .games-caption{font-family:var(--mono);font-size:11px;color:var(--cream-dim);margin-bottom:8px;text-align:center;}
  .game-row{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;color:var(--cream-dim);justify-content:center;}
  .game-label{font-family:var(--mono);min-width:52px;font-size:11px;}
  .game-vs{font-family:var(--mono);font-size:10px;}
  .game-alive-input{
    width:44px;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:5px 6px;border-radius:3px;font-family:var(--mono);font-size:13px;text-align:center;
  }
  .game-alive-input:focus{border-color:var(--gold);}
  .game-diff{font-family:var(--mono);font-weight:700;min-width:32px;text-align:right;color:var(--gold);}
  .game-remove-btn{background:none;border:none;color:var(--cream-dim);cursor:pointer;font-size:13px;padding:0 2px;}
  .game-remove-btn:hover{color:var(--scarlet, #EE1515);}
  .add-game-btn{
    display:block;margin:8px auto 0;background:none;border:1px dashed var(--line);color:var(--cream-dim);font-family:var(--mono);
    font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;
  }
  .add-game-btn:hover{border-color:var(--gold);color:var(--gold);}
  .total-diff-row{margin-top:10px;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);text-align:center;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-mark{width:22px;height:22px;flex-shrink:0;}

  main{max-width:900px;margin:0 auto;padding:40px 22px 80px;}

  .page-head{margin-bottom:28px;}
  .page-head .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);}
  .page-head h1{font-size:clamp(30px,5vw,46px);margin-top:8px;}
  .league-logo-header{width:44px;height:44px;border-radius:50%;object-fit:cover;float:right;}
  .commish-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    background:rgba(255,203,5,0.15);color:var(--gold);padding:4px 10px;border-radius:3px;
  }

  .nav-links{display:flex;align-items:center;gap:20px;font-size:13px;font-weight:600;}
  .nav-former-champions{font-size:13px;font-weight:600;color:var(--cream-dim);margin-left:6px;padding-left:6px;}
  .nav-former-champions:hover{color:var(--gold);}
  .nav-links a{color:var(--cream-dim);}
  .nav-links a:hover{color:var(--gold);}
  .nav-account{display:flex;align-items:center;gap:12px;}
  .nav-account #navUserEmail{color:var(--cream-dim);font-size:12.5px;}
  .nav-leagues-wrap{position:relative;}
  .nav-leagues-menu{
    display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:240px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:100;
  }
  .nav-leagues-menu.open{display:block;}
  .nlm-label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:8px;}
  .nlm-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto;}
  .nlm-list li a{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream);
  }
  .nlm-list li a:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-commish{font-family:var(--mono);font-size:9px;color:var(--gold);background:rgba(255,203,5,0.15);padding:1px 6px;border-radius:3px;text-transform:uppercase;}
  .nlm-empty{font-size:12.5px;color:var(--cream-dim);padding:8px 10px;}
  .nlm-divider{height:1px;background:var(--line);margin:10px 0;}
  .nlm-action{display:block;padding:8px 10px;border-radius:4px;font-size:13px;font-weight:600;color:var(--cream-dim);}
  .nlm-action:hover{background:var(--ink-soft);color:var(--gold);}
  .nlm-input{
    width:100%;background:var(--ink-soft);border:1px solid var(--line);color:var(--cream);
    padding:8px 10px;border-radius:4px;font-size:13px;margin-bottom:8px;font-family:var(--body);
  }
  .nlm-input:focus{border-color:var(--gold);}
  .nlm-form-actions{display:flex;gap:8px;}
  .nlm-status{font-size:11.5px;color:var(--cream-dim);margin-top:8px;margin-bottom:0;}
  .nav-links .nav-cta{
    background:var(--gold);color:var(--ink);padding:8px 16px;border-radius:3px;
    font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:0.03em;
  }
  .nav-links .nav-cta:hover{background:#ffd633;color:var(--ink);}
  @media (max-width:640px){
    .nav-links{gap:12px;font-size:12px;}
    .nav-links .nav-cta{padding:7px 12px;}
  }

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:20px;}
  .panel h2{font-size:18px;margin-bottom:14px;}

  .join-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    background:var(--ink-soft);border:1px dashed var(--gold);border-radius:6px;padding:16px 20px;
  }
  .join-code-value{font-family:var(--mono);font-size:28px;letter-spacing:0.14em;color:var(--gold);font-weight:700;}
  .join-code-hint{font-size:13px;color:var(--cream-dim);margin-top:6px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-weight:700;font-size:13px;letter-spacing:0.02em;text-transform:uppercase;
    padding:10px 18px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--cream);font-family:var(--body);
    transition:transform .12s ease, border-color .15s ease;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--gold);color:var(--gold);}
  .btn-primary{background:var(--gold);color:var(--ink);border-color:var(--gold);}
  .btn-primary:hover{background:#ffd633;color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

  .member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .member-list li{
    display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);
  }
  .member-list li:first-child{border-top:none;padding-top:0;}
  .member-list img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--slate);}
  .member-name{font-weight:600;font-size:14.5px;}
  .commish-tag{
    font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;
    letter-spacing:0.06em;margin-left:8px;
  }

  .state-msg{text-align:center;padding:40px 20px;color:var(--cream-dim);font-size:14px;}
  .state-msg.error{color:#FF8A8A;}

  .draft-cta{text-align:center;padding:10px 0;}

    const me = league.draft.trainers.find(t => t.uid === currentUser.uid);

    const tradesSeenAt = (me && me.tradesSeenAt) || 0;
    const tradesUnseen = (league.trades || []).some(t => t.recipientUid === currentUser.uid && t.status === 'pending' && (t.createdAt || 0) > tradesSeenAt);

  // ---------- date helpers (Monday-Sunday weeks) ----------
  function parseLocalDate(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d; }
  function upcomingOrTodayMonday(){
    const now = new Date();
    const day = now.getDay();
    const daysBack = day === 0 ? 6 : (day - 1);
    const monday = new Date(now);
    monday.setDate(now.getDate() - daysBack);
    monday.setHours(0,0,0,0);
    return monday.getTime();
  }
  function weekDateRange(startTs, weekIdx){
    const start = new Date(startTs + weekIdx * 7 * 86400000);
    const end = new Date(start.getTime() + 6 * 86400000);
    const fmt = d => (d.getMonth()+1) + '/' + d.getDate();
    return fmt(start) + ' – ' + fmt(end);
  }
  function currentWeekIndex(startTs, numWeeks){
    if(numWeeks <= 0) return 0;
    const diffDays = Math.floor((Date.now() - startTs) / 86400000);
    const idx = Math.floor(diffDays / 7);
    return Math.min(Math.max(idx, 0), numWeeks - 1);
  }

  function buildRoundRobin(uids, double){
    const list = uids.slice();
    if(list.length % 2 !== 0) list.push('BYE');
    const n = list.length;
    const rounds = [];
    const arr = list.slice();
    for(let r = 0; r < n - 1; r++){
      const matches = [];
      for(let i = 0; i < n/2; i++){
        const a = arr[i], b = arr[n-1-i];
        if(a !== 'BYE' && b !== 'BYE') matches.push({ a, b });
        else matches.push({ a: a === 'BYE' ? b : a, b: 'BYE' });
      }
      rounds.push({ matches });
      arr.splice(1, 0, arr.pop());
    }
    if(double){
      const mirrored = rounds.map(r => ({ matches: r.matches.map(m => ({ a: m.b, b: m.a })) }));
      return rounds.concat(mirrored);
    }
    return rounds;
  }

    const listEl = document.getElementById(prefix + 'Roster');
    listEl.innerHTML = '';
    const firstPick = roster[0];
    const restSortedByTier = roster.slice(1).sort((a, b) => a.tier - b.tier); // lowest to highest points
    const visualSequence = firstPick ? restSortedByTier.concat([firstPick]) : restSortedByTier; // lowest...highest, first overall pick last
    if(visualSequence.length === 0){
      const li = document.createElement('li');
      li.textContent = 'No Pokémon drafted yet.';
      li.style.color = 'var(--cream-dim)';
      li.style.fontStyle = 'italic';
      listEl.appendChild(li);
      return;
    }
    // Reveal card — team identity closes out the crawl, after every Pokémon has scrolled through
    const revealLi = document.createElement('li');
    revealLi.className = 'intro-reveal-card';
    revealLi.innerHTML =
      (coachName ? '<div class="intro-reveal-coach" id="' + prefix + 'RevealCoach">' + escapeHtml(coachName) + '</div>' : '') +
      (avatar ? '<img class="intro-reveal-avatar" src="' + escapeHtml(avatar) + '" alt="">' : '<span class="intro-reveal-avatar-placeholder"></span>') +
      '<div class="intro-reveal-name">' + escapeHtml(name || 'BYE') + '</div>';
    // For top-to-bottom motion, whatever is LAST in the DOM enters the viewport FIRST — so the
    // DOM order must be the reverse of the visual entrance sequence, with the reveal card first.
    listEl.appendChild(revealLi);
    visualSequence.slice().reverse().forEach(mon => {
      const li = document.createElement('li');
      li.appendChild(makeSpriteImg(mon, 'mon-sprite', true));

        '<div class="type-badges">' + typeBadgesHtml(mon.types) + '</div>';
      li.appendChild(info);
      const tier = document.createElement('span');
      tier.className = 'tier-chip';
      tier.textContent = mon.tier;
      li.appendChild(tier);
      listEl.appendChild(li);
    });
  }

  function formatTxLine(league, uid, tx){
    const date = new Date(tx.timestamp).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    if(tx.type === 'fa_swap'){
      const claimNames = (tx.claims||[]).map(m=>m.name).join(', ');
      const dropNames = (tx.drops||[]).map(m=>m.name).join(', ');
      let line = '';
      if(claimNames) line += 'Claimed ' + claimNames;
      if(dropNames) line += (line ? ' · ' : '') + 'Dropped ' + dropNames;
      return date + ' — ' + (line || 'Free agency move');
    }
    if(tx.type === 'trade'){
      const isProposer = tx.proposerUid === uid;
      const gave = isProposer ? tx.offered : tx.requested;
      const got = isProposer ? tx.requested : tx.offered;
      const other = isProposer ? tx.recipientName : tx.proposerName;
      return date + ' — Traded ' + (gave||[]).map(m=>m.name).join(', ') + ' to ' + escapeHtml(other) + ' for ' + (got||[]).map(m=>m.name).join(', ');
    }
    return date + ' — Transaction';
  }

  function waitForImages(container){
    const imgs = Array.from(container.querySelectorAll('img'));
    if(imgs.length === 0) return Promise.resolve();
    const imagesReady = Promise.all(imgs.map(img => {
      if(img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(resolve => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true }); // don't hang forever on a broken image
      });
    }));
    const safetyTimeout = new Promise(resolve => setTimeout(resolve, 5000)); // never hang the intro indefinitely
    return Promise.race([imagesReady, safetyTimeout]);
  }

  function playIntroCrawl(viewportId, listId, headId, generation){
    const viewport = document.getElementById(viewportId);
    const list = document.getElementById(listId);
    const head = headId ? document.getElementById(headId) : null;
    if(!viewport || !list) return;
    if(head) head.style.display = 'none';
    viewport.classList.remove('settled');
    const revealCard = list.querySelector('.intro-reveal-card');
    const coachEl = list.querySelector('.intro-reveal-coach');
    if(coachEl) coachEl.classList.remove('visible');

    const viewportHeight = viewport.clientHeight;
    const listHeight = list.scrollHeight;
    // Stop with the reveal card centered in the viewport, rather than scrolling it fully past too
    const revealCenter = revealCard ? (revealCard.offsetTop + revealCard.offsetHeight / 2) : listHeight;
    const finalTransform = (viewportHeight / 2) - revealCenter;
    const totalDistance = finalTransform + listHeight;
    const duration = Math.max(8, Math.min(22, totalDistance / 55));

    list.style.transition = 'none';
    list.style.transform = 'translateY(-' + listHeight + 'px)';
    void list.offsetHeight; // force reflow so the reset above takes effect before animating
    list.style.transition = 'transform ' + duration.toFixed(1) + 's linear';
    list.style.transform = 'translateY(' + finalTransform + 'px)';

    setTimeout(() => {
      if(generation !== previewGeneration) return; // a newer match was opened in the meantime — ignore
      if(coachEl) coachEl.classList.add('visible');
      introRevealCount++;
      if(introRevealCount >= 2){
        const vsDivider = document.getElementById('teamPreviewVsDivider');
        if(vsDivider) vsDivider.classList.add('visible');
      }
      // Stays here now — the reveal is the resting state. "Preview Teams" is its own
      // dedicated button for the classic view, so the intro no longer transitions into it.
    }, duration * 1000 + 150);
  }

    renderPreviewColumn('previewB', trainerName(league, uidB), trainerCoachName(league, uidB), trainerAvatar(league, uidB), trainerRoster(league, uidB));
    const previewCard = document.querySelector('#teamPreviewModal .matchup-modal-card');
    if(previewCard){ previewCard.scrollTop = 0; }
    ['previewARoster', 'previewBRoster'].forEach(id => {
      const el = document.getElementById(id);
      if(el){ el.style.transition = 'none'; el.style.transform = 'translateY(0)'; el.style.opacity = '1'; }
    });
    ['previewACrawlViewport', 'previewBCrawlViewport'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.classList.remove('settled');
    });
    ['previewATeamHead', 'previewBTeamHead'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.display = playIntro ? 'none' : 'flex';
    });
    document.getElementById('teamPreviewModal').classList.add('show');
    const columnsEl = document.getElementById('teamPreviewColumns');
    const vsDivider = document.getElementById('teamPreviewVsDivider');
    introRevealCount = 0;
    if(!playIntro){
      // Straight to the classic view, no crawl — for people who just want to look, not wait
      if(columnsEl) columnsEl.classList.remove('intro-align');
      if(vsDivider){ vsDivider.classList.remove('fade-vs', 'visible'); }
      if(previewCard) previewCard.style.overflowY = '';
      ['previewARoster', 'previewBRoster'].forEach(id => {
        const el = document.getElementById(id);
        if(el) renderClassicRoster(el);
      });
      ['previewACrawlViewport', 'previewBCrawlViewport'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.classList.add('settled');
      });
      return;
    }
    // Intro mode: VS fades in later (once both reveals land), aligns to the crawl viewport's
    // center (where the reveal logo settles), and the modal doesn't need to scroll
    if(columnsEl) columnsEl.classList.add('intro-align');
    if(vsDivider){ vsDivider.classList.add('fade-vs'); vsDivider.classList.remove('visible'); }
    if(previewCard) previewCard.style.overflowY = 'hidden';
    // Wait a beat for layout to settle (modal was display:none, so heights weren't measurable yet),
    // then wait for every sprite image to actually finish loading before measuring anything —
    // otherwise heights get measured against un-loaded (zero-size) images, throwing off the
    // whole animation and causing sprites to visibly pop in mid-crawl.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const rosterA = document.getElementById('previewARoster');
      const rosterB = document.getElementById('previewBRoster');
      Promise.all([waitForImages(rosterA), waitForImages(rosterB)]).then(() => {
        if(myGeneration !== previewGeneration) return; // a newer match was opened while images were loading — ignore this stale call
        playIntroCrawl('previewACrawlViewport', 'previewARoster', 'previewATeamHead', myGeneration);
        playIntroCrawl('previewBCrawlViewport', 'previewBRoster', 'previewBTeamHead', myGeneration);
      });
    }));
  }

  function matchDifferential(r){
    if(!r || !r.games) return 0;
    return r.games.reduce((sum, g) => (g.a != null && g.b != null) ? sum + (g.a - g.b) : sum, 0);
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  async function generateSchedule(league, double, startTs){
    const uids = shuffle(league.draft.trainers.map(t => t.uid));
    const weeks = buildRoundRobin(uids, double);
    const schedule = { startDate: startTs || upcomingOrTodayMonday(), weeks, results: {} };
    const startLabel = new Date(schedule.startDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    try{
      await updateLeague({ schedule });
      pushAnnouncement(league, 'match', 'Austin generated the season schedule (' + weeks.length + ' weeks, starting ' + startLabel + ')');
    }catch(err){ alert('Could not generate schedule: ' + err.message); }
  }

  function renderGamesEditor(container, existing, matchKey, canEdit, onSave){
    const games = (existing && existing.games && existing.games.length) ? JSON.parse(JSON.stringify(existing.games)) : [{ a: null, b: null }];
    let totalRowEl = null;

    function updateTotal(){
      if(!totalRowEl) return;
      const total = games.reduce((s,g)=> (g.a!=null&&g.b!=null) ? s+(g.a-g.b) : s, 0);
      totalRowEl.textContent = 'Total Differential: ' + (total>0?'+':'') + total;
    }

    function draw(){
      container.innerHTML = '';
      games.forEach((g, gIdx) => {
        const row = document.createElement('div');
        row.className = 'game-row';
        const label = document.createElement('span'); label.className = 'game-label'; label.textContent = 'Game ' + (gIdx+1);
        row.appendChild(label);
        const aInput = document.createElement('input'); aInput.type = 'number'; aInput.min = '0'; aInput.max = '6'; aInput.className = 'game-alive-input'; aInput.value = g.a != null ? g.a : '';
        const vs = document.createElement('span'); vs.className = 'game-vs'; vs.textContent = 'vs';
        const bInput = document.createElement('input'); bInput.type = 'number'; bInput.min = '0'; bInput.max = '6'; bInput.className = 'game-alive-input'; bInput.value = g.b != null ? g.b : '';
        const diff = document.createElement('span'); diff.className = 'game-diff';
        function updateDiff(){ diff.textContent = (g.a != null && g.b != null) ? ((g.a-g.b)>0?'+':'')+(g.a-g.b) : '—'; }
        updateDiff();
        function commit(){
          g.a = aInput.value === '' ? null : parseInt(aInput.value,10);
          g.b = bInput.value === '' ? null : parseInt(bInput.value,10);
          updateDiff();
          updateTotal();
        }
        aInput.disabled = !canEdit; bInput.disabled = !canEdit;
        aInput.addEventListener('change', commit); bInput.addEventListener('change', commit);
        row.appendChild(aInput); row.appendChild(vs); row.appendChild(bInput); row.appendChild(diff);
        if(canEdit){
          const rm = document.createElement('button'); rm.type='button'; rm.className='game-remove-btn'; rm.textContent='✕';
          rm.addEventListener('click', () => { if(games.length>1){ games.splice(gIdx,1); draw(); } });
          row.appendChild(rm);
        }
        container.appendChild(row);
      });
      if(canEdit){
        const addBtn = document.createElement('button'); addBtn.type='button'; addBtn.className='add-game-btn'; addBtn.textContent='+ Add game';
        addBtn.addEventListener('click', () => { games.push({a:null,b:null}); draw(); });
        container.appendChild(addBtn);
      }
      totalRowEl = document.createElement('div'); totalRowEl.className='total-diff-row';
      container.appendChild(totalRowEl);
      updateTotal();
    }
    draw();
    return { getGames: () => games };
  }

        }

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelectorAll('.mvp-dropdown-menu.show').forEach(m => { if(m !== menu) m.classList.remove('show'); });
          menu.classList.toggle('show');
        });

        renderTrigger();
        renderMenu();
      }
      if(pendingMvpByMatch[matchKey] === undefined) pendingMvpByMatch[matchKey] = existing ? (existing.mvp || null) : null;

      function renderWinnerHighlight(){
        Array.from(pickRow.children).forEach(btn => {
          btn.classList.toggle('btn-primary', pendingWinner[matchKey] === btn.dataset.uid);
        });
        updateCaption();
        renderMvpPicker();
      }
      renderWinnerHighlight();
      card.appendChild(mvpContainer);

      const gamesContainer = document.createElement('div');
      gamesContainer.className = 'games-editor';
      card.appendChild(gamesContainer);
      const gamesCtrl = renderGamesEditor(gamesContainer, existing, matchKey, true, null);

      if(canEditPermission || showEditor){
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn btn-primary btn-sm';
        saveBtn.textContent = existing ? 'Save Correction' : 'Lock In Result';
        saveBtn.style.marginTop = '12px';
        saveBtn.addEventListener('click', async () => {
          const winner = pendingWinner[matchKey];
          if(!winner){ alert('Pick a winner first.'); return; }
          const loser = winner === match.a ? match.b : match.a;
          const games = gamesCtrl.getGames().filter(g => g.a != null && g.b != null);
          const wasOverride = !!(existing && existing.locked);
          const result = { winner, loser, games, locked: true, lockedBy: currentUser.uid, mvp: pendingMvpByMatch[matchKey] || null };
          try{
            await saveResult(result, wasOverride);
            delete editingKeys[matchKey];
          }catch(err){ alert('Could not save result: ' + err.message); }
        });
        card.appendChild(saveBtn);

        if(isCommish){
          const forfeitBtn = document.createElement('button');
          forfeitBtn.className = 'btn btn-sm btn-danger';
          forfeitBtn.textContent = 'Force Result (Forfeit / No Game Data)';
          forfeitBtn.style.marginTop = '12px';
          forfeitBtn.style.marginLeft = '8px';
          forfeitBtn.addEventListener('click', async () => {
            const winner = pendingWinner[matchKey];
            if(!winner){ alert('Pick a winner first.'); return; }
            const loser = winner === match.a ? match.b : match.a;
            const result = { winner, loser, games: [], locked: true, lockedBy: currentUser.uid, forfeit: true, mvp: pendingMvpByMatch[matchKey] || null };
            try{
              await saveResult(result, false, true);
              delete editingKeys[matchKey];
            }catch(err){ alert('Could not save result: ' + err.message); }
          });
          card.appendChild(forfeitBtn);
        }
        if(!existing){
          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'btn btn-sm';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.style.marginTop = '12px';
          cancelBtn.style.marginLeft = '8px';
          cancelBtn.addEventListener('click', () => {
            matchFormOpen[matchKey] = false;
            renderMatch(league);
          });
          card.appendChild(cancelBtn);
        }
      }
    } else {
      // read-only, locked
      const capt = document.createElement('div');
      capt.className = 'games-caption';
      capt.innerHTML = '<span style="color:var(--gold);font-weight:700;">' + escapeHtml(trainerName(league, existing.winner)) + '</span> defeated ' + escapeHtml(trainerName(league, existing.loser)) + (existing.forfeit ? ' <span style="color:#FF8A8A;">(by forfeit)</span>' : '');
      card.appendChild(capt);
      if(existing.mvp){
        const winnerTrainer = league.draft.trainers.find(t => t.uid === existing.winner);
        const mvpMon = winnerTrainer ? (winnerTrainer.roster || []).find(m => m.id === existing.mvp) : null;
        if(mvpMon){
          const mvpRow = document.createElement('div');
          mvpRow.className = 'mvp-display';
          mvpRow.appendChild(makeSpriteImg(mvpMon, 'mvp-display-sprite'));
          const mvpLabel = document.createElement('span');
          mvpLabel.innerHTML = '<span class="mvp-display-tag">MVP</span> ' + escapeHtml(mvpMon.name) + (mvpMon.variation ? ' (' + escapeHtml(mvpMon.variation) + ')' : '');
          mvpRow.appendChild(mvpLabel);
          card.appendChild(mvpRow);
        }
      }
      if(!existing.forfeit){
        const gamesContainer = document.createElement('div');
        gamesContainer.className = 'games-editor';
        card.appendChild(gamesContainer);
        renderGamesEditor(gamesContainer, existing, matchKey, false, null);
      }
      const lockTag = document.createElement('div');
      lockTag.className = 'settings-note';
      lockTag.textContent = '🔒 Result locked in';
      card.appendChild(lockTag);
      if(isCommish){
        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm';
        editBtn.style.marginTop = '10px';
        editBtn.textContent = 'Edit Result (Commissioner Override)';
        editBtn.addEventListener('click', () => {
          editingKeys[matchKey] = true;
          renderMatch(league);
        });
        card.appendChild(editBtn);
      }
    }

    return card;
  }

  async function maybeAnnounceKickoff(league, kind, idx, matches, label){
    const trackField = kind === 'week' ? 'weeksAnnounced' : 'playoffRoundsAnnounced';
    const already = league[trackField] && league[trackField][idx];
    if(already) return;
    if(matches.some(m => !m.a || !m.b)) return; // wait until matchups are fully decided
    const headerTitle = kind === 'week' ? ('📅 Week ' + (idx + 1) + ' Matchups — ' + (league.name || 'League')) : ('🏆 ' + label + ' Matchups — ' + (league.name || 'League'));

    // Group into chunks of at most 3 matchups (9 embeds) to stay safely under Discord's 10-embed cap
    const groups = [];
    let current = [];
    matches.forEach(m => {
      current.push(m);
      if(current.length >= 2){ groups.push(current); current = []; }
    });
    if(current.length) groups.push(current);

    for(let groupIdx = 0; groupIdx < groups.length; groupIdx++){
      const group = groups[groupIdx];
      const embeds = [];
      if(groupIdx > 0){
        embeds.push({ description: '▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬', color: 5132376 });
      }
      group.forEach((m, matchIdxInGroup) => {
        if(m.a === 'BYE' || m.b === 'BYE'){
          const who = m.a === 'BYE' ? m.b : m.a;
          const t = league.draft.trainers.find(x => x.uid === who);
          const embed = { title: t ? t.name : trainerName(league, who), description: 'Bye this week', color: 16759813 };
          const logo = discordLogoFor(t);
          if(logo) embed.thumbnail = { url: logo };
          embeds.push(embed);
        } else {
          const tA = league.draft.trainers.find(x => x.uid === m.a);
          const tB = league.draft.trainers.find(x => x.uid === m.b);
          const logoA = discordLogoFor(tA), logoB = discordLogoFor(tB);
          const embedA = { title: tA ? tA.name : trainerName(league, m.a), color: 16759813 };
          if(logoA) embedA.thumbnail = { url: logoA };
          embeds.push(embedA);
          embeds.push({ description: '🆚', color: 16759813 });
          const embedB = { title: tB ? tB.name : trainerName(league, m.b), color: 16759813 };
          if(logoB) embedB.thumbnail = { url: logoB };
          embeds.push(embedB);
        }
        if(matchIdxInGroup < group.length - 1){
          embeds.push({ description: '▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬', color: 5132376 });
        }
      });
      await sendDiscordGeneral(groupIdx === 0 ? headerTitle : '', embeds);
    }
    const updatedTrack = Object.assign({}, league[trackField] || {}, { [idx]: true });
    try{
      await updateLeague({ [trackField]: updatedTrack });
    }catch(err){ /* non-critical */ }
  }

  function findActivePlayoffRound(bracket){
    if(!bracket) return null;
    for(let r = 0; r < bracket.rounds.length; r++){
      const round = bracket.rounds[r];
      const hasPending = round.matches.some(m => m.a && m.b && !m.locked);
      if(hasPending) return { roundIdx: r, round };
    }
    return null;
  }

  function makePlayoffSaveResult(league, roundIdx, matchIdx, nameA, nameB){
    return async function(result, wasOverride){
      const bracket = JSON.parse(JSON.stringify(league.playoffBracket));
      const match = bracket.rounds[roundIdx].matches[matchIdx];
      match.winner = result.winner; match.games = result.games; match.locked = true;
      match.forfeit = !!result.forfeit; match.mvp = result.mvp || null;
      if(bracket.rounds[roundIdx+1]){
        const nextMatch = bracket.rounds[roundIdx+1].matches[Math.floor(matchIdx/2)];
        if(nextMatch) nextMatch[matchIdx % 2 === 0 ? 'a' : 'b'] = result.winner;
      }
      const isChampion = roundIdx === bracket.rounds.length - 1;
      const updates = { playoffBracket: bracket };
      if(isChampion){
        updates.seasonComplete = true;
        updates.championUid = result.winner;
        updates.seasonCompletedAt = Date.now();
      }
      await updateLeague(updates);
      if(wasOverride){
        pushAnnouncement(league, 'match', 'Commissioner' + ' corrected the playoff result of ' + nameA + ' vs ' + nameB);
      } else {
        const mvpMon = result.mvp ? league.draft.trainers.find(t=>t.uid===result.winner).roster.find(m=>m.id===result.mvp) : null;
        const mvpNote = mvpMon ? (' — MVP: ' + mvpMon.name) : '';
        const forfeitNote = result.forfeit ? ' by forfeit' : '';
        pushAnnouncement(league, isChampion ? 'season_complete' : 'match', isChampion
          ? '🏆 ' + trainerName(league, result.winner) + ' has won the championship! The season is complete.'
          : trainerName(league, result.winner) + ' advances to the next round' + forfeitNote + mvpNote, mvpMon ? [mvpMon] : [], mvpMon ? mvpMon.id : null);
        if(isChampion){
          sendDiscordGeneral('🎊 **' + trainerName(league, result.winner) + '** has won the championship! 🏆', discordMatchEmbed(league.draft.trainers.find(t=>t.uid===result.winner), null));
        } else {
          sendDiscordGeneral('🏆 **' + trainerName(league, result.winner) + '** defeated **' + trainerName(league, result.loser) + '**' + forfeitNote + mvpNote + ' (Playoffs)', discordMatchEmbed(league.draft.trainers.find(t=>t.uid===result.winner), mvpMon));
        }
      }
    };
  }

  let matchSeenMarked = false;
  function markMatchSeen(league){
    if(matchSeenMarked || !currentUser || !league.draft) return;
    let token = null;
    if(league.playoffBracket){
      for(let r = 0; r < league.playoffBracket.rounds.length; r++){
        if(league.playoffBracket.rounds[r].matches.some(m => m.a && m.b && !m.locked)){ token = 'p' + r; break; }
      }
    } else if(league.schedule && league.schedule.weeks && league.schedule.weeks.length){
      const diffDays = Math.floor((Date.now() - league.schedule.startDate) / 86400000);
      const idx = Math.min(Math.max(Math.floor(diffDays / 7), 0), league.schedule.weeks.length - 1);
      token = 'w' + idx;
    }
    if(token === null) return;
    const idx2 = league.draft.trainers.findIndex(t => t.uid === currentUser.uid);
    if(idx2 < 0) return;
    if(league.draft.trainers[idx2].matchSeenToken === token) return;
    matchSeenMarked = true;
    const updatedTrainers = league.draft.trainers.map((t, i) => i === idx2 ? Object.assign({}, t, { matchSeenToken: token }) : t);
    updateLeague({ ['draft.trainers']: updatedTrainers }).catch(() => { matchSeenMarked = false; });
  }

  function renderMatch(league){
    currentLeague = league;
    const isCommish = currentUser && league.commissionerUid === currentUser.uid;
    const subnavCommish = document.getElementById('subnavCommish');
    if(subnavCommish) subnavCommish.style.display = isCommish ? '' : 'none';
    const subnavDraft = document.getElementById('subnavDraft');
    if(subnavDraft) subnavDraft.style.display = '';
    updateNavGlow(league);
    markMatchSeen(league);

    if(!league.draft){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Match</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        '<div class="panel state-msg">Matches open up once your league\'s draft is complete.</div>';
      return;
    }

    const myUid = currentUser ? currentUser.uid : null;

    // Playoffs take over once a bracket exists and has an active round
    if(league.playoffBracket){
      const active = findActivePlayoffRound(league.playoffBracket);
      if(active){
        maybeAnnounceKickoff(league, 'playoff', active.roundIdx, active.round.matches, active.round.label);
        content.innerHTML =
          '<div class="page-head">' +
            (league.logo ? '<img class="league-logo-header" src="' + escapeHtml(league.logo) + '" alt="">' : '') +
            '<span class="eyebrow">Match — Playoffs</span>' +
            '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
            '<p style="color:var(--cream-dim);font-size:13.5px;margin-top:8px;">' + escapeHtml(active.round.label) + ' · the regular season is complete</p>' +
          '</div>' +
          '<div id="matchesWrap"></div>';
        const wrap = document.getElementById('matchesWrap');
        active.round.matches.forEach((match, matchIdx) => {
          if(!match.a || !match.b) return; // not yet determined, waiting on a previous round
          const matchKey = 'p_' + active.roundIdx + '_' + matchIdx;
          const existing = match.locked ? match : null;
          const nameA = trainerName(league, match.a), nameB = trainerName(league, match.b);
          const saveResult = makePlayoffSaveResult(league, active.roundIdx, matchIdx, nameA, nameB);
          wrap.appendChild(renderMatchCard(league, matchKey, match, existing, saveResult, true, isCommish, myUid));
        });
        return;
      }
      if(league.seasonComplete){
        const championTrainer = league.draft.trainers.find(t => t.uid === league.championUid);
        content.innerHTML =
          '<div class="page-head">' +
            (league.logo ? '<img class="league-logo-header" src="' + escapeHtml(league.logo) + '" alt="">' : '') +
            '<span class="eyebrow">Match</span>' +
            '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
          '</div>' +
          '<div class="panel" style="text-align:center;padding:36px 20px;">' +
            '<div class="settings-note" style="margin-bottom:10px;">🏆 Season Complete</div>' +
            (championTrainer ? '<div style="font-family:var(--display);font-size:28px;text-transform:uppercase;color:var(--gold);">' + escapeHtml(championTrainer.name) + ' — Champion</div>' : '') +
            '<a href="standing.html?id=' + leagueId + '" style="display:inline-block;margin-top:14px;color:var(--cream-dim);text-decoration:underline;font-size:13px;">View final standings and bracket →</a>' +
          '</div>';
        return;
      }
    }

    if(!league.schedule){
      content.innerHTML =
        '<div class="page-head"><span class="eyebrow">Match</span><h1>' + escapeHtml(league.name || 'League') + '</h1></div>' +
        (isCommish
          ? '<div class="panel"><h2 style="margin-bottom:12px;">Generate Season Schedule</h2><p class="settings-note" style="margin-bottom:14px;">Weeks run Monday–Sunday. Pick any date and it\'ll snap to the Monday of that week.</p>' +
              '<div class="field-inline" style="margin-bottom:16px;"><label for="seasonStartInput">Season starts</label><input type="date" id="seasonStartInput"></div>' +
              '<div style="display:flex;gap:10px;"><button class="btn btn-primary btn-sm" id="genSingleBtn">Single Round Robin</button><button class="btn btn-sm" id="genDoubleBtn">Double Round Robin</button></div></div>'
          : '<div class="panel state-msg">The commissioner hasn\'t generated a schedule yet.</div>');
      if(isCommish){
        const startInput = document.getElementById('seasonStartInput');
        const defaultDate = new Date(upcomingOrTodayMonday());
        startInput.value = defaultDate.getFullYear() + '-' + String(defaultDate.getMonth()+1).padStart(2,'0') + '-' + String(defaultDate.getDate()).padStart(2,'0');
        function chosenStartTs(){
          const parts = startInput.value.split('-').map(Number);
          const chosen = new Date(parts[0], parts[1]-1, parts[2]);
          const day = chosen.getDay();
          const daysBack = day === 0 ? 6 : (day - 1);
          chosen.setDate(chosen.getDate() - daysBack);
          chosen.setHours(0,0,0,0);
          return chosen.getTime();
        }
        document.getElementById('genSingleBtn').addEventListener('click', () => generateSchedule(league, false, chosenStartTs()));
        document.getElementById('genDoubleBtn').addEventListener('click', () => generateSchedule(league, true, chosenStartTs()));
      }
      return;
    }

    const numWeeks = league.schedule.weeks.length;
    const trueWeekIdx = currentWeekIndex(league.schedule.startDate, numWeeks);
    if(viewingWeekIdx === null || viewingWeekIdx >= numWeeks) viewingWeekIdx = trueWeekIdx;
    const weekIdx = viewingWeekIdx;
    const round = league.schedule.weeks[weekIdx];
    const isTrueCurrentWeek = weekIdx === trueWeekIdx;
    if(Date.now() >= league.schedule.startDate){
      maybeAnnounceKickoff(league, 'week', trueWeekIdx, league.schedule.weeks[trueWeekIdx].matches);
    }

    content.innerHTML =
      '<div class="page-head">' +
        (league.logo ? '<img class="league-logo-header" src="' + escapeHtml(league.logo) + '" alt="">' : '') +
        '<span class="eyebrow">Match</span>' +
        '<h1>' + escapeHtml(league.name || 'League') + '</h1>' +
        '<div class="week-nav">' +
          '<button class="week-nav-btn" id="prevWeekBtn"' + (weekIdx === 0 ? ' disabled' : '') + '>&larr; Prev</button>' +
          '<span class="week-nav-label">Week ' + (weekIdx+1) + ' of ' + numWeeks + (isTrueCurrentWeek ? ' <span class="week-nav-current">(Current)</span>' : '') + '<br>' + weekDateRange(league.schedule.startDate, weekIdx) + '</span>' +
          '<button class="week-nav-btn" id="nextWeekBtn"' + (weekIdx === numWeeks - 1 ? ' disabled' : '') + '>Next &rarr;</button>' +
        '</div>' +
      '</div>' +
      (!isTrueCurrentWeek ? '<p class="settings-note" style="margin:-10px 0 16px;">You\'re viewing a different week — only the current week\'s matches can have results entered.</p>' : '') +
      '<div id="matchesWrap"></div>';

    document.getElementById('prevWeekBtn').addEventListener('click', () => {
      if(viewingWeekIdx > 0){ viewingWeekIdx--; renderMatch(currentLeague); }
    });
    document.getElementById('nextWeekBtn').addEventListener('click', () => {
      if(viewingWeekIdx < numWeeks - 1){ viewingWeekIdx++; renderMatch(currentLeague); }
    });

    const wrap = document.getElementById('matchesWrap');
    round.matches.forEach((match, matchIdx) => {
      const matchKey = weekIdx + '_' + matchIdx;
      const existing = (league.schedule.results || {})[matchKey];
      const nameA = trainerName(league, match.a), nameB = trainerName(league, match.b);
      const saveResult = async (result, wasOverride) => {
        await updateLeague({ ['schedule.results.' + matchKey]: result });
        if(wasOverride){
          pushAnnouncement(league, 'match', 'Commissioner' + ' corrected the result of ' + nameA + ' vs ' + nameB);
        } else {
          const mvpMon = result.mvp ? league.draft.trainers.find(t=>t.uid===result.winner).roster.find(m=>m.id===result.mvp) : null;
          const mvpNote = mvpMon ? ('Match MVP: ' + mvpMon.name) : '';
          const diffNote = result.games.length ? (' (differential: ' + (matchDifferential(result)>0?'+':'. ') + matchDifferential(result) + ')') : '';
          pushAnnouncement(league, 'match', trainerName(league, result.winner) + ' defeated ' + trainerName(league, result.loser) + diffNote + mvpNote, mvpMon ? [mvpMon] : [], mvpMon ? mvpMon.id : null);
          sendDiscordGeneral('🏆 **' + trainerName(league, result.winner) + '** defeated **' + trainerName(league, result.loser) + '**' + diffNote + (mvpMon ? (' — MVP: **' + mvpMon.name + '**') : ''), discordMatchEmbed(league.draft.trainers.find(t=>t.uid===result.winner), mvpMon));
        }
      };
      wrap.appendChild(renderMatchCard(league, matchKey, match, existing, saveResult, isTrueCurrentWeek, isCommish, myUid));
    });
  }


  function loadLeague(){
    if(!leagueId){
      content.innerHTML = '<div class="state-msg error">No league specified — use a link from the sign-in page.</div>';
      return;
    }
    subscribeLeague((snap) => {
      if(!snap.exists()){
        content.innerHTML = '<div class="state-msg error">This league doesn\'t exist or was deleted.</div>';
        return;
      }
      renderMatch(snap.data());
    }, (err) => {
      content.innerHTML = '<div class="state-msg error">Could not load league: ' + escapeHtml(err.message) + '</div>';
    });
  }

  const navSignedOut = document.getElementById('navSignedOut');
  const navSignedIn = document.getElementById('navSignedIn');
  const navUserEmail = document.getElementById('navUserEmail');
  const navSignOutBtn = document.getElementById('navSignOutBtn');
  navSignOutBtn.addEventListener('click', () => signOut());


  onUserChange( (user) => {
    currentUser = user;
    if(user){
      navSignedOut.style.display = 'none';
      navSignedIn.style.display = 'flex';
      navUserEmail.textContent = user.displayName || 'Trainer';
    } else {
      navSignedOut.style.display = '';
      navSignedIn.style.display = 'none';
    }
    if(!user){
      content.innerHTML = '<div class="state-msg">Please <a href="signin.html" style="color:var(--gold);text-decoration:underline;">sign in</a> first.</div>';
      return;
    }
    loadLeague();
  });
</script>
